      case 'cyl': {
        m = mesh(cylGeo(p.r2 * M, p.r * M, p.h * M, p.seg || 24), mat);
        m.position.set(p.x * M, (p.z + p.h / 2) * M, p.y * M);
        if (p.sx || p.sy) m.scale.set(p.sx || 1, 1, p.sy || 1);
        break;
      }
      case 'sph': {
        m = mesh(sphereGeo, mat);
        m.scale.set(Math.max(p.rx, 0.1) * M, Math.max(p.rz, 0.1) * M, Math.max(p.ry, 0.1) * M);
        m.position.set(p.x * M, p.z * M, p.y * M);
        break;
      }
      case 'hcyl': {
        m = mesh(cylGeo(p.r * M, p.r * M, p.len * M, 22), mat);
        m.position.set(p.x * M, p.z * M, p.y * M);
        if (p.axis === 'x') m.rotation.z = Math.PI / 2;
        else m.rotation.x = Math.PI / 2;
        break;
      }
      default:
        return null;
    }
    return m;
  }

  function polyMesh(verts, faces, mats) {
    // verts in item-local cm (x, y=front, z=up); faces: [[indices...], group]
    const out = [];
    const V = verts.map((v) => [v[0] * M, v[2] * M, v[1] * M]);
    for (const [idx, g] of faces) {
      const a = V[idx[0]], b = V[idx[1]], c = V[idx[2]];
      const ab = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], ac = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
      let n = [ab[1] * ac[2] - ab[2] * ac[1], ab[2] * ac[0] - ab[0] * ac[2], ab[0] * ac[1] - ab[1] * ac[0]];
      const l = Math.hypot(...n) || 1;
      n = n.map((x) => x / l);
      for (let k = 1; k + 1 < idx.length; k++) {
        const p0 = V[idx[0]], p1 = V[idx[k]], p2 = V[idx[k + 1]];
        const uv = (p) => [p[0] + p[2], p[1]];
        out.push({ p: [p0, p1, p2], n, uv: [uv(p0), uv(p1), uv(p2)], g });
      }
    }
    const geo = buildGroupedGeometry(out);
    return mesh(geo, mats);
  }

  function roofObject(kind, it, def) {
    const w = it.w, d = it.d, h = it.h, hw = w / 2, hd = d / 2;
    const roofM = stdMat({ color: it.color || def.color, rough: 0.8 });
    const gableM = stdMat({ color: it.color2 || def.color2 || '#ece8e1', rough: 0.9 });
    const under = stdMat({ color: '#d9d6cf', rough: 0.95 });
    const mats = [roofM, gableM, under];
    let m;
    if (kind === 'gable') {
      const v = [[-hw, -hd, 0], [hw, -hd, 0], [hw, hd, 0], [-hw, hd, 0], [-hw, 0, h], [hw, 0, h]];
      // outward orientation is handled by explicit normals per face order
      m = polyMesh(v, [[[0, 1, 5, 4], 0], [[2, 3, 4, 5], 0], [[3, 0, 4], 1], [[1, 2, 5], 1], [[0, 3, 2, 1], 2]], mats);
    } else if (kind === 'hip') {
      let v, f;
      if (w >= d) {
        const rx = (w - d) / 2;
        v = [[-hw, -hd, 0], [hw, -hd, 0], [hw, hd, 0], [-hw, hd, 0], [-rx, 0, h], [rx, 0, h]];
        f = [[[0, 1, 5, 4], 0], [[2, 3, 4, 5], 0], [[3, 0, 4], 0], [[1, 2, 5], 0], [[0, 3, 2, 1], 2]];
      } else {
        const ry = (d - w) / 2;
        v = [[-hw, -hd, 0], [hw, -hd, 0], [hw, hd, 0], [-hw, hd, 0], [0, -ry, h], [0, ry, h]];
        f = [[[0, 1, 4], 0], [[2, 3, 5], 0], [[3, 0, 4, 5], 0], [[1, 2, 5, 4], 0], [[0, 3, 2, 1], 2]];
      }
      m = polyMesh(v, f, mats);
    } else if (kind === 'shed') {
      const v = [[-hw, -hd, 0], [hw, -hd, 0], [hw, hd, 0], [-hw, hd, 0], [-hw, -hd, h], [hw, -hd, h]];
      m = polyMesh(v, [[[3, 2, 5, 4], 0], [[0, 4, 5, 1], 1], [[0, 3, 4], 1], [[1, 5, 2], 1], [[0, 1, 2, 3], 2]], mats);
    } else {
      m = mesh(boxGeo(w * M, h * M, d * M, 0), roofM);
      m.position.y = (h / 2) * M;
    }
    // make faces render from both sides for robustness with custom winding
    if (m.material && Array.isArray(m.material)) m.material = m.material.map((x) => doubleSided(x));
    return m;
  }
  function doubleSided(m) {
    const key = m.uuid + ':ds';
    if (matCache.has(key)) return matCache.get(key);
    const c = m.clone();
    c.side = THREE.DoubleSide;
    matCache.set(key, c);
    return c;
  }

  function buildItem(it) {
    const def = ITEMS[it.type];
    const g = new THREE.Group();
    if (!def) return g;
    if (def.custom) g.add(roofObject(def.custom, it, def));
    else for (const p of itemParts(it)) {
      const m = partMesh(p, it, def);
      if (m) g.add(m);
    }
    g.position.set(it.x * M, (it.elev || 0) * M, it.y * M);
    g.rotation.y = -rad(it.rot || 0);
    if (it.flip) g.scale.x = -1;
    g.traverse((o) => { o.userData.pick = { kind: 'item', id: it.id }; });
    return g;
  }

  // ------------------------------------------------------------------ openings
  function frameMat(color) {
    return stdMat({ color: color || '#f4f3ef', rough: 0.5 });
  }
  const glassMat = () => stdMat({ color: '#cfe3ec', rough: 0.04, metal: 0.1, opacity: 0.3, env: 1 });

  function addBox(g, w, h, d, x, y, z, mat) {
    const m = mesh(boxGeo(w, h, d, 0), mat);
    m.position.set(x, y, z);
    g.add(m);
    return m;
  }

  function buildOpeningModel(o, thicknessCm, insideSide, doorsOpen) {
    const def = OPENINGS[o.type];
    const g = new THREE.Group();
    if (!def) return g;
    const W = o.width * M, H = o.height * M, T = thicknessCm * M, S = (o.sill || 0) * M;
    const fw = 0.06, fd = Math.max(0.06, T + 0.016);
    const fm = frameMat(o.color || def.color);
    const sg = o.swing ? -1 : 1;
    const kind = def.kind;
    const jambs = (depth = fd, z = 0) => {
      addBox(g, fw, H, depth, -W / 2 + fw / 2, S + H / 2, z, fm);
      addBox(g, fw, H, depth, W / 2 - fw / 2, S + H / 2, z, fm);
      addBox(g, W, fw, depth, 0, S + H - fw / 2, z, fm);
    };
    const leaf = (lw, hingeX, dir, mat, glass) => {
      // leaf hinged at hingeX (local x), extends towards dir (+1 / -1)
      const pivot = new THREE.Group();
      pivot.position.set(hingeX, S, sg * (T / 2 - 0.025));
      const lh = H - fw - 0.01;
      if (glass) {
        const t = 0.04, b = 0.07;
        const lg = new THREE.Group();
        addBox(lg, b, lh, t, dir * (b / 2), lh / 2, 0, mat);
        addBox(lg, b, lh, t, dir * (lw - b / 2), lh / 2, 0, mat);
        addBox(lg, lw, b, t, dir * (lw / 2), b / 2, 0, mat);
        addBox(lg, lw, b, t, dir * (lw / 2), lh - b / 2, 0, mat);
        addBox(lg, lw - 2 * b, lh - 2 * b, 0.01, dir * (lw / 2), lh / 2, 0, glassMat());
        pivot.add(lg);
      } else {
        addBox(pivot, lw, lh, 0.04, dir * (lw / 2), lh / 2, 0, mat);
      }
      const hx = dir * (lw - 0.08);
      const hm = stdMat({ color: '#c9cdd1', rough: 0.25, metal: 0.9 });
      addBox(pivot, 0.12, 0.02, 0.02, hx - dir * 0.04, 1.05 - S + 0, 0.04, hm);
      addBox(pivot, 0.12, 0.02, 0.02, hx - dir * 0.04, 1.05 - S + 0, -0.04, hm);
      if (doorsOpen) pivot.rotation.y = dir * sg * (Math.PI / 2) * 0.92 * -1;
      g.add(pivot);
      return pivot;
    };
    switch (kind) {
      case 'door': {
        jambs();
        const lw = W - 2 * fw;
        const hingeX = o.flip ? W / 2 - fw : -W / 2 + fw;
        const leafMat = def.solid ? stdMat({ color: o.color || def.color, rough: 0.45 }) : fm;
        leaf(lw, hingeX, o.flip ? -1 : 1, leafMat, !!def.glass);
        break;
      }
      case 'double': {
        jambs();
        const lw = (W - 2 * fw) / 2;
        leaf(lw, -W / 2 + fw, 1, fm, false);
        leaf(lw, W / 2 - fw, -1, fm, false);
        break;
      }
      case 'sliding': {
        jambs(fd);
        const pw = (W - 2 * fw) / 2 + 0.04;
        for (const [x, z] of [[-W / 2 + fw + pw / 2, 0.025], [W / 2 - fw - pw / 2, -0.025]]) {
          const b = 0.06, ph = H - fw;
          addBox(g, b, ph, 0.04, x - pw / 2 + b / 2, S + ph / 2, z, fm);
          addBox(g, b, ph, 0.04, x + pw / 2 - b / 2, S + ph / 2, z, fm);
          addBox(g, pw, b, 0.04, x, S + b / 2, z, fm);
          addBox(g, pw, b, 0.04, x, S + ph - b / 2, z, fm);
          addBox(g, pw - 2 * b, ph - 2 * b, 0.01, x, S + ph / 2, z, glassMat());
        }
        break;
      }
      case 'garage': {
        jambs();
        const pm = stdMat({ color: o.color || def.color, rough: 0.5, metal: 0.2 });
        const panels = 4, ph = (H - fw) / panels;
        for (let i = 0; i < panels; i++) addBox(g, W - 2 * fw, ph - 0.012, 0.045, 0, S + ph * (i + 0.5), -sg * (T / 2 - 0.05), pm);
        break;
      }
      case 'passage':
        break;
      default: {
        // windows, french windows, fixed glazing
        const depth = 0.08;
        jambs(depth, 0);
        addBox(g, W, fw, depth, 0, S + fw / 2, 0, fm);
        const panes = kind === 'fixed' ? 1 : def.panes || 1;
        const innerW = W - 2 * fw;
        for (let i = 1; i < panes; i++) addBox(g, fw * 0.9, H - 2 * fw, depth, -W / 2 + fw + (innerW * i) / panes, S + H / 2, 0, fm);
        const paneW = innerW / panes;
        for (let i = 0; i < panes; i++) {
          const cx = -W / 2 + fw + paneW * (i + 0.5);
          if (kind !== 'fixed') {
            const b = 0.045;
            addBox(g, b, H - 2 * fw, 0.06, cx - paneW / 2 + b / 2 + 0.01, S + H / 2, 0, fm);
            addBox(g, b, H - 2 * fw, 0.06, cx + paneW / 2 - b / 2 - 0.01, S + H / 2, 0, fm);
            addBox(g, paneW - 0.02, b, 0.06, cx, S + fw + b / 2, 0, fm);
            addBox(g, paneW - 0.02, b, 0.06, cx, S + H - fw - b / 2, 0, fm);
          }
          addBox(g, paneW - 0.04, H - 2 * fw - 0.04, 0.012, cx, S + H / 2, 0, glassMat());
        }
        if (S > 0.05 && insideSide) {
          addBox(g, W + 0.06, 0.025, 0.07, 0, S - 0.0125, insideSide * (T / 2 + 0.01), stdMat({ color: '#f1efea', rough: 0.4 }));
          addBox(g, W + 0.04, 0.02, 0.08, 0, S - 0.03, -insideSide * (T / 2 + 0.02), stdMat({ color: '#9aa0a5', rough: 0.4, metal: 0.6 }));
        }
      }
    }
    return g;
  }

  // ------------------------------------------------------------------ structure per level
  function wallTopFor(lv, levels) {
    const above = levels.find((l) => l.elevation > lv.elevation);
    return above ? Math.max(lv.height, above.elevation - lv.elevation) : lv.height;
  }

  function buildStructure(lv, levels, opts) {
    const g = new THREE.Group();
    const d = getDerived(lv);
    const roomById = new Map(lv.rooms.map((r) => [r.id, r]));
    const st = app.project.settings;
    const extMat = wallMaterial(st.exteriorColor || '#ece8e1', st.exteriorTex || 'plaster');
    const topDefault = wallTopFor(lv, levels);

    // floors, slabs, ceilings
    for (const f of d.faces) {
      const room = roomById.get(f.roomId);
      if (!room) continue;
      const shape = new THREE.Shape(f.poly.map((p) => new THREE.Vector2(p.x * M, -p.y * M)));
      if (room.showFloor !== false) {
        const geo = new THREE.ShapeGeometry(shape);
        geo.rotateX(-Math.PI / 2);
        const tile = floorTileSize(room.floor) * M;
        const uv = geo.attributes.uv;
        for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) / tile, uv.getY(i) / tile);
        const fm = mesh(geo, floorMaterial(room.floor), { cast: false });
        fm.position.y = 0.002;
        fm.userData.pick = { kind: 'room', id: room.id };
        g.add(fm);
        if (lv.elevation > 1) {
          const slab = new THREE.ExtrudeGeometry(shape, { depth: 0.2, bevelEnabled: false });
          slab.rotateX(-Math.PI / 2);
          const sm = mesh(slab, slabMat());
          sm.position.y = -0.2;
          sm.userData.pick = { kind: 'room', id: room.id };
          g.add(sm);
        }
      }
      if (opts.ceilings && room.ceiling !== false) {
        const cg = new THREE.ShapeGeometry(shape);
        cg.rotateX(-Math.PI / 2);
        const cm = mesh(cg, ceilingMat(), { cast: false });
        cm.position.y = lv.height * M - 0.002;
        g.add(cm);
      }
    }

    // walls
    for (const info of d.walls.values()) {
      const wall = info.wall;
      const H = wall.height == null ? topDefault : wall.height;
      const ops = lv.openings
        .filter((o) => o.wallId === wall.id && OPENINGS[o.type])
        .map((o) => ({ o, fr: openingFrame(lv, o) }))
        .filter((x) => x.fr)
        .sort((a, b) => a.fr.u0 - b.fr.u0);
      const cuts = [];
      for (const { fr } of ops) {
        if (cuts.length && fr.u0 <= cuts[cuts.length - 1][1]) cuts[cuts.length - 1][1] = Math.max(cuts[cuts.length - 1][1], fr.u1);
        else cuts.push([fr.u0, fr.u1]);
      }
      const ad = dot(info.a, info.d);
      const clipU = (poly, lo, hi) => {
        let p = poly;
        if (hi !== Infinity) p = clipHalfPlane(p, info.d, hi + ad);
        if (lo !== -Infinity && p.length) p = clipHalfPlane(p, mul(info.d, -1), -(lo + ad));
        return p;
      };
      const tris = [];
      const classify = (on) => {
        const k = dot(on, info.n);
        return k > 0.7 ? 0 : k < -0.7 ? 1 : 2;
      };
      let prev = -Infinity;
      for (const [u0, u1] of cuts) {
        const piece = clipU(info.poly, prev, u0);
        if (piece.length >= 3) prismTris(tris, piece, 0, H, classify);
        prev = u1;
      }
      const last = clipU(info.poly, prev, Infinity);
      if (last.length >= 3) prismTris(tris, last, 0, H, classify);
      for (const { o, fr } of ops) {
        const a0 = add(info.a, mul(info.d, fr.u0)), a1 = add(info.a, mul(info.d, fr.u1));
        const rect = [add(a0, mul(info.n, info.h)), add(a1, mul(info.n, info.h)), sub(a1, mul(info.n, info.h)), sub(a0, mul(info.n, info.h))];
        const top = Math.min(H, (o.sill || 0) + o.height);
        if ((o.sill || 0) > 0.5) prismTris(tris, rect, 0, Math.min(o.sill, H), classify);
        if (top < H - 0.5) prismTris(tris, rect, top, H, classify);
      }
      if (!tris.length) continue;
      const roomP = info.roomP && roomById.get(info.roomP);
      const roomN = info.roomN && roomById.get(info.roomN);
      const mP = roomP ? wallMaterial(roomP.wallColor || '#f4f2ee', roomP.wallTex) : extMat;
      const mN = roomN ? wallMaterial(roomN.wallColor || '#f4f2ee', roomN.wallTex) : extMat;
      const wm = mesh(buildGroupedGeometry(tris), [mP, mN, revealMat(), capMat()]);
      wm.userData.pick = { kind: 'wall', id: wall.id };
      g.add(wm);

      for (const { o, fr } of ops) {
        const inside = roomP && !roomN ? 1 : roomN && !roomP ? -1 : 0;
        const model = buildOpeningModel(o, wall.thickness, inside, !!app.project.settings.doorsOpen || opts.walk);
        const c = add(info.a, mul(info.d, fr.u));
        model.position.set(c.x * M, 0, c.y * M);
        model.rotation.y = Math.atan2(-info.d.y, info.d.x);
        model.traverse((x) => { x.userData.pick = { kind: 'opening', id: o.id }; });
        g.add(model);
        const def = OPENINGS[o.type];
        if ((o.sill || 0) < 1 && (!roomP || !roomN) && def.kind !== 'window') {
          // threshold for exterior doors
          const th = mesh(boxGeo(o.width * M, 0.02, wall.thickness * M + 0.02, 0), stdMat({ color: '#b9b4aa', rough: 0.8 }), { cast: false });
          th.position.set(c.x * M, 0.0, c.y * M);
          th.rotation.y = Math.atan2(-info.d.y, info.d.x);
          g.add(th);
        }
      }
    }
    return g;
  }

  // ------------------------------------------------------------------ sync scene with model
  const levelEntries = new Map();
  let showAll = false;
  let structureDirty = true;

  function structKey(lv, levels, opts) {
    const s = app.project.settings;
    return JSON.stringify([lv.walls, lv.openings, lv.rooms, lv.height, wallTopFor(lv, levels), s.exteriorColor, s.exteriorTex, s.doorsOpen, opts.ceilings, opts.walk]);
  }

  function sync() {
    const project = app.project;
    const levels = sortedLevels(project);
    const cur = app.level;
    const curIdx = levels.indexOf(cur);
    const visible = new Set(levels.filter((l, i) => showAll || i <= curIdx).map((l) => l.id));
    const opts = { ceilings: !!walk, walk: !!walk };
    for (const [id, e] of levelEntries) {
      if (!visible.has(id) || !project.levels.includes(e.level)) {
        root.remove(e.group);
        levelEntries.delete(id);
      }
    }
    for (const lv of levels) {
      if (!visible.has(lv.id)) continue;
      let e = levelEntries.get(lv.id);
      if (!e || e.level !== lv) {
        if (e) root.remove(e.group);
        e = { level: lv, group: new THREE.Group(), structKey: null, struct: null, items: new Map() };
        root.add(e.group);
        levelEntries.set(lv.id, e);
      }
      e.group.position.y = lv.elevation * M;
      const sk = structKey(lv, levels, opts);
      if (sk !== e.structKey) {
        if (e.struct) e.group.remove(e.struct);
        e.struct = buildStructure(lv, levels, opts);
        e.group.add(e.struct);
        e.structKey = sk;
      }
      const seen = new Set();
      for (const it of lv.items) {
        seen.add(it.id);
        const k = JSON.stringify(it);
        const ie = e.items.get(it.id);
        if (ie && ie.key === k) continue;
        if (ie) e.group.remove(ie.obj);
        const obj = buildItem(it);
        e.group.add(obj);
        e.items.set(it.id, { key: k, obj });
      }
      for (const [id, ie] of e.items) {
        if (!seen.has(id)) {
          e.group.remove(ie.obj);
          e.items.delete(id);
        }
      }
    }
    groundMat.color.set(project.settings.groundColor || '#a9b78f');
    updateSelection();
    updateSun();
    needsRender = true;
  }

  function updateSun() {
    const b = projectBounds(app.project) || { minX: 0, minY: 0, maxX: 1000, maxY: 800, w: 1000, h: 800 };
    const cx = ((b.minX + b.maxX) / 2) * M, cz = ((b.minY + b.maxY) / 2) * M;
    const r = (Math.max(b.w, b.h) * M) / 2 + 4;
    sun.position.set(cx - r * 0.9, r * 1.6 + 8, cz + r * 1.3);
    sun.target.position.set(cx, 0, cz);
    const cam = sun.shadow.camera;
    cam.left = -r * 1.3; cam.right = r * 1.3; cam.top = r * 1.3; cam.bottom = -r * 1.3;
    cam.near = 0.5; cam.far = r * 6 + 30;
    cam.updateProjectionMatrix();
  }

  function updateSelection() {
    const sel = app.selection.length === 1 ? app.selection[0] : null;
    selBox.visible = false;
    if (!sel || (sel.kind !== 'item' && sel.kind !== 'opening')) return;
    const e = levelEntries.get(app.level.id);
    if (!e) return;
    let obj = null;
    if (sel.kind === 'item') obj = e.items.get(sel.id)?.obj;
    else e.struct?.traverse((o) => { if (!obj && o.isGroup && o.userData.pick && o.userData.pick.id === sel.id) obj = o; });
    if (!obj) return;
    selBox.box.setFromObject(obj);
    selBox.visible = !selBox.box.isEmpty();
  }

  // ------------------------------------------------------------------ camera
  function visibleBounds() {
    const lv = app.level;
    if (lv.walls.length) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const w of lv.walls) for (const p of [w.a, w.b]) {
        minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
      }
      return { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY };
    }
    const b = levelBounds(lv) || projectBounds(app.project);
    return b || { minX: 0, minY: 0, maxX: 1000, maxY: 800, w: 1000, h: 800 };
  }

  function resetView(top = false) {
    const b = visibleBounds();
    const cx = ((b.minX + b.maxX) / 2) * M, cz = ((b.minY + b.maxY) / 2) * M;
    const y = app.level.elevation * M;
    const span = Math.max(b.w, b.h) * M;
    const dist0 = Math.max(6, span * 1.35) / Math.min(1, Math.max(0.55, camera.aspect));
    controls.target.set(cx, y + 0.6, cz);
    if (top) camera.position.set(cx, y + dist0 * 1.15, cz + 0.001);
    else camera.position.set(cx + dist0 * 0.55, y + dist0 * 0.78, cz + dist0 * 0.82);
    camera.near = 0.05;
    camera.updateProjectionMatrix();
    controls.update();
    needsRender = true;
  }

  // ------------------------------------------------------------------ walk mode
  let walk = null;
  const keys = new Set();
  let saved = null;

  function collisionSegments() {
    const lv = app.level;
    const d = getDerived(lv);
    const segs = [];
    for (const info of d.walls.values()) {
      const ops = lv.openings
        .filter((o) => o.wallId === info.id && OPENINGS[o.type])
        .map((o) => ({ o, fr: openingFrame(lv, o), def: OPENINGS[o.type] }))
        .filter((x) => x.fr && (x.o.sill || 0) < 40 && x.def.kind !== 'window' && x.def.kind !== 'fixed')
        .sort((a, b) => a.fr.u0 - b.fr.u0);
      let prev = 0;
      for (const { fr } of ops) {
        if (fr.u0 > prev + 1) segs.push({ a: add(info.a, mul(info.d, prev)), b: add(info.a, mul(info.d, fr.u0)), h: info.h });
        prev = fr.u1;
      }
      if (info.len > prev + 1) segs.push({ a: add(info.a, mul(info.d, prev)), b: info.b, h: info.h });
    }
    return segs;
  }

  function enterWalk() {
    if (walk) return;
    const lv = app.level;
    const d = getDerived(lv);
    let start = null;
    if (d.faces.length) {
      const f = [...d.faces].sort((a, b) => b.netArea - a.netArea)[0];
      start = f.label;
    } else {
      start = { x: controls.target.x / M, y: controls.target.z / M };
    }
    saved = { pos: camera.position.clone(), target: controls.target.clone(), fov: camera.fov };
    walk = { pos: { x: start.x, y: start.y }, yaw: -Math.PI / 2, pitch: -0.05, segs: collisionSegments(), last: performance.now() };
    controls.enabled = false;
    camera.fov = 68;
    camera.near = 0.05;
    camera.updateProjectionMatrix();
    structureDirtyAll();
    sync();
    app.emit('walk', true);
  }

  function exitWalk() {
    if (!walk) return;
    walk = null;
    keys.clear();
    controls.enabled = true;
    if (saved) {
      camera.position.copy(saved.pos);
      controls.target.copy(saved.target);
      camera.fov = saved.fov;
      camera.updateProjectionMatrix();
    }
    structureDirtyAll();
    sync();
    controls.update();
    app.emit('walk', false);
  }

  function structureDirtyAll() {
    for (const e of levelEntries.values()) e.structKey = null;
  }

  function stepWalk(dt) {
    const w = walk;
    let fx = 0, fz = 0;
    if (keys.has('w') || keys.has('arrowup')) fz += 1;
    if (keys.has('s') || keys.has('arrowdown')) fz -= 1;
    if (keys.has('a') || keys.has('arrowleft')) fx -= 1;
    if (keys.has('d') || keys.has('arrowright')) fx += 1;
    if (fx || fz) {
      const speed = (keys.has('shift') ? 300 : 140) * dt;
      const fwd = { x: Math.cos(w.yaw), y: Math.sin(w.yaw) };
      const right = { x: -fwd.y, y: fwd.x };
      const l = Math.hypot(fx, fz);
      let np = add(w.pos, mul(add(mul(fwd, fz / l), mul(right, fx / l)), speed));
      const R = 22;
      for (let iter = 0; iter < 3; iter++) {
        for (const s of w.segs) {
          const c = closestOnSegment(np, s.a, s.b);
          const minD = s.h + R;
          if (c.d < minD) {
            const dir = c.d > 0.01 ? norm(sub(np, c)) : perp(norm(sub(s.b, s.a)));
            np = add(c, mul(dir, minD));
          }
        }
      }
      w.pos = np;
      needsRender = true;
    }
    const lv = app.level;
    const eye = (lv.elevation + 160) * M;
    camera.position.set(w.pos.x * M, eye, w.pos.y * M);
    const look = new THREE.Vector3(Math.cos(w.yaw) * Math.cos(w.pitch), Math.sin(w.pitch), Math.sin(w.yaw) * Math.cos(w.pitch));
    camera.lookAt(camera.position.clone().add(look));
  }

  // ------------------------------------------------------------------ picking & dragging
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let down = null;

  function pick(cx, cy) {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects([root], true);
    for (const h of hits) {
      if (h.object.userData.pick) return { ...h.object.userData.pick, point: h.point };
    }
    const g = raycaster.intersectObject(ground);
    return g.length ? { kind: 'ground', point: g[0].point } : null;
  }

  function planePoint(cx, cy, y) {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -y);
    const p = new THREE.Vector3();
    return raycaster.ray.intersectPlane(plane, p) ? p : null;
  }

  const canvas = renderer.domElement;
  canvas.addEventListener('pointerdown', (e) => {
    down = { x: e.clientX, y: e.clientY, id: e.pointerId, moved: false, button: e.button };
    if (walk) {
      canvas.setPointerCapture(e.pointerId);
      down.yaw = walk.yaw;
      down.pitch = walk.pitch;
      return;
    }
    if (e.button !== 0) return;
    const hit = pick(e.clientX, e.clientY);
    if (hit && hit.kind === 'item' && app.selection.some((s) => s.kind === 'item' && s.id === hit.id)) {
      const it = app.level.items.find((i) => i.id === hit.id);
      const p = it && planePoint(e.clientX, e.clientY, app.level.elevation * M);
      if (it && p) {
        controls.enabled = false;
        canvas.setPointerCapture(e.pointerId);
        down.drag = { id: it.id, off: { x: it.x - p.x / M, y: it.y - p.z / M }, key: 'drag:' + uid() };
      }
    }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!down || e.pointerId !== down.id) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (!down.moved && Math.hypot(dx, dy) > 4) down.moved = true;
    if (walk && down.moved) {
      walk.yaw = down.yaw + dx * 0.005;
      walk.pitch = clamp(down.pitch - dy * 0.004, -1.2, 1.2);
      needsRender = true;
      return;
    }
    if (down.drag && down.moved) {
      const p = planePoint(e.clientX, e.clientY, app.level.elevation * M);
      if (!p) return;
      const it = app.level.items.find((i) => i.id === down.drag.id);
      if (!it) return;
      app.mutate(() => {
        it.x = r2(p.x / M + down.drag.off.x);
        it.y = r2(p.z / M + down.drag.off.y);
        if (!e.altKey) app.snapItem?.(it);
      }, down.drag.key);
    }
  });
  const endPointer = (e) => {
    if (!down || e.pointerId !== down.id) return;
    const d0 = down;
    down = null;
    if (d0.drag) controls.enabled = !walk;
    if (!d0.moved && !walk && d0.button === 0) {
      const hit = pick(e.clientX, e.clientY);
      if (hit && ['item', 'wall', 'opening', 'room'].includes(hit.kind)) app.select([{ kind: hit.kind, id: hit.id }]);
      else app.select([]);
    }
  };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('dblclick', (e) => {
    if (walk) return;
    const hit = pick(e.clientX, e.clientY);
    if (hit && hit.point) {
      controls.target.copy(hit.point);
      controls.update();
      needsRender = true;
    }
  });
  controls.addEventListener('change', () => { needsRender = true; });

  function onKey(e) {
    if (!walk) return false;
    const k = e.key.toLowerCase();
    if (k === 'escape') { exitWalk(); return true; }
    if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'shift'].includes(k)) {
      keys.add(k);
      return true;
    }
    return false;
  }
  function onKeyUp(e) {
    keys.delete(e.key.toLowerCase());
  }

  // ------------------------------------------------------------------ loop
  let needsRender = true;
  let visible = false;
  let running = false;
  let lastT = performance.now();

  function frame(t) {
    if (!visible) { running = false; return; }
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (t - lastT) / 1000);
    lastT = t;
    if (walk) stepWalk(dt);
    else if (controls.update()) needsRender = true;
    if (needsRender) {
      needsRender = false;
      renderer.render(scene, camera);
    }
  }

  function setVisible(v) {
    visible = v;
    if (v) {
      resize();
      sync();
      if (!running) {
        running = true;
        lastT = performance.now();
        requestAnimationFrame(frame);
      }
    }
  }

  function resize() {
    const r = host.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    needsRender = true;
  }
  new ResizeObserver(() => { if (visible) resize(); }).observe(host);

  function applyTheme() {
    const cs = getComputedStyle(document.documentElement);
    const top = cs.getPropertyValue('--sky-top').trim() || '#c9d9e3';
    const bottom = cs.getPropertyValue('--sky-bottom').trim() || '#eef2f2';
    const c = document.createElement('canvas');
    c.width = 4; c.height = 256;
    const ctx = c.getContext('2d');
    const gr = ctx.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, top);
    gr.addColorStop(0.62, bottom);
    gr.addColorStop(1, bottom);
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, 4, 256);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    if (scene.background && scene.background.dispose) scene.background.dispose();
    scene.background = t;
    scene.fog = new THREE.Fog(new THREE.Color(bottom), 70, 190);
    needsRender = true;
  }
  applyTheme();

  // ------------------------------------------------------------------ placement by drop
  function placeAt(kind, type, cx, cy) {
    const lv = app.level;
    const p = planePoint(cx, cy, lv.elevation * M);
    if (!p) return false;
    const w = { x: p.x / M, y: p.z / M };
    if (kind === 'item') {
      const def = ITEMS[type];
      const it = { ...defaultItem(type), id: uid('it_'), x: r2(w.x), y: r2(w.y) };
      if (def.mount === 'ceiling') it.elev = Math.max(0, lv.height - it.h);
      if (def.custom) it.elev = lv.height;
      app.snapItem?.(it);
      app.mutate(() => lv.items.push(it));
      app.select([{ kind: 'item', id: it.id }]);
      return true;
    }
    return app.placeOpeningNear(type, w);
  }

  // ------------------------------------------------------------------ thumbnails
  let thumbR = null, thumbScene = null, thumbCam = null;
  const thumbQueue = [];
  let thumbBusy = false;
  function initThumbs() {
    if (thumbR) return;
    thumbR = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    thumbR.setPixelRatio(1);
    thumbR.setSize(160, 160, false);
    thumbR.toneMapping = THREE.ACESFilmicToneMapping;
    thumbR.toneMappingExposure = 1.1;
    thumbScene = new THREE.Scene();
    thumbScene.environment = new THREE.PMREMGenerator(thumbR).fromScene(new RoomEnvironment(thumbR), 0.04).texture;
    thumbScene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a8a, 0.8));
    const dl = new THREE.DirectionalLight(0xffffff, 1.6);
    dl.position.set(3, 6, 4);
    thumbScene.add(dl);
    thumbCam = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
  }
  function renderThumb(kind, type) {
    initThumbs();
    let obj;
    if (kind === 'item') {
      const it = { ...defaultItem(type), id: 'thumb', x: 0, y: 0, elev: 0 };
      obj = buildItem(it);
      obj.position.set(0, 0, 0);
    } else {
      const def = OPENINGS[type];
      obj = buildOpeningModel({ type, width: def.w, height: def.h, sill: 0, color: def.color, flip: false, swing: false }, 12, 0, false);
      const wallM = stdMat({ color: '#d7d3cc', rough: 0.9 });
      const W = def.w * M, H = def.h * M;
      addBox(obj, 0.25, H + 0.25, 0.12, -W / 2 - 0.125, (H + 0.25) / 2, 0, wallM);
      addBox(obj, 0.25, H + 0.25, 0.12, W / 2 + 0.125, (H + 0.25) / 2, 0, wallM);
      addBox(obj, W, 0.25, 0.12, 0, H + 0.125, 0, wallM);
    }
    const box = new THREE.Box3().setFromObject(obj);
    const sphere = box.getBoundingSphere(new THREE.Sphere());
    const c = sphere.center;
    const r = Math.max(sphere.radius, 0.05);
    const az = kind === 'item' ? rad(35) : rad(20), el = kind === 'item' ? rad(28) : rad(8);
    const dd = r / Math.sin(rad(15)) * 1.02;
    thumbCam.position.set(c.x + dd * Math.sin(az) * Math.cos(el), c.y + dd * Math.sin(el), c.z + dd * Math.cos(az) * Math.cos(el));
    thumbCam.near = dd / 50;
    thumbCam.far = dd * 4;
    thumbCam.updateProjectionMatrix();
    thumbCam.lookAt(c);
    thumbScene.add(obj);
    thumbR.render(thumbScene, thumbCam);
    thumbScene.remove(obj);
    return thumbR.domElement.toDataURL('image/png');
  }
  function queueThumb(kind, type, cb) {
    thumbQueue.push({ kind, type, cb });
    if (!thumbBusy) {
      thumbBusy = true;
      const step = () => {
        const t0 = performance.now();
        while (thumbQueue.length && performance.now() - t0 < 24) {
          const j = thumbQueue.shift();
          try { j.cb(renderThumb(j.kind, j.type)); } catch (e) { j.cb(null); }
        }
        if (thumbQueue.length) requestAnimationFrame(step);
        else thumbBusy = false;
      };
      requestAnimationFrame(step);
    }
  }

  async function exportPngBlob() {
    const old = renderer.getPixelRatio();
    renderer.setPixelRatio(Math.max(2, old));
    const r = host.getBoundingClientRect();
    renderer.setSize(Math.round(r.width), Math.round(r.height), false);
    renderer.render(scene, camera);
    const blob = await new Promise((res) => renderer.domElement.toBlob(res, 'image/png'));
    renderer.setPixelRatio(old);
    renderer.setSize(Math.round(r.width), Math.round(r.height), false);
    needsRender = true;
    return blob;
  }

  return {
    el: canvas,
    sync() { if (visible) sync(); else structureDirty = true; },
    setVisible,
    resize,
    resetView,
    topView: () => resetView(true),
    enterWalk,
    exitWalk,
    get walking() { return !!walk; },
    setShowAll(v) { showAll = v; sync(); },
    get showAll() { return showAll; },
    onKey,
    onKeyUp,
    walkKey(k, on) { if (on) keys.add(k); else keys.delete(k); },
    queueThumb,
    placeAt,
    exportPngBlob,
    applyTheme,
    refreshSelection() { updateSelection(); needsRender = true; },
    targetPlan() { return { x: controls.target.x / M, y: controls.target.z / M }; },
  };
}
return { createView3D };
})();

// ---- storage.js ----
const { createStorage } = (() => {
// Grundriss Studio – persistence: browser storage, optional cloud (claude db capability), file downloads


const LS_INDEX = 'gs.index.v1';
const LS_LAST = 'gs.last.v1';
const lsKey = (id) => 'gs.p.' + id;

function lsGet(k) {
  try { return localStorage.getItem(k); } catch (e) { return null; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
}
function lsDel(k) {
  try { localStorage.removeItem(k); } catch (e) { /* ignore */ }
}

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(36) + ':' + s.length;
}

function createStorage(app) {
  let db = null;
  let userId = null;
  let downloads = null;
  let downloadsState = window.claude && window.claude.use ? 'pending' : 'native';
  const assetHashes = new Map();
  let cloudChain = Promise.resolve();
  let state = 'idle';

  const setState = (s, detail) => {
    state = s;
    app.emit('save-state', s, detail);
  };

  // ------------------------------------------------------------------ local
  function localIndex() {
    try {
      const v = JSON.parse(lsGet(LS_INDEX) || '[]');
      return Array.isArray(v) ? v : [];
    } catch (e) {
      return [];
    }
  }
  function writeIndex(list) {
    lsSet(LS_INDEX, JSON.stringify(list.slice(0, 200)));
  }
  function summary(p) {
    return { id: p.id, name: p.name, updatedAt: p.updatedAt, levels: p.levels.length };
  }
  function saveLocal(p) {
    let ok = lsSet(lsKey(p.id), JSON.stringify(p));
    let partial = false;
    if (!ok) {
      const lite = { ...p, assets: {}, levels: p.levels.map((l) => ({ ...l, background: null })) };
      ok = lsSet(lsKey(p.id), JSON.stringify(lite));
      partial = ok;
    }
    if (ok) {
      const idx = localIndex().filter((e) => e.id !== p.id);
      idx.unshift(summary(p));
      writeIndex(idx);
      lsSet(LS_LAST, p.id);
    }
    return { ok, partial };
  }
  function loadLocal(id) {
    try {
      const s = lsGet(lsKey(id));
      return s ? JSON.parse(s) : null;
    } catch (e) {
      return null;
    }
  }
  function deleteLocal(id) {
    lsDel(lsKey(id));
    writeIndex(localIndex().filter((e) => e.id !== id));
  }
  function loadLast() {
    const id = lsGet(LS_LAST);
    return id ? loadLocal(id) : null;
  }

  // ------------------------------------------------------------------ cloud
  async function initCloud() {
    if (!window.claude || !window.claude.use) return false;
    try {
      const [dbNs, userNs] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!dbNs || !userNs) return false;
      const id = await userNs.id();
      if (!id) return false;
      db = dbNs;
      userId = id;
      app.emit('cloud', true);
      return true;
    } catch (e) {
      return false;
    }
  }
  const cloudOn = () => !!(db && userId);
  const col = () => db.collection('data/users/' + userId);

  async function cloudList() {
    if (!cloudOn()) return [];
    const snap = await col().where('updatedAt', '>', 0).get();
    return snap.docs
      .filter((d) => d.exists && d.id.startsWith('proj_') && !d.id.includes('~'))
      .map((d) => {
        const x = d.data() || {};
        return { id: d.id, name: x.name || 'Projekt', updatedAt: x.updatedAt || 0, levels: x.levels || 1 };
      });
  }

  async function cloudLoad(id) {
    if (!cloudOn()) return null;
    const snap = await col().doc(id).get();
    if (!snap.exists) return null;
    const x = snap.data();
    const p = JSON.parse(x.json);
    p.assets = {};
    if (x.chunks > 0) {
      let s = '';
      for (let i = 0; i < x.chunks; i++) {
        const c = await col().doc(id + '~a' + i).get();
        if (c.exists) s += c.data().s || '';
      }
      try {
        p.assets = JSON.parse(s);
        assetHashes.set(id, x.assetsHash);
      } catch (e) {
        p.assets = {};
      }
    }
    return p;
  }

  async function cloudSave(p) {
    if (!cloudOn()) return false;
    const { assets, ...rest } = p;
    const json = JSON.stringify(rest);
    if (json.length > 240000) throw Object.assign(new Error('too_large'), { code: 'too_large' });
    const aj = JSON.stringify(assets || {});
    const ah = hashStr(aj);
    let chunks = 0;
    if (aj.length > 2) {
      const size = 190000;
      chunks = Math.ceil(aj.length / size);
      if (assetHashes.get(p.id) !== ah) {
        for (let i = 0; i < chunks; i++) await col().doc(p.id + '~a' + i).set({ s: aj.slice(i * size, (i + 1) * size) });
        assetHashes.set(p.id, ah);
      }
    }
    await col().doc(p.id).set({ name: p.name, updatedAt: p.updatedAt, levels: p.levels.length, json, chunks, assetsHash: ah });
    return true;
  }

  async function cloudDelete(id) {
    if (!cloudOn()) return;
    const snap = await col().doc(id).get();
    const chunks = snap.exists ? snap.data().chunks || 0 : 0;
    await col().doc(id).delete();
    for (let i = 0; i < chunks; i++) await col().doc(id + '~a' + i).delete();
  }

  // ------------------------------------------------------------------ autosave
  const saveLocalSoon = debounce(() => {
    const p = app.project;
    if (!p) return;
    const r = saveLocal(p);
    if (!cloudOn()) setState(r.ok ? (r.partial ? 'local-partial' : 'local') : 'error-local');
  }, 900);

  const saveCloudSoon = debounce(() => {
    const p = app.project;
    if (!p || !cloudOn()) return;
    const snapshot = JSON.parse(JSON.stringify(p));
    setState('saving');
    cloudChain = cloudChain
      .then(() => cloudSave(snapshot))
      .then(() => setState('cloud'))
      .catch((e) => setState(e && e.code === 'too_large' ? 'error-size' : 'error-cloud'));
  }, 2500);

  function scheduleSave() {
    setState('pending');
    saveLocalSoon();
    saveCloudSoon();
  }
  function flush() {
    saveLocalSoon.flush();
    if (cloudOn()) saveCloudSoon.flush();
  }

  async function listAll() {
    const local = localIndex().map((e) => ({ ...e, local: true }));
    let cloud = [];
    try { cloud = await cloudList(); } catch (e) { cloud = []; }
    const map = new Map();
    for (const e of local) map.set(e.id, { ...e });
    for (const e of cloud) {
      const m = map.get(e.id);
      if (m) {
        m.cloud = true;
        if (e.updatedAt > m.updatedAt) { m.updatedAt = e.updatedAt; m.name = e.name; m.cloudNewer = true; }
      } else map.set(e.id, { ...e, cloud: true });
    }
    return [...map.values()].sort((a, b) => b.updatedAt - a.updatedAt);
  }

  async function load(entry) {
    const local = loadLocal(entry.id);
    if (entry.cloud && (!local || entry.cloudNewer || (local.updatedAt || 0) < entry.updatedAt)) {
      try {
        const c = await cloudLoad(entry.id);
        if (c) return c;
      } catch (e) { /* fall back */ }
    }
    return local;
  }

  async function remove(id) {
    deleteLocal(id);
    try { await cloudDelete(id); } catch (e) { /* ignore */ }
  }

  // ------------------------------------------------------------------ downloads
  async function initDownloads() {
    if (!window.claude || !window.claude.use) { downloadsState = 'native'; return; }
    try {
      downloads = await window.claude.use('downloads');
      downloadsState = downloads ? 'available' : 'unavailable';
    } catch (e) {
      downloadsState = 'unavailable';
    }
    app.emit('downloads', downloadsState);
  }

  async function saveFile(filename, data) {
    if (downloads) {
      try {
        await downloads.save({ filename, data });
        return 'saved';
      } catch (e) {
        const code = e && e.code;
        if (code === 'declined') return 'declined';
        if (code === 'rate_limited') return 'busy';
        return 'error';
      }
    }
    if (downloadsState === 'native') {
      const blob = data instanceof Blob ? data : new Blob([data], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      return 'saved';
    }
    return 'unavailable';
  }

  return {
    loadLast, loadLocal, saveLocal, listAll, load, remove, scheduleSave, flush,
    initCloud, initDownloads, saveFile,
    get cloud() { return cloudOn(); },
    get canDownload() { return downloadsState === 'available' || downloadsState === 'native' || downloadsState === 'pending'; },
    get state() { return state; },
    async cloudCopy(id) {
      try { return cloudOn() ? await cloudLoad(id) : null; } catch (e) { return null; }
    },
  };
}
return { createStorage };
})();

const { createUI } = (() => {
// Grundriss Studio – user interface: tools, catalogue, properties, dialogs





const GROUND_COLORS = ['#a9b78f', '#8da26c', '#7b8f5c', '#c6c0ac', '#b4afa4', '#d9d3c4', '#9c9a93', '#6f7f63'];

  { id: 'room', icon: 'i-room', label: 'Raum', key: 'R' },
  { id: 'measure', icon: 'i-measure', label: 'Messen', key: 'M' },
  { id: 'text', icon: 'i-text', label: 'Text', key: 'T' },
  { id: 'image', icon: 'i-image', label: 'Vorlage', key: '' },
];

const icon = (id) => `<svg class="i"><use href="#${id}"/></svg>`;
const shortLevel = (name) => {
  const map = { Erdgeschoss: 'EG', Obergeschoss: 'OG', Dachgeschoss: 'DG', Untergeschoss: 'UG', Keller: 'UG', Attika: 'AT' };
  if (map[name]) return map[name];
  const m = name.match(/^(\d+)\.\s*(\w)/);
  if (m) return m[1] + '.' + m[2].toUpperCase() + 'G';
  return name.slice(0, 3);
};

function createUI(app) {
  const $ = (id) => document.getElementById(id);
  const el = {
    tools: $('tools'), catTabs: $('cat-tabs'), catGrid: $('cat-grid'), catSearch: $('cat-search'), props: $('props'),
    hint: $('hint'), coords: $('coords'), levels: $('levels'), viewSwitch: $('view-switch'), projectName: $('project-name'),
    saveState: $('save-state'), toasts: $('toasts'), selbar: $('selbar'), libPanel: $('lib-panel'), propsPanel: $('props-panel'),
    backdrop: $('sheet-backdrop'), mobilebar: $('mobilebar'), zoomVal: $('zoom-val'), undo: $('btn-undo'), redo: $('btn-redo'),
    stageEmpty: $('stage-empty'), propsTitle: $('props-title'),
  };
  const thumbs = new Map();
  let category = 'living';
  let query = '';

  // ------------------------------------------------------------------ tools
  el.tools.innerHTML = TOOLS.map((t) =>
    `<button class="tool" data-tool="${t.id}" title="${t.label}${t.key ? ' (' + t.key + ')' : ''}" aria-pressed="false">${icon(t.icon)}<span>${t.label}</span></button>`).join('');
  el.tools.addEventListener('click', (e) => {
    const b = e.target.closest('[data-tool]');
    if (!b) return;
    if (b.dataset.tool === 'image') return imageTool();
    app.setTool(b.dataset.tool);
  });
  function imageTool() {
    const lv = app.level;
    if (lv.background) {
      app.select([]);
      openSheet('props');
      focusField('bg-opacity');
      toast('Plan-Vorlage: Einstellungen in der Übersicht rechts.');

  }
  function syncTools() {
    for (const b of el.tools.querySelectorAll('[data-tool]')) b.setAttribute('aria-pressed', String(b.dataset.tool === app.tool));
    for (const b of el.mobilebar.querySelectorAll('[data-tool]')) b.setAttribute('aria-pressed', String(b.dataset.tool === app.tool));
  }

  // ------------------------------------------------------------------ catalogue
  el.catTabs.innerHTML = CATEGORIES.map((c) => `<button class="cat-tab" data-cat="${c.id}" aria-pressed="false">${c.name}</button>`).join('');
  el.catTabs.addEventListener('click', (e) => {
    const b = e.target.closest('[data-cat]');
    if (!b) return;
    category = b.dataset.cat;
    query = '';
    el.catSearch.value = '';
    renderCatalog();
  });
  el.catSearch.addEventListener('input', () => {
    query = el.catSearch.value;
    renderCatalog();
  });

  function entriesFor() {
    if (query.trim()) return searchCatalog(query);
    const out = [];
    for (const [id, def] of Object.entries(ITEMS)) if (def.cat === category) out.push({ kind: 'item', id, def });
    for (const [id, def] of Object.entries(OPENINGS)) if (def.cat === category) out.push({ kind: 'opening', id, def });
    return out;
  }

  function thumbImg(kind, type) {
    const key = kind + ':' + type;
    const src = thumbs.get(key);
    return src ? `<img alt="" src="${src}">` : `<span class="ph" data-thumb="${key}"></span>`;
  }

  function requestThumbs(root) {
    if (!app.view3d) return;
    for (const ph of root.querySelectorAll('[data-thumb]')) {
      const key = ph.getAttribute('data-thumb');
      const [kind, type] = key.split(':');
      if (thumbs.has(key)) continue;
      app.view3d.queueThumb(kind, type, (src) => {
        if (!src) return;
        thumbs.set(key, src);
        document.querySelectorAll(`[data-thumb="${key}"]`).forEach((n) => {
          const img = document.createElement('img');
          img.alt = '';
          img.src = src;
          n.replaceWith(img);
        });
      });
    }
  }

  function renderCatalog() {
    for (const b of el.catTabs.querySelectorAll('[data-cat]')) b.setAttribute('aria-pressed', String(!query.trim() && b.dataset.cat === category));
    const list = entriesFor();
    if (!list.length) {
      el.catGrid.innerHTML = `<div class="cat-empty">Nichts gefunden für «${escapeHtml(query)}».</div>`;
      return;
    }
    el.catGrid.innerHTML = list.map(({ kind, id, def }) => {
      const dims = kind === 'item' ? `${def.w} × ${def.d} × ${def.h}` : `${def.w} × ${def.h}${def.sill ? ' · Brüstung ' + def.sill : ''}`;
      return `<button class="card" data-kind="${kind}" data-type="${id}" title="${escapeHtml(def.name)} – klicken oder in den Plan ziehen"><span class="thumb">${thumbImg(kind, id)}</span><span class="c-name">${escapeHtml(def.name)}</span><span class="c-dim">${dims} cm</span></button>`;
    }).join('');

  // drag & drop from catalogue (mouse / pen); touch uses tap to place
  let catDrag = null;
  el.catGrid.addEventListener('pointerdown', (e) => {

    catDrag = { card, kind: card.dataset.kind, type: card.dataset.type, x: e.clientX, y: e.clientY, id: e.pointerId, active: false, touch: e.pointerType === 'touch' };
  });
  window.addEventListener('pointermove', (e) => {
    if (!catDrag || e.pointerId !== catDrag.id || catDrag.touch) return;
    if (!catDrag.active) {
      if (Math.hypot(e.clientX - catDrag.x, e.clientY - catDrag.y) < 6) return;
      catDrag.active = true;
      document.body.classList.add('dragging-item');
      const g = document.createElement('div');
      g.className = 'drag-ghost';
      const src = thumbs.get(catDrag.kind + ':' + catDrag.type);
      g.innerHTML = src ? `<img alt="" src="${src}">` : '';
      document.body.appendChild(g);
      catDrag.ghost = g;
    }
    catDrag.ghost.style.left = e.clientX + 'px';
    catDrag.ghost.style.top = e.clientY + 'px';
    const over = document.elementFromPoint(e.clientX, e.clientY);
    const onPlan = over && app.plan && app.plan.el.contains(over);
    catDrag.ghost.style.opacity = onPlan ? '0' : '1';
    if (onPlan) app.plan.placementPreview(catDrag.kind, catDrag.type, e.clientX, e.clientY);
    else app.plan && app.plan.clearPlacement();
  });
  const endCatDrag = (e) => {
    if (!catDrag || e.pointerId !== catDrag.id) return;
    const d = catDrag;
    catDrag = null;
    document.body.classList.remove('dragging-item');
    if (d.ghost) d.ghost.remove();
    if (!d.active) return;
    app.plan && app.plan.clearPlacement();
    if (e.type === 'pointercancel') return;
    const over = document.elementFromPoint(e.clientX, e.clientY);
    if (over && app.plan && app.plan.el.contains(over)) app.plan.placeAt(d.kind, d.type, e.clientX, e.clientY);
    else if (over && app.view3d && app.view3d.el.contains(over)) app.view3d.placeAt(d.kind, d.type, e.clientX, e.clientY);
    d.card.dataset.suppressClick = '1';
    setTimeout(() => delete d.card.dataset.suppressClick, 50);
  };
  window.addEventListener('pointerup', endCatDrag);
  window.addEventListener('pointercancel', endCatDrag);
  el.catGrid.addEventListener('click', (e) => {
    const card = e.target.closest('.card');
    if (!card || card.dataset.suppressClick) return;

  // ------------------------------------------------------------------ status bar

    const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };

    bd.addEventListener('pointerdown', (e) => { if (e.target === bd) close(); });

    return new Promise((res) => {
      let done = false;
      const d = openDialog(`<h2>${escapeHtml(title)}</h2><p class="lead">${escapeHtml(text)}</p><div class="actions"><button class="btn" data-no>Abbrechen</button><button class="btn ${danger ? 'primary' : 'primary'}" data-yes autofocus>${escapeHtml(okLabel)}</button></div>`, (dlg, close) => {
        dlg.querySelector('[data-no]').onclick = () => { done = true; close(); res(false); };
        dlg.querySelector('[data-yes]').onclick = () => { done = true; close(); res(true); };
      });
      const obs = new MutationObserver(() => { if (!document.body.contains(d.el)) { obs.disconnect(); if (!done) res(false); } });
      obs.observe(document.body, { childList: true });
    });
  }

  function askLength(question, placeholder) {
    return new Promise((res) => {
      let done = false;
      const d = openDialog(`<h2>${escapeHtml(question)}</h2><p class="lead">Zum Beispiel «4.50 m» oder «450». Gemessen: ${escapeHtml(placeholder || '')}</p>
        <label class="f"><span class="f-l">Echte Länge</span><span class="num"><input id="ask-len" inputmode="decimal" autofocus placeholder="z.B. 4.50 m"><span class="u">m / cm</span></span></label>
        <div class="actions"><button class="btn" data-no>Abbrechen</button><button class="btn primary" data-yes>Übernehmen</button></div>`, (dlg, close) => {
        const inp = dlg.querySelector('#ask-len');
        const ok = () => {
          const v = parseLength(inp.value);
          if (!(v > 0)) { inp.focus(); return; }
          done = true; close(); res(v);
        };
        dlg.querySelector('[data-yes]').onclick = ok;
        inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') ok(); });
        dlg.querySelector('[data-no]').onclick = () => { done = true; close(); res(null); };
      });
      const obs = new MutationObserver(() => { if (!document.body.contains(d.el)) { obs.disconnect(); if (!done) res(null); } });
      obs.observe(document.body, { childList: true });
    });
  }

  async function projectsDialog() {
    const fmtDate = (t) => new Date(t).toLocaleString('de-CH', { dateStyle: 'medium', timeStyle: 'short' });
    const d = openDialog(`<h2>Projekte</h2><p class="lead">${app.storage.cloud ? 'Deine Projekte werden in deinem Konto gespeichert und zusätzlich in diesem Browser.' : 'Deine Projekte werden in diesem Browser gespeichert. Sichere wichtige Pläne zusätzlich als Projektdatei.'}</p>
      <div class="row"><button class="btn primary" data-new>${icon('i-plus')}Neues Projekt</button><button class="btn" data-sample>${icon('i-room')}Beispielhaus</button><button class="btn" data-import>${icon('i-upload')}Datei importieren</button></div>
      <div class="plist" id="plist"><p class="note">Lade Projekte …</p></div>
      <div class="actions"><button class="btn" data-close>Schliessen</button></div>`, (dlg, close) => {
      dlg.querySelector('[data-close]').onclick = close;
      dlg.querySelector('[data-new]').onclick = () => { close(); app.newProject(); };
      dlg.querySelector('[data-sample]').onclick = () => { close(); app.openSample(); };
      dlg.querySelector('[data-import]').onclick = () => { close(); $('file-json').click(); };
    });
    const list = await app.storage.listAll();
    const box = d.el.querySelector('#plist');
    if (!box) return;
    if (!list.length) { box.innerHTML = '<p class="note">Noch keine gespeicherten Projekte.</p>'; return; }
    box.innerHTML = list.map((p) => `<div class="prow${p.id === app.project.id ? ' cur' : ''}" data-id="${escapeHtml(p.id)}">
      <div><b>${escapeHtml(p.name)}</b><small>${fmtDate(p.updatedAt)} · ${p.levels || 1} Geschoss${(p.levels || 1) > 1 ? 'e' : ''}${p.cloud ? ' · Konto' : ''}${p.local ? ' · Browser' : ''}${p.id === app.project.id ? ' · geöffnet' : ''}</small></div>
      <div class="row"><button class="btn" data-open>Öffnen</button><button class="btn icon danger" data-del aria-label="Löschen" title="Löschen">${icon('i-trash')}</button></div></div>`).join('');
    box.addEventListener('click', async (e) => {
      const row = e.target.closest('.prow');
      if (!row) return;
      const entry = list.find((x) => x.id === row.dataset.id);
      if (e.target.closest('[data-open]')) {
        d.close();
        app.openEntry(entry);
      } else if (e.target.closest('[data-del]')) {
        const b = e.target.closest('[data-del]');
        if (!b.dataset.armed) {
          b.dataset.armed = '1';
          b.classList.remove('icon');
          b.textContent = 'Wirklich löschen?';
          setTimeout(() => { if (document.body.contains(b)) { delete b.dataset.armed; b.classList.add('icon'); b.innerHTML = icon('i-trash'); } }, 3500);
          return;
        }
        await app.storage.remove(entry.id);
        row.remove();
        if (entry.id === app.project.id) toast('Das geöffnete Projekt bleibt offen, bis du ein anderes wählst.');
      }
    });
  }

  // ------------------------------------------------------------------ toasts, hint
  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    el.toasts.appendChild(t);
    setTimeout(() => t.remove(), 3800);
    while (el.toasts.children.length > 3) el.toasts.firstChild.remove();
  }
  function setHint(text) {
    el.hint.textContent = text || '';
  }
  const SAVE_LABEL = {
    idle: 'Bereit', pending: 'Ungespeichert', saving: 'Speichert …', cloud: 'Im Konto gespeichert', local: 'Im Browser gespeichert',
    'local-partial': 'Gespeichert (ohne Vorlage)', 'error-local': 'Speicher voll', 'error-cloud': 'Konto-Speicherung fehlgeschlagen', 'error-size': 'Projekt zu gross für Konto',
  };
  function setSaveState(s) {
    el.saveState.dataset.state = s;
    el.saveState.textContent = SAVE_LABEL[s] || s;
  }

  // ------------------------------------------------------------------ properties
  let handlers = { fields: {}, acts: {} };
  let propsDirty = false;
  let lastPropsKey = '';

  const num = (field, label, value, unit, extra = '') =>
    `<label class="f"><span class="f-l">${label}</span><span class="num"><input id="pf-${field}" data-field="${field}" inputmode="decimal" value="${escapeHtml(value)}" ${extra}><span class="u">${unit}</span></span></label>`;
  const text = (field, label, value, extra = '') =>
    `<label class="f"><span class="f-l">${label}</span><input class="txt" id="pf-${field}" data-field="${field}" value="${escapeHtml(value)}" ${extra}></label>`;
  const check = (field, label, on) => `<label class="check"><input type="checkbox" id="pf-${field}" data-field="${field}" ${on ? 'checked' : ''}>${label}</label>`;
  const btn = (act, label, ic = '', cls = '', extra = '') => `<button class="btn ${cls}" data-act="${act}" ${extra}>${ic ? icon(ic) : ''}${label}</button>`;
  const swatches = (field, value, colors) => {
    const v = (value || '').toLowerCase();
    return `<div class="sw-row">${colors.map((c) => `<button class="sw" style="--c:${c}" data-sw="${field}" data-c="${c}" aria-label="Farbe ${c}" aria-pressed="${c.toLowerCase() === v}"></button>`).join('')}<input type="color" id="pf-${field}" data-field="${field}" value="${/^#[0-9a-f]{6}$/i.test(value || '') ? value : '#cccccc'}" aria-label="Eigene Farbe"></div>`;
  };
  const sec = (title, body, extra = '') => `<div class="sec"><div class="sec-t"><span>${title}</span>${extra}</div>${body}</div>`;
  const fmt0 = (v) => fmtNum(Math.round(v * 10) / 10, 1);

  function parseNum(v) {
    const n = parseFloat(String(v).replace(',', '.').replace(/[^\d.\-]/g, ''));
    return Number.isFinite(n) ? n : NaN;
  }

  el.props.addEventListener('change', (e) => {
    const t = e.target;
    const f = t.dataset && t.dataset.field;
    if (!f || !handlers.fields[f]) return;
    const val = t.type === 'checkbox' ? t.checked : t.value;
    handlers.fields[f](val, t);
  });
  el.props.addEventListener('input', (e) => {
    const t = e.target;
    if (t.type === 'color' || t.type === 'range') {
      const f = t.dataset.field;
      if (f && handlers.fields[f]) handlers.fields[f](t.value, t, true);
    }
  });
  el.props.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.matches('input[data-field]')) e.target.blur();
  });
  el.props.addEventListener('click', (e) => {
    const sw = e.target.closest('[data-sw]');
    if (sw) {
      const f = sw.dataset.sw;
      handlers.fields[f] && handlers.fields[f](sw.dataset.c, sw);
      return;
    }
    const a = e.target.closest('[data-act]');
    if (a && handlers.acts[a.dataset.act]) handlers.acts[a.dataset.act](a);
  });
  el.props.addEventListener('focusout', () => {
    setTimeout(() => {
      if (propsDirty && !el.props.contains(document.activeElement)) renderProps(true);
    }, 0);
  });

  function renderProps(force) {
    const active = document.activeElement;
    if (!force && active && el.props.contains(active) && active.matches('input[type=text],input:not([type]),input[inputmode],textarea')) {
      propsDirty = true;
      return;
    }
    propsDirty = false;
    handlers = { fields: {}, acts: {} };
    const sel = app.selection;
    const lv = app.level;
    let html = '';
    let title = 'Übersicht';
    if (sel.length > 1) { html = multiPanel(sel); title = 'Auswahl'; }
    else if (sel.length === 1) {
      const s = sel[0];
      if (s.kind === 'item') { const it = lv.items.find((x) => x.id === s.id); if (it) { html = itemPanel(it); title = ITEMS[it.type]?.name || 'Objekt'; } }
      else if (s.kind === 'opening') { const o = lv.openings.find((x) => x.id === s.id); if (o) { html = openingPanel(o); title = OPENINGS[o.type]?.name || 'Öffnung'; } }
      else if (s.kind === 'wall') { const w = lv.walls.find((x) => x.id === s.id); if (w) { html = wallPanel(w); title = 'Wand'; } }
      else if (s.kind === 'room') { const r = lv.rooms.find((x) => x.id === s.id); if (r) { html = roomPanel(r); title = r.name || 'Raum'; } }
      else if (s.kind === 'label') { const l = lv.labels.find((x) => x.id === s.id); if (l) { html = labelPanel(l); title = 'Text'; } }
      else if (s.kind === 'dim') { const dm = lv.dims.find((x) => x.id === s.id); if (dm) { html = dimPanel(dm); title = 'Masslinie'; } }
    }
    if (!html) html = overviewPanel();
    el.props.innerHTML = html;
    el.propsTitle.textContent = title;
    requestThumbs(el.props);
    renderSelbar();
  }

  function mut(fn, key) {
    app.mutate(fn, key);
  }

  // --- item
  function itemPanel(it) {
    const def = ITEMS[it.type];
    const lv = app.level;
    const cat = CATEGORIES.find((c) => c.id === def.cat);
    const F = handlers.fields, A = handlers.acts;
    const setDim = (k, min, max) => (v) => {
      const n = parseLength(v);
      if (!(n > 0)) return renderProps(true);
      mut(() => { it[k] = r2(clamp(n, min, max)); }, 'p:' + it.id + k);
    };
    F.w = setDim('w', 1, 5000);
    F.d = setDim('d', 1, 5000);
    F.h = setDim('h', 0.5, 3000);
    F.rot = (v) => { const n = parseNum(v); if (Number.isFinite(n)) mut(() => { it.rot = r2(normDeg(n)); }, 'p:' + it.id + 'rot'); else renderProps(true); };
    F.elev = (v) => { const n = parseLength(v); if (Number.isFinite(n)) mut(() => { it.elev = r2(clamp(n, -500, 3000)); }, 'p:' + it.id + 'elev'); else renderProps(true); };
    F.color = (v) => mut(() => { it.color = v; }, 'p:' + it.id + 'color');
    F.color2 = (v) => mut(() => { it.color2 = v; }, 'p:' + it.id + 'color2');
    A.rotL = () => mut(() => { it.rot = normDeg((it.rot || 0) - 90); });
    A.rotR = () => mut(() => { it.rot = normDeg((it.rot || 0) + 90); });
    A.flip = () => mut(() => { it.flip = !it.flip; });
    A.dup = () => app.duplicate();
    A.del = () => app.deleteSelection();
    A.ceil = () => mut(() => { it.elev = Math.max(0, lv.height - it.h); });
    A.floor = () => mut(() => { it.elev = 0; });
    A.wallTop = () => mut(() => { it.elev = lv.height; });
    let elevHelp = '';
    if (def.custom) elevHelp = `<div class="row">${btn('wallTop', 'Auf Wandhöhe setzen', 'i-up')}</div><p class="note">Dächer passt du über Breite, Tiefe und Höhe an. Ein paar Zentimeter Überstand je Seite sehen natürlich aus.</p>`;
    else if (def.mount === 'ceiling') elevHelp = `<div class="row">${btn('ceil', 'An die Decke', 'i-up')}</div>`;
    return `<div class="p-head"><span class="thumb">${thumbImg('item', it.type)}</span><div><div class="p-title">${escapeHtml(def.name)}</div><div class="p-sub">${escapeHtml(cat ? cat.name : '')}</div></div></div>`
      + sec('Grösse', `<div class="grid3">${num('w', 'Breite', fmt0(it.w), 'cm')}${num('d', 'Tiefe', fmt0(it.d), 'cm')}${num('h', 'Höhe', fmt0(it.h), 'cm')}</div>`)
      + sec('Lage', `<div class="grid2">${num('rot', 'Drehung', fmt0(it.rot || 0), '°')}${num('elev', 'Über Boden', fmt0(it.elev || 0), 'cm')}</div><div class="row">${btn('rotL', '90°', 'i-rotl')}${btn('rotR', '90°', 'i-rotr')}${btn('flip', 'Spiegeln', 'i-flip')}</div>${elevHelp}`)
      + sec('Farbe', swatches('color', it.color || def.color, ITEM_COLORS) + (def.color2 ? `<span class="f-l">Zweitfarbe</span>${swatches('color2', it.color2 || def.color2, ITEM_COLORS)}` : ''))
      + sec('', `<div class="row">${btn('dup', 'Duplizieren', 'i-copy')}${btn('del', 'Löschen', 'i-trash', 'danger')}</div>`);
  }

  // --- opening
  function openingPanel(o) {
    const def = OPENINGS[o.type];
    const lv = app.level;
    const F = handlers.fields, A = handlers.acts;
    const isDoor = def.kind === 'door' || def.kind === 'double' || def.kind === 'french';
    F.type = (v) => mut(() => {
      const nd = OPENINGS[v];
      if (!nd) return;
      o.type = v; o.width = nd.w; o.height = nd.h; o.sill = nd.sill; o.color = nd.color;
    });
    F.width = (v) => { const n = parseLength(v); if (n > 10) mut(() => { o.width = r2(clamp(n, 20, 1500)); }, 'p:' + o.id + 'w'); else renderProps(true); };
    F.height = (v) => { const n = parseLength(v); if (n > 10) mut(() => { o.height = r2(clamp(n, 20, 800)); }, 'p:' + o.id + 'h'); else renderProps(true); };
    F.sill = (v) => { const n = parseLength(v); if (n >= 0) mut(() => { o.sill = r2(clamp(n, 0, 600)); }, 'p:' + o.id + 's'); else renderProps(true); };
    F.color = (v) => mut(() => { o.color = v; }, 'p:' + o.id + 'c');
    A.flip = () => mut(() => { o.flip = !o.flip; });
    A.swing = () => mut(() => { o.swing = !o.swing; });
    A.dup = () => app.duplicate();
    A.del = () => app.deleteSelection();
    const fr = openingFrame(lv, o);
    const options = Object.entries(OPENINGS).filter(([, d]) => d.cat === def.cat).map(([id, d]) => `<option value="${id}" ${id === o.type ? 'selected' : ''}>${escapeHtml(d.name)}</option>`).join('');
    const dist0 = fr ? `${fmtCm(Math.round(fr.u0 - fr.info.uMin))} / ${fmtCm(Math.round(fr.info.uMax - fr.u1))}` : '–';
    return `<div class="p-head"><span class="thumb">${thumbImg('opening', o.type)}</span><div><div class="p-title">${escapeHtml(def.name)}</div><div class="p-sub">Abstand zu den Wandenden: ${dist0}</div></div></div>`
      + sec('Typ', `<select class="txt" id="pf-type" data-field="type">${options}</select>`)
      + sec('Masse', `<div class="grid3">${num('width', 'Breite', fmt0(o.width), 'cm')}${num('height', 'Höhe', fmt0(o.height), 'cm')}${num('sill', 'Brüstung', fmt0(o.sill || 0), 'cm')}</div>`)
      + (isDoor || def.kind === 'sliding' ? sec('Öffnung', `<div class="row">${btn('flip', 'Anschlag wechseln', 'i-flip')}${btn('swing', 'Andere Seite', 'i-door')}</div>`) : '')
      + sec('Rahmenfarbe', swatches('color', o.color || def.color, ['#f7f7f5', '#e8e6e1', '#cfcac2', '#9aa0a5', '#5b5f63', '#3a3f45', '#262729', '#c49a6b', '#8a5f3c', '#5b3b26', '#34444f', '#2c4155', '#6f8a6a', '#9c3d34']))
      + sec('', `<div class="row">${btn('dup', 'Duplizieren', 'i-copy')}${btn('del', 'Löschen', 'i-trash', 'danger')}</div>`);
  }

  // --- wall
  function wallPanel(w) {
    const lv = app.level;
    const d = getDerived(lv);
    const info = d.walls.get(w.id);
    const F = handlers.fields, A = handlers.acts;
    const L = dist(w.a, w.b);
    F.len = (v) => {
      const n = parseLength(v);
      if (!(n > 5)) return renderProps(true);
      mut(() => {
        const dir = norm(sub(w.b, w.a));
        const nb = add(w.a, mul(dir, n));
        for (const e of endsAt(lv, w.b)) e.w[e.end] = { x: r2(nb.x), y: r2(nb.y) };
        normalizeWalls(lv);
      });
    };
    F.thickness = (v) => { const n = parseLength(v); if (n > 1) mut(() => { w.thickness = r2(clamp(n, 2, 120)); normalizeWalls(lv); }); else renderProps(true); };
    F.height = (v) => {
      const s = String(v).trim();
      if (!s) return mut(() => { w.height = null; });
      const n = parseLength(s);
      if (n > 10) mut(() => { w.height = r2(clamp(n, 10, 2000)); }); else renderProps(true);
    };
    A.split = () => mut(() => splitWallAtPoint(lv, w.id, { x: (w.a.x + w.b.x) / 2, y: (w.a.y + w.b.y) / 2 }));
    A.del = () => app.deleteSelection();
    A.applyAll = () => mut(() => {
      const ids = new Set(app.selection.filter((s) => s.kind === 'wall').map((s) => s.id));
      for (const x of lv.walls) if (ids.has(x.id)) x.thickness = w.thickness;
    });
    const name = (id) => (id ? lv.rooms.find((r) => r.id === id)?.name || 'Raum' : 'Aussen');
    const sides = info ? `${escapeHtml(name(info.roomP))} · ${escapeHtml(name(info.roomN))}` : '';
    return `<div class="p-head"><div><div class="p-title">Wand ${fmtM(L)}</div><div class="p-sub">${sides}</div></div></div>`

// ---- main.js ----
(() => {
// Grundriss Studio – application controller









const $ = (id) => document.getElementById(id);

const app = {
  project: null,
  levelId: null,
  selection: [],
  tool: 'select',
  viewMode: '2d',
};
const listeners = {};
app.on = (ev, fn) => (listeners[ev] = listeners[ev] || []).push(fn);
app.emit = (ev, ...args) => (listeners[ev] || []).forEach((fn) => fn(...args));
Object.defineProperty(app, 'level', {
  get() {
    return app.project.levels.find((l) => l.id === app.levelId) || app.project.levels[0];
  },
});

let plan, view3d, ui, storage;

// ------------------------------------------------------------------ history
const undoStack = [];
const redoStack = [];
let lastKey = null;
let lastTime = 0;

function snapshot() {
  const { assets, ...rest } = app.project;
  return JSON.stringify(rest);
}
function restore(str) {
  const p = JSON.parse(str);
  p.assets = app.project.assets;
  app.project = p;
  if (!p.levels.some((l) => l.id === app.levelId)) app.levelId = sortedLevels(p)[0].id;
  invalidateDerived();
  changed();
}
app.mutate = (fn, key) => {
  const now = performance.now();
  const coalesce = key && key === lastKey && (key.startsWith('drag:') || now - lastTime < 1500);
  if (!coalesce) {
    undoStack.push(snapshot());
    if (undoStack.length > 150) undoStack.shift();
    redoStack.length = 0;
  }
  lastKey = key || null;
  lastTime = now;
  fn();
  changed();
};
app.undo = () => {
  if (!undoStack.length) return;
  redoStack.push(snapshot());
  lastKey = null;
  restore(undoStack.pop());
};
app.redo = () => {
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  lastKey = null;
  restore(redoStack.pop());
};
app.canUndo = () => undoStack.length > 0;
app.canRedo = () => redoStack.length > 0;

// ------------------------------------------------------------------ change propagation
let rafUI = 0, raf3d = 0;
let lastWallCount = -1;
function changed() {
  app.project.updatedAt = Date.now();
  const wc = app.level.walls.length;
  if (lastWallCount === 0 && wc > 0 && view3d) {
    if (app.viewMode !== '2d') requestAnimationFrame(() => view3d.resetView());
    else app._needs3dReset = true;
  }
  lastWallCount = wc;
  pruneSelection();
  plan.render();
  if (view3d && !raf3d) raf3d = requestAnimationFrame(() => { raf3d = 0; view3d.sync(); });
  if (!rafUI) rafUI = requestAnimationFrame(() => { rafUI = 0; ui.refresh(); });
  storage.scheduleSave();
}

function exists(s) {
  const lv = app.level;
  switch (s.kind) {
    case 'item': return lv.items.some((x) => x.id === s.id);
    case 'opening': return lv.openings.some((x) => x.id === s.id);
    case 'wall': return lv.walls.some((x) => x.id === s.id);
    case 'room': return lv.rooms.some((x) => x.id === s.id);
    case 'label': return lv.labels.some((x) => x.id === s.id);
    case 'dim': return lv.dims.some((x) => x.id === s.id);
    default: return false;
  }
}
function pruneSelection() {
  const before = app.selection.length;
  app.selection = app.selection.filter(exists);
  if (app.selection.length !== before) app.emit('selection');
}

// ------------------------------------------------------------------ selection & tools
app.select = (list) => {

app.setTool = (t) => {

};
app.setView = (mode) => {
