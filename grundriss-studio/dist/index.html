<title>Grundriss Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Grundriss Studio – Häuser und Wohnungen in 2D zeichnen, einrichten und in 3D begehen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout concept: a drafting table – floating panels (tools + catalogue | sheet | properties) around one large plan sheet. */
:root {
  --bg: #e6ebe9;
  --panel: #f9fbfa;
  --panel-2: #eef2f0;
  --panel-3: #e3e9e6;
  --line: #d6dedb;
  --line-2: #bfcac6;
  --ink: #18232a;
  --ink-2: #3a4950;
  --muted: #65767d;
  --accent: #c8491a;
  --accent-2: #e2571e;
  --accent-ink: #ffffff;
  --accent-soft: rgba(226, 87, 30, .13);
  --focus: #2477a8;
  --ok: #2f7d4f;
  --warn: #a8661b;
  --danger: #b4372a;
  --plan-paper: #f7f9f8;
  --plan-grid: rgba(38, 72, 92, .065);
  --plan-grid-major: rgba(38, 72, 92, .14);
  --plan-veil: rgba(247, 249, 248, .26);
  --plan-wall: #263035;
  --plan-wall-hover: #4a565d;
  --plan-ink: #18232a;
  --plan-muted: #50626a;
  --plan-halo: rgba(247, 249, 248, .9);
  --plan-dim: #5a6b73;
  --plan-glass: #3a8ab3;
  --plan-ghost: #93a5ad;
  --plan-roof: #8a4a35;
  --plan-guide: #2a8dbb;
  --sky-top: #bfd3df;
  --sky-bottom: #eef2f1;
  --shadow: 0 1px 2px rgba(20, 32, 38, .06), 0 10px 30px rgba(20, 32, 38, .09);
  --shadow-sm: 0 1px 2px rgba(20, 32, 38, .08), 0 2px 8px rgba(20, 32, 38, .06);
  --font-ui: 'Barlow', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-num: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', Arial, sans-serif;
  --r-lg: 14px;
  --r-md: 10px;
  --r-sm: 7px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08121b; --panel: #0f1b26; --panel-2: #142331; --panel-3: #1a2c3c; --line: #1f3243; --line-2: #2d4458;
    --ink: #e3ecf3; --ink-2: #b4c4d0; --muted: #7f97a8; --accent: #ff7a3d; --accent-2: #ff8a52; --accent-ink: #1c0c04;
    --accent-soft: rgba(255, 122, 61, .17); --focus: #6cc0ef; --ok: #5fc48a; --warn: #e3a04f; --danger: #ef7b6c;
    --plan-paper: #0e2640; --plan-grid: rgba(150, 200, 255, .07); --plan-grid-major: rgba(150, 200, 255, .16);
    --plan-veil: rgba(14, 38, 64, .42); --plan-wall: #dbe7f2; --plan-wall-hover: #ffffff; --plan-ink: #e8f0f7;
    --plan-muted: #a6bdcf; --plan-halo: rgba(14, 38, 64, .88); --plan-dim: #9cb4c7; --plan-glass: #7cc6ee;
    --plan-ghost: #56769a; --plan-roof: #e3a084; --plan-guide: #6fc3f0; --sky-top: #0c1926; --sky-bottom: #20323f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35); --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3), 0 2px 8px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08121b; --panel: #0f1b26; --panel-2: #142331; --panel-3: #1a2c3c; --line: #1f3243; --line-2: #2d4458;
  --ink: #e3ecf3; --ink-2: #b4c4d0; --muted: #7f97a8; --accent: #ff7a3d; --accent-2: #ff8a52; --accent-ink: #1c0c04;
  --accent-soft: rgba(255, 122, 61, .17); --focus: #6cc0ef; --ok: #5fc48a; --warn: #e3a04f; --danger: #ef7b6c;
  --plan-paper: #0e2640; --plan-grid: rgba(150, 200, 255, .07); --plan-grid-major: rgba(150, 200, 255, .16);
  --plan-veil: rgba(14, 38, 64, .42); --plan-wall: #dbe7f2; --plan-wall-hover: #ffffff; --plan-ink: #e8f0f7;
  --plan-muted: #a6bdcf; --plan-halo: rgba(14, 38, 64, .88); --plan-dim: #9cb4c7; --plan-glass: #7cc6ee;
  --plan-ghost: #56769a; --plan-roof: #e3a084; --plan-guide: #6fc3f0; --sky-top: #0c1926; --sky-bottom: #20323f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35); --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3), 0 2px 8px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--font-ui);
  overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app {
  height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 10px; padding-block: 10px 0; min-width: 0; }
.brand { display: flex; align-items: center; gap: 9px; flex: none; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: var(--panel); display: grid; place-items: center; }
.brand-mark svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.brand-mark .door { stroke: var(--accent-2); }
.brand-name { font-weight: 700; letter-spacing: .01em; font-size: 15px; white-space: nowrap; }
.brand-name small { display: block; font: 500 10.5px/1 var(--font-num); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.proj { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 auto; margin-left: 6px; }
.project-name {
  min-width: 80px; max-width: 320px; width: 100%; border: 1px solid transparent; background: transparent; border-radius: var(--r-sm);
  padding: 6px 8px; font-weight: 600; font-size: 15px; text-overflow: ellipsis;
}
.project-name:hover { border-color: var(--line); }
.project-name:focus { border-color: var(--line-2); background: var(--panel); outline: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font: 500 12.5px/1 var(--font-num); letter-spacing: .04em;
  text-transform: uppercase; color: var(--muted); padding: 5px 8px; border-radius: 99px; background: var(--panel-2);
}
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .8; }
.chip[data-state="cloud"], .chip[data-state="local"] { color: var(--ok); }
.chip[data-state="pending"], .chip[data-state="saving"] { color: var(--warn); }
.chip[data-state^="error"] { color: var(--danger); }
.tb-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--panel);
  border-radius: var(--r-md); padding: 7px 11px; font-weight: 600; font-size: 13.5px; white-space: nowrap; min-height: 36px; box-sizing: border-box;
  transition: background-color .15s ease, border-color .15s ease, color .15s ease;
}
.btn:hover { background: var(--panel-2); border-color: var(--line-2); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.icon { padding: 7px; width: 36px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--panel-2); }
.btn.danger { color: var(--danger); }
.seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; min-height: 30px; }
.seg button:hover { color: var(--ink); background: var(--panel); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-sm); }
.levels .lv-add { color: var(--muted); }

/* ---------- main area ---------- */
.main { display: grid; grid-template-columns: 300px minmax(0, 1fr) 292px; gap: 10px; padding-block: 10px; min-height: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.sheet-head { display: none; }

.tools { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); }
.tool {
  display: grid; justify-items: center; gap: 3px; padding: 7px 2px 6px; border: 1px solid transparent; background: transparent; border-radius: var(--r-sm);
  font: 500 11.5px/1 var(--font-ui); color: var(--ink-2);
}
.tool:hover { background: var(--panel-2); color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.tool kbd { display: none; }

.catalog { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.cat-search { padding: 10px 10px 6px; position: relative; }
.cat-search input {
  width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--r-md);
  padding: 8px 10px 8px 34px; font-size: 13.5px;
}
.cat-search svg { position: absolute; left: 20px; top: 18px; width: 17px; height: 17px; color: var(--muted); }
.cat-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 10px 8px; }
.cat-tab {
  border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 4px 9px; font-size: 12.5px; font-weight: 500; color: var(--ink-2);
}
.cat-tab:hover { border-color: var(--line-2); color: var(--ink); }
.cat-tab[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 2px 10px 12px; overflow-y: auto; min-height: 0; align-content: start; }
.card {
  display: grid; grid-template-rows: auto auto auto; text-align: left; gap: 2px; border: 1px solid var(--line); background: var(--panel);
  border-radius: var(--r-md); padding: 6px 6px 8px; touch-action: pan-y; user-select: none; -webkit-user-select: none;
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.card:hover { border-color: var(--line-2); box-shadow: var(--shadow-sm); }
.card:active { transform: scale(.98); }
.thumb { aspect-ratio: 1 / 0.78; max-width: 100%; border-radius: 7px; background: radial-gradient(120% 90% at 50% 30%, var(--panel), var(--panel-2)); display: grid; place-items: center; overflow: hidden; }
.thumb img { width: 92%; height: 92%; object-fit: contain; pointer-events: none; }
.thumb .ph { width: 40%; height: 40%; border-radius: 50%; background: var(--panel-3); animation: pulse 1.2s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: .4; } to { opacity: .9; } }
.c-name { font-weight: 600; font-size: 12.5px; line-height: 1.2; padding: 4px 2px 0; }
.c-dim { font: 500 11.5px/1.1 var(--font-num); color: var(--muted); letter-spacing: .03em; padding: 0 2px; font-variant-numeric: tabular-nums; }
.cat-empty { grid-column: 1 / -1; color: var(--muted); padding: 20px 4px; text-align: center; }

/* ---------- stage ---------- */
.stage { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); background: var(--plan-paper); min-height: 0; }
.stage[data-view="split"] { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.stage[data-view="2d"] .pane-3d, .stage[data-view="3d"] .pane-2d { display: none; }
.pane { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.pane-3d { background: var(--sky-bottom); }
.stage[data-view="split"] .pane-3d { border-left: 1px solid var(--line); }
.plan-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
.plan-svg.t-wall, .plan-svg.t-room, .plan-svg.t-measure, .plan-svg.t-calibrate { cursor: crosshair; }
.plan-svg.t-text { cursor: text; }
.plan-svg.panning, .plan-svg.dragging { cursor: grabbing; }
.view3d-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.len-input {
  position: absolute; z-index: 5; width: 110px; border: 2px solid var(--accent); border-radius: 8px; background: var(--panel); padding: 5px 8px;
  font: 600 14px var(--font-num); box-shadow: var(--shadow);
}
.float { position: absolute; z-index: 4; display: flex; gap: 4px; padding: 4px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-sm); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.float .btn { min-height: 32px; padding: 5px 8px; font-size: 12.5px; border-color: transparent; background: transparent; }
.float .btn:hover { background: var(--panel-2); }
.float .btn.icon { width: 32px; padding: 5px; }
.float .btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.float .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.float .btn.primary:hover { background: var(--accent-2); }
.zoom-ctl { right: 10px; bottom: 10px; align-items: center; }
.zoom-val { font: 600 12.5px var(--font-num); min-width: 44px; text-align: center; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ctl-3d { left: 10px; top: 10px; flex-wrap: wrap; max-width: calc(100% - 20px); }
.pane-tag { position: absolute; z-index: 3; left: 12px; top: 12px; font: 600 11px/1 var(--font-num); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; pointer-events: none; }
.stage[data-view="3d"] .pane-tag, .stage[data-view="2d"] .pane-tag { display: none; }
.selbar { left: 50%; bottom: 12px; transform: translateX(-50%); }
.selbar .sb-name { font-weight: 600; font-size: 12.5px; padding: 0 8px 0 6px; align-self: center; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.walk-hud { left: 50%; bottom: 14px; transform: translateX(-50%); align-items: center; gap: 12px; padding: 6px 6px 6px 14px; font-size: 12.5px; color: var(--ink-2); width: max-content; max-width: calc(100% - 24px); box-sizing: border-box; }
.walk-hud span { min-width: 0; }
.dpad { position: absolute; z-index: 4; left: 14px; bottom: 14px; display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); gap: 4px; }
.dpad button { border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 88%, transparent); border-radius: 12px; display: grid; place-items: center; touch-action: none; }
.dpad .up { grid-column: 2; grid-row: 1; } .dpad .left { grid-column: 1; grid-row: 2; } .dpad .right { grid-column: 3; grid-row: 2; } .dpad .down { grid-column: 2; grid-row: 3; }
.stage-empty {
  position: absolute; z-index: 2; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; color: var(--muted);
  max-width: 340px; padding: 0 16px; box-sizing: border-box;
}
.stage-empty h3 { margin: 0 0 6px; color: var(--ink); font-size: 18px; text-wrap: balance; }
.stage-empty p { margin: 0; }

/* ---------- properties ---------- */
.props { overflow-y: auto; min-height: 0; flex: 1; padding: 14px 14px 18px; }
.p-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.p-head .thumb { width: 52px; flex: none; }
.p-title { font-weight: 700; font-size: 16px; line-height: 1.2; text-wrap: balance; }
.p-sub { color: var(--muted); font-size: 12.5px; }
.sec { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; display: grid; gap: 10px; }
.sec:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.sec-t { font: 600 11.5px/1 var(--font-num); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.f { display: grid; gap: 4px; min-width: 0; }
.f-l { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.num { display: flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel-2); min-width: 0; }
.num:focus-within { border-color: var(--focus); box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 20%, transparent); }
.num input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 7px 4px 7px 8px; font: 600 14px var(--font-num); font-variant-numeric: tabular-nums; outline: none; }
.num .u { font: 500 12px var(--font-num); color: var(--muted); padding-right: 8px; }
.txt { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel-2); padding: 7px 9px; font-weight: 500; }
.txt:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 20%, transparent); }
select.txt { padding: 6px 8px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row .btn { flex: 1 1 auto; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
.sw-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.sw { width: 22px; height: 22px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); background: var(--c); padding: 0; }
.sw[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.sw-row input[type="color"] { width: 30px; height: 24px; border: 1px solid var(--line); border-radius: 6px; padding: 0 2px; background: var(--panel-2); }
.floors { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.fl { border: 1px solid var(--line); border-radius: 8px; padding: 0; aspect-ratio: 1; background-size: cover; position: relative; overflow: hidden; }
.fl[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.fl span { position: absolute; left: 0; right: 0; bottom: 0; font: 500 10px/1.15 var(--font-ui); background: color-mix(in srgb, var(--panel) 86%, transparent); padding: 2px 3px; color: var(--ink); }
.stat { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
.stat b { font: 600 15px var(--font-num); font-variant-numeric: tabular-nums; }
.rooms-list { display: grid; gap: 2px; }
.rooms-list button { display: flex; justify-content: space-between; gap: 10px; border: 0; background: transparent; border-radius: 7px; padding: 6px 8px; text-align: left; }
.rooms-list button:hover { background: var(--panel-2); }
.rooms-list span:last-child { font: 600 13.5px var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.lv-row { display: grid; grid-template-columns: minmax(0, 1fr) 92px 32px; gap: 6px; align-items: center; }
.note { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.range { width: 100%; accent-color: var(--accent); }

/* ---------- status bar ---------- */
.statusbar { display: flex; align-items: center; gap: 14px; padding-block: 0 10px; min-width: 0; font-size: 12.5px; color: var(--muted); }
.hint { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.coords { font: 500 12.5px var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: .02em; white-space: nowrap; }
.toggles { display: flex; gap: 12px; flex: none; }
.toggles .check { font-size: 12.5px; color: var(--ink-2); }

/* ---------- overlays ---------- */
.menu { position: fixed; z-index: 40; min-width: 220px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 6px; display: grid; gap: 2px; }
.menu button { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 8px 10px; border-radius: 7px; text-align: left; font-weight: 500; }
.menu button:hover { background: var(--panel-2); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; width: auto; }

        const k = vkey(w[end]);
        if (!m.has(k)) m.set(k, []);
        m.get(k).push({ w, end });
      }
    }
    let merged = false;
    for (const list of m.values()) {
      if (list.length !== 2) continue;
      const [e1, e2] = list;
      const w1 = e1.w, w2 = e2.w;
      if (w1 === w2) continue;
      if (w1.thickness !== w2.thickness || (w1.height ?? null) !== (w2.height ?? null)) continue;
      const v = w1[e1.end];
      const P = w1[e1.end === 'a' ? 'b' : 'a'];
      const Q = w2[e2.end === 'a' ? 'b' : 'a'];
      const o1 = norm(sub(P, v)), o2 = norm(sub(Q, v));
      if (dot(o1, o2) > -0.99998) continue;
      const moved = level.openings
        .filter((o) => o.wallId === w1.id || o.wallId === w2.id)
        .map((o) => {
          const w = o.wallId === w1.id ? w1 : w2;
          return { o, c: add(w.a, mul(norm(sub(w.b, w.a)), o.offset)) };
        });
      w1.a = { x: P.x, y: P.y };
      w1.b = { x: Q.x, y: Q.y };
      level.walls = level.walls.filter((w) => w !== w2);
      for (const { o, c } of moved) {
        o.wallId = w1.id;
        o.offset = dist(P, c);
      }
      merged = true;
      break;
    }
    if (!merged) break;
  }

// ---------------------------------------------------------------------------
// Derived geometry: wall outlines with mitred joins, rooms (faces of the wall graph)
// ---------------------------------------------------------------------------
const derivedCache = new Map();

function wallsKey(level) {
  let s = '';
  for (const w of level.walls) s += w.id + ':' + w.a.x + ',' + w.a.y + ',' + w.b.x + ',' + w.b.y + ',' + w.thickness + '|';
  return s;
}

function getDerived(level) {
  const key = wallsKey(level);
  const c = derivedCache.get(level.id);
  if (c && c.key === key && c.level === level && c.roomsRef === level.rooms) return c;
  const d = derive(level);
  d.key = key;
  d.level = level;
  syncRooms(level, d);
  d.roomsRef = level.rooms;
  derivedCache.set(level.id, d);
  return d;
}

function invalidateDerived() {

function derive(level) {
  const V = [];
  const vid = (p) => {
    for (let i = 0; i < V.length; i++) if (same(V[i], p)) return i;
    V.push({ x: p.x, y: p.y, ends: [] });
    return V.length - 1;
  };
  const W = new Map();
  for (const w of level.walls) {
    const L = dist(w.a, w.b);
    if (L < 0.5) continue;
    const ia = vid(w.a), ib = vid(w.b);
    if (ia === ib) continue;
    const d = { x: (w.b.x - w.a.x) / L, y: (w.b.y - w.a.y) / L };
    const info = {
      wall: w, id: w.id, ia, ib, a: V[ia], b: V[ib], d, n: perp(d), len: L, h: Math.max(1, w.thickness) / 2,
      pA: null, nA: null, pB: null, nB: null, centerA: false, centerB: false, poly: null,
      sideP: null, sideN: null, roomP: null, roomN: null, uMin: 0, uMax: L,
    };
    W.set(w.id, info);
    V[ia].ends.push({ info, out: d, isStart: true });
    V[ib].ends.push({ info, out: { x: -d.x, y: -d.y }, isStart: false });
  }

  const setCorner = (e, side, p) => {
    const info = e.info;
    if (e.isStart) {
      if (side > 0) info.pA = p; else info.nA = p;
    } else if (side > 0) info.nB = p; else info.pB = p;
  };

  for (const v of V) {
    const E = v.ends;
    for (const e of E) e.ang = Math.atan2(e.out.y, e.out.x);
    E.sort((p, q) => p.ang - q.ang);
    const k = E.length;
    if (k === 1) {
      const e = E[0];
      const l = perp(e.out), h = e.info.h;
      setCorner(e, 1, { x: v.x + l.x * h, y: v.y + l.y * h });
      setCorner(e, -1, { x: v.x - l.x * h, y: v.y - l.y * h });
      continue;
    }
    for (let i = 0; i < k; i++) {
      const e1 = E[i], e2 = E[(i + 1) % k];
      const l1 = perp(e1.out), l2 = perp(e2.out);
      const h1 = e1.info.h, h2 = e2.info.h;
      const p1 = { x: v.x + l1.x * h1, y: v.y + l1.y * h1 };
      const p2 = { x: v.x - l2.x * h2, y: v.y - l2.y * h2 };
      let c1 = p1, c2 = p2;
      const X = lineIntersect(p1, e1.out, p2, e2.out);
      if (X && dist(X, v) <= Math.max(h1, h2) * 5) {

        c2 = c1;
      }
      setCorner(e1, 1, c1);
      setCorner(e2, -1, c2);
    }
    for (const e of E) e.info[e.isStart ? 'centerA' : 'centerB'] = true;
  }

  for (const info of W.values()) {
    const a = info.a, b = info.b;
    const pts = [info.pA, info.pB];
    if (info.centerB) pts.push({ x: b.x, y: b.y });
    pts.push(info.nB, info.nA);
    if (info.centerA) pts.push({ x: a.x, y: a.y });
    info.poly = pts;
    const u = (p) => dot(sub(p, a), info.d);
    info.uMin = clamp(Math.max(u(info.pA), u(info.nA), 0), 0, info.len);

  }

  // --- faces ---------------------------------------------------------------
  const alive = new Set(W.keys());
  const deg = V.map((v) => v.ends.length);
  const stack = [];
  deg.forEach((d, i) => { if (d === 1) stack.push(i); });
  while (stack.length) {
    const i = stack.pop();
    if (deg[i] !== 1) continue;
    const e = V[i].ends.find((e) => alive.has(e.info.id));
    if (!e) continue;
    alive.delete(e.info.id);
    deg[i]--;
    const j = e.isStart ? e.info.ib : e.info.ia;
    deg[j]--;
    if (deg[j] === 1) stack.push(j);
  }
  // half-edges: key wallId + dir
  const outList = V.map((v) => v.ends.filter((e) => alive.has(e.info.id)));
  const heKey = (info, fwd) => info.id + (fwd ? '+' : '-');
  const visited = new Set();
  const faces = [];
  const nextHE = (info, fwd) => {
    const vto = fwd ? info.ib : info.ia;
    const list = outList[vto];
    // twin: outgoing from vto along same wall
    const idx = list.findIndex((e) => e.info === info && e.isStart === !fwd);
    if (idx < 0) return null;
    const prev = list[(idx - 1 + list.length) % list.length];
    return { info: prev.info, fwd: prev.isStart };
  };
  for (const id of alive) {
    const info0 = W.get(id);
    for (const fwd0 of [true, false]) {
      if (visited.has(heKey(info0, fwd0))) continue;
      const hes = [];
      let cur = { info: info0, fwd: fwd0 };
      let guard = 0;
      while (cur && !visited.has(heKey(cur.info, cur.fwd)) && guard++ < 5000) {
        visited.add(heKey(cur.info, cur.fwd));
        hes.push(cur);
        cur = nextHE(cur.info, cur.fwd);
      }
      if (hes.length < 3) continue;
      const poly = hes.map((he) => (he.fwd ? he.info.a : he.info.b)).map((p) => ({ x: p.x, y: p.y }));
      const area = polygonArea(poly);
      if (area <= 1000) continue; // outer boundary (negative) or sliver
      const inner = offsetPolygonLeft(poly, hes.map((he) => he.info.h));
      const netArea = Math.abs(polygonArea(inner));
      const fi = faces.length;
      faces.push({ index: fi, poly, inner, area, netArea, label: labelPoint(inner), halfEdges: hes, roomId: null });
      for (const he of hes) {
        if (he.fwd) he.info.sideP = fi; else he.info.sideN = fi;
      }
    }
  }
  return { verts: V, walls: W, faces };
}

// ---------------------------------------------------------------------------
// Openings
// ---------------------------------------------------------------------------
/** Geometry of an opening on its wall: centre, along-wall interval, angle. */

/** Nearest wall to point p within maxDist; returns {info, u, d, side}. */

// ---------------------------------------------------------------------------

const WALL_COLORS = [
  '#f4f2ee', '#ffffff', '#ece6da', '#e3ddd2', '#d4cfc6', '#bfc3c1', '#8e9392', '#4b5053',
  '#e8d9c0', '#d9b99b', '#c98f6e', '#b56a4c', '#dfe6d6', '#a9b89b', '#6f8a6a', '#dbe5ea',
  '#a7bfcd', '#5d7d92', '#2f4b5c', '#e9d5d3', '#c9a0a3', '#efe1a8', '#d8b45a', '#3b3d40',
];

const ITEM_COLORS = [
  '#f4f2ee', '#d9d4ca', '#a59d90', '#6b6760', '#3a3a3c', '#1f2022', '#c49a6b', '#8a5f3c',
  '#5b3b26', '#d9c7a7', '#7d8c96', '#4c6b84', '#2c4155', '#6f8a6a', '#3f5b43', '#b7c6a3',
  '#b5673f', '#9c3d34', '#d3a14a', '#e5c9a8', '#c48b9f', '#7a5c86', '#e9e4da', '#b6b9bb',
];

const cache = new Map();

function canvas(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  return c;
}

function rgba(hex, a = 1) {
  const { r, g, b } = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}

function noise(ctx, size, amount, seed, scale = 1) {
  const r = rng(seed);
  const img = ctx.getImageData(0, 0, size, size);
  const d = img.data;
  for (let y = 0; y < size; y += scale) {
    for (let x = 0; x < size; x += scale) {
      const v = (r() - 0.5) * amount;
      for (let yy = 0; yy < scale; yy++) {
        for (let xx = 0; xx < scale; xx++) {
          const i = ((y + yy) * size + (x + xx)) * 4;
          d[i] = clamp(d[i] + v, 0, 255);
          d[i + 1] = clamp(d[i + 1] + v, 0, 255);
          d[i + 2] = clamp(d[i + 2] + v, 0, 255);
        }
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

function grain(ctx, x, y, w, h, color, r, horizontal = true) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  const lines = Math.max(3, Math.round((horizontal ? h : w) / 3));
  for (let i = 0; i < lines; i++) {
    ctx.strokeStyle = rgba(shade(color, -0.25 - r() * 0.15), 0.12 + r() * 0.12);
    ctx.lineWidth = 0.6 + r() * 1.1;
    ctx.beginPath();
    const off = (horizontal ? y : x) + (i + r() * 0.8) * ((horizontal ? h : w) / lines);
    const amp = 1 + r() * 2.5, freq = 0.01 + r() * 0.03, ph = r() * 6;
    for (let t = 0; t <= (horizontal ? w : h); t += 6) {
      const o = off + Math.sin(t * freq + ph) * amp;
      if (horizontal) ctx.lineTo(x + t, o); else ctx.lineTo(o, y + t);
    }
    ctx.stroke();
  }
  // knots
  if (r() < 0.35) {
    const kx = x + r() * w, ky = y + r() * h;
    ctx.fillStyle = rgba(shade(color, -0.35), 0.25);
    ctx.beginPath();
    ctx.ellipse(kx, ky, 4 + r() * 6, 2 + r() * 3, horizontal ? 0 : Math.PI / 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function planks(c, base, seed, rows = 6, gap = '#000') {
  const S = c.width, ctx = c.getContext('2d');
  const r = rng(seed);
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, S, S);
  const ph = S / rows;
  for (let row = 0; row < rows; row++) {
    let x = -r() * S * 0.6;
    const y = row * ph;
    while (x < S) {
      const L = S * (0.45 + r() * 0.55);
      const col = shade(base, (r() - 0.5) * 0.18);
      const draw = (ox) => {
        ctx.fillStyle = col;
        ctx.fillRect(x + ox, y, L, ph);
        grain(ctx, x + ox, y, L, ph, col, r);
        ctx.fillStyle = rgba(gap, 0.28);
        ctx.fillRect(x + ox + L - 1, y, 1.5, ph);
      };
      draw(0);
      if (x + L > S) draw(-S);
      if (x < 0) draw(S);
      x += L;
    }
    ctx.fillStyle = rgba(gap, 0.32);
    ctx.fillRect(0, y, S, 1.4);
  }
  noise(ctx, S, 10, seed + 3);
}

function basket(c, base, seed) {
  const S = c.width, ctx = c.getContext('2d');
  const r = rng(seed);
  const n = 4, cell = S / n, strips = 3, sw = cell / strips;
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const horizontal = (i + j) % 2 === 0;
      for (let k = 0; k < strips; k++) {
        const col = shade(base, (r() - 0.5) * 0.2);
        const x = horizontal ? i * cell : i * cell + k * sw;
        const y = horizontal ? j * cell + k * sw : j * cell;
        const w = horizontal ? cell : sw, h = horizontal ? sw : cell;
        ctx.fillStyle = col;
        ctx.fillRect(x, y, w, h);
        grain(ctx, x, y, w, h, col, r, horizontal);
        ctx.strokeStyle = rgba('#000', 0.22);
        ctx.lineWidth = 1.2;
        ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
      }
    }
  }
  noise(ctx, S, 8, seed + 9);
}

function tiles(c, base, grout, n, seed) {
  const S = c.width, ctx = c.getContext('2d');
  const r = rng(seed);
  ctx.fillStyle = grout;
  ctx.fillRect(0, 0, S, S);
  const t = S / n, g = Math.max(1.5, S / 260);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const col = shade(base, (r() - 0.5) * 0.06);
      ctx.fillStyle = col;
      ctx.fillRect(i * t + g / 2, j * t + g / 2, t - g, t - g);
      const grd = ctx.createLinearGradient(i * t, j * t, i * t + t, j * t + t);
      grd.addColorStop(0, rgba('#ffffff', 0.08));
      grd.addColorStop(1, rgba('#000000', 0.05));
      ctx.fillStyle = grd;
      ctx.fillRect(i * t + g / 2, j * t + g / 2, t - g, t - g);
    }
  }
  noise(ctx, S, 7, seed + 1);
}

function checker(c, a, b, n) {
  const S = c.width, ctx = c.getContext('2d');
  const t = S / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    ctx.fillStyle = (i + j) % 2 ? b : a;
    ctx.fillRect(i * t, j * t, t, t);
  }
  ctx.strokeStyle = rgba('#888', 0.4);
  ctx.lineWidth = 1;
  for (let i = 0; i <= n; i++) {
    ctx.beginPath(); ctx.moveTo(i * t, 0); ctx.lineTo(i * t, S); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * t); ctx.lineTo(S, i * t); ctx.stroke();
  }
  noise(ctx, S, 6, 5);
}

function marble(c, base, seed) {
  const S = c.width, ctx = c.getContext('2d');
  const r = rng(seed);
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, S, S);
  for (let k = 0; k < 14; k++) {
    ctx.strokeStyle = rgba(shade(base, -0.35 - r() * 0.2), 0.12 + r() * 0.25);
    ctx.lineWidth = 0.6 + r() * 2.2;
    ctx.beginPath();
    let x = r() * S, y = 0;
    ctx.moveTo(x, y);
    while (y < S) {
      x += (r() - 0.5) * 40;
      y += 10 + r() * 30;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  const t = S / 2;
  ctx.strokeStyle = rgba('#000', 0.12);
  ctx.strokeRect(0.5, 0.5, t, t);
  ctx.strokeRect(t + 0.5, t + 0.5, t, t);
  noise(ctx, S, 6, seed + 2);
}

function concrete(c, base, seed) {
  const S = c.width, ctx = c.getContext('2d');
  const r = rng(seed);
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 260; i++) {
    ctx.fillStyle = rgba(r() < 0.5 ? '#000' : '#fff', 0.03 + r() * 0.05);
    ctx.beginPath();
    ctx.arc(r() * S, r() * S, 2 + r() * 26, 0, Math.PI * 2);
    ctx.fill();
  }
  noise(ctx, S, 22, seed + 4);
}

function carpet(c, base, seed) {
  const S = c.width, ctx = c.getContext('2d');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, S, S);
  noise(ctx, S, 34, seed, 2);
  noise(ctx, S, 14, seed + 7, 1);
}

function pavers(c, base, seed) {
  const S = c.width, ctx = c.getContext('2d');
  const r = rng(seed);
  ctx.fillStyle = shade(base, -0.35);
  ctx.fillRect(0, 0, S, S);
  const rows = 3, h = S / rows, g = 4;
  for (let row = 0; row < rows; row++) {
    let x = row % 2 ? -S / 6 : 0;
    while (x < S) {
      const w = S / 3 + (r() - 0.5) * S * 0.08;
      const col = shade(base, (r() - 0.5) * 0.16);
      for (const ox of [0, x + w > S ? -S : null].filter((v) => v !== null)) {
        ctx.fillStyle = col;
        ctx.fillRect(x + ox + g / 2, row * h + g / 2, w - g, h - g);
      }
      x += w;
    }
  }
  noise(ctx, S, 18, seed + 2);
}

function deck(c, base, seed) {
  planks(c, base, seed, 5, '#1b130c');
}

function grass(c, base, seed) {
  const S = c.width, ctx = c.getContext('2d');
  const r = rng(seed);
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 2600; i++) {
    const x = r() * S, y = r() * S;
    ctx.strokeStyle = rgba(shade(base, (r() - 0.45) * 0.5), 0.55);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + (r() - 0.5) * 4, y - 3 - r() * 6);
    ctx.stroke();
  }
  noise(ctx, S, 14, seed + 6);
}

function brick(c, base, seed) {
  const S = c.width, ctx = c.getContext('2d');
  const r = rng(seed);
  ctx.fillStyle = '#d8d2c6';
  ctx.fillRect(0, 0, S, S);
  const rows = 14, h = S / rows, w = S / 4, g = 3;
  for (let row = 0; row < rows; row++) {
    const off = row % 2 ? w / 2 : 0;
    for (let k = -1; k < 5; k++) {
      ctx.fillStyle = shade(base, (r() - 0.5) * 0.22);
      ctx.fillRect(k * w + off + g / 2, row * h + g / 2, w - g, h - g);
    }
  }
  noise(ctx, S, 16, seed + 3);
}

function plaster(c, base, seed) {
  const S = c.width, ctx = c.getContext('2d');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, S, S);
  noise(ctx, S, 12, seed, 2);
  noise(ctx, S, 6, seed + 1, 1);
}

function woodPanel(c, base, seed) {
  const S = c.width, ctx = c.getContext('2d');
  const r = rng(seed);
  const n = 7, w = S / n;
  for (let i = 0; i < n; i++) {
    const col = shade(base, (r() - 0.5) * 0.14);
    ctx.fillStyle = col;
    ctx.fillRect(i * w, 0, w, S);
    grain(ctx, i * w, 0, w, S, col, r, false);
    ctx.fillStyle = rgba('#000', 0.3);
    ctx.fillRect(i * w, 0, 1.5, S);
  }
  noise(ctx, S, 8, seed + 2);
}

function stoneWall(c, base, seed) {
  const S = c.width, ctx = c.getContext('2d');
  const r = rng(seed);
  ctx.fillStyle = shade(base, -0.4);
  ctx.fillRect(0, 0, S, S);
  let y = 0;
  while (y < S) {
    const h = 30 + r() * 40;
    let x = -r() * 40;
    while (x < S) {
      const w = 50 + r() * 80;
      ctx.fillStyle = shade(base, (r() - 0.5) * 0.3);
      ctx.beginPath();
      ctx.roundRect(x + 2, y + 2, w - 4, h - 4, 8);
      ctx.fill();
      x += w;
    }
    y += h;
  }
  noise(ctx, S, 18, seed + 5);
}

/** Canvas with the texture of a floor material (cached). size 512 for 3D, smaller for 2D. */
function floorCanvas(id, size = 512) {
  const key = 'f:' + id + ':' + size;
  if (cache.has(key)) return cache.get(key);
  const f = FLOOR_BY_ID[id] || FLOORS[0];
  const c = canvas(size);
  const seed = [...f.id].reduce((s, ch) => s + ch.charCodeAt(0) * 7, 11);
  switch (f.tex) {
    case 'planks': planks(c, f.color, seed); break;
    case 'basket': basket(c, f.color, seed); break;
    case 'tiles': tiles(c, f.color, f.grout || shade(f.color, -0.2), f.n || 4, seed); break;
    case 'checker': checker(c, f.color, f.color2 || '#333', f.n || 4); break;
    case 'marble': marble(c, f.color, seed); break;
    case 'concrete': concrete(c, f.color, seed); break;
    case 'carpet': carpet(c, f.color, seed); break;
    case 'pavers': pavers(c, f.color, seed); break;
    case 'deck': deck(c, f.color, seed); break;
    case 'grass': grass(c, f.color, seed); break;
    default: plaster(c, f.color, seed);
  }
  cache.set(key, c);
  return c;
}

/** Wall finish texture tinted with a colour (cached). Returns null for plain paint. */
function wallCanvas(tex, color, size = 256) {
  if (!tex || tex === 'paint') return null;
  const key = 'w:' + tex + ':' + color + ':' + size;
  if (cache.has(key)) return cache.get(key);
  const c = canvas(size);
  switch (tex) {
    case 'plaster': plaster(c, color, 3); break;
    case 'brick': brick(c, mix(color, '#a5543a', 0.65), 4); break;
    case 'wallTiles': tiles(c, color, shade(color, -0.12), 5, 6); break;
    case 'woodPanel': woodPanel(c, mix(color, '#b08155', 0.7), 8); break;
    case 'stoneWall': stoneWall(c, mix(color, '#9d968a', 0.6), 9); break;
    default: plaster(c, color, 3);
  }
  cache.set(key, c);
  return c;
}

const urlCache = new Map();
function floorDataUrl(id, size = 128) {
  const key = id + ':' + size;
  if (!urlCache.has(key)) urlCache.set(key, floorCanvas(id, size).toDataURL('image/jpeg', 0.82));
  return urlCache.get(key);
}
function wallTexDataUrl(tex, color, size = 96) {
  const c = wallCanvas(tex, color, size);
  if (!c) return null;
  const key = 'w:' + tex + ':' + color + ':' + size;
  if (!urlCache.has(key)) urlCache.set(key, c.toDataURL('image/jpeg', 0.82));
  return urlCache.get(key);
}

/** World size (cm) one texture tile covers. */
function floorTileSize(id) {
  const f = FLOOR_BY_ID[id];
  if (!f) return 120;
  if (f.tex === 'tiles') return f.n === 2 ? 120 : 100;
  if (f.tex === 'checker') return 120;
  if (f.tex === 'grass') return 200;
  if (f.tex === 'carpet') return 100;
  if (f.tex === 'pavers') return 150;
  if (f.tex === 'marble') return 120;
  if (f.tex === 'concrete') return 200;
  return 120;
}
return { FLOORS, FLOOR_BY_ID, WALL_TEXTURES, WALL_COLORS, ITEM_COLORS, floorCanvas, wallCanvas, floorDataUrl, wallTexDataUrl, floorTileSize };
})();

// --- part helpers ------------------------------------------------------------
const B = (x, y, z, w, d, h, m = 'main', r = 0, rz = 0) => ({ t: 'box', x, y, z, w, d, h, m, r, rz });
const C = (x, y, z, rad, h, m = 'main', rTop = null, seg = 28) => ({ t: 'cyl', x, y, z, r: rad, r2: rTop ?? rad, h, m, seg });
const S = (x, y, z, rx, ry, rz, m = 'main') => ({ t: 'sph', x, y, z, rx, ry, rz, m });
const HC = (x, y, z, rad, length, axis, m = 'main') => ({ t: 'hcyl', x, y, z, r: rad, len: length, axis, m });

function legs(w, d, inset, size, h, m = 'second', round = false) {
  const xs = w / 2 - inset - size / 2, ys = d / 2 - inset - size / 2;
  return [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sy]) =>
    round ? C(sx * xs, sy * ys, 0, size / 2, h, m, null, 14) : B(sx * xs, sy * ys, 0, size, size, h, m));
}

function sofaParts(w, d, h, seatsOverride) {
  const arm = Math.min(22, w * 0.12), back = Math.min(22, d * 0.24), legH = 10, seatTop = Math.min(44, h * 0.52);
  const n = seatsOverride || (w >= 200 ? 3 : w >= 125 ? 2 : 1);
  const parts = [
    ...legs(w, d, 6, 5, legH, 'darkwood', true),
    B(0, 0, legH, w, d, seatTop - legH - 12, 'main', 3),
    B(0, -d / 2 + back / 2, legH, w, back, h - legH, 'main', 5),
    B(-w / 2 + arm / 2, 0, legH, arm, d, Math.min(h - legH, seatTop + 16 - legH), 'main', 5),
    B(w / 2 - arm / 2, 0, legH, arm, d, Math.min(h - legH, seatTop + 16 - legH), 'main', 5),
  ];
  const inner = w - 2 * arm, cw = inner / n;
  for (let i = 0; i < n; i++) {
    const cx = -inner / 2 + cw * (i + 0.5);
    parts.push(B(cx, back / 2, seatTop - 12, cw - 1.5, d - back - 2, 12, 'main+', 5));
    parts.push(B(cx, -d / 2 + back + 7, seatTop, cw - 3, 14, Math.max(10, h - seatTop - 8), 'main+', 6));
  }
  return parts;
}

function cabinetFronts(w, d, z, h, cols, m = 'main+', handle = 'chrome', handleTop = true) {
  const parts = [];
  const cw = w / cols;
  for (let i = 0; i < cols; i++) {
    const cx = -w / 2 + cw * (i + 0.5);
    parts.push(B(cx, d / 2 - 0.8, z + 1, cw - 0.8, 1.6, h - 2, m, 0.3));
    if (handle) parts.push(B(cx, d / 2 + 0.6, handleTop ? z + h - 8 : z + 6, Math.min(30, cw * 0.5), 1.5, 1.5, handle));
  }
  return parts;
}

function baseCabinet(w, d, h) {
  return [
    B(0, -2, 0, w - 1, d - 8, 10, 'black'),
    B(0, -1, 10, w - 0.4, d - 2, h - 14, 'main'),
    B(0, 0.5, h - 4, w, d + 1, 4, 'second', 0.5),
  ];
}

function cooktop(x, y, z, w, d) {
  const parts = [B(x, y, z, w, d, 0.8, 'black', 0.3)];
  const ox = w * 0.24, oy = d * 0.22;
  for (const [sx, sy, r] of [[-1, -1, 9], [1, -1, 7], [-1, 1, 7], [1, 1, 9]]) parts.push(C(x + sx * ox, y + sy * oy, z + 0.8, r, 0.3, 'metal', null, 24));
  return parts;
}

    B(x, y, z - 0.2, w, d, 0.6, 'chrome', 0.3),
    B(x, y + 1, z + 0.3, w - 6, d - 8, 0.2, 'metal', 0.1),
    C(x, y - d / 2 - 2, z, 1.6, 24, 'chrome', null, 14),
    B(x, y - d / 2 + 6, z + 22, 2.6, 16, 2.6, 'chrome'),
  ];
}

const isDoorKind = (kind) => ['door', 'double', 'sliding', 'passage', 'garage', 'french'].includes(kind);

/** Resolve a part material key to a concrete material description for an item. */
function resolveMaterial(key, item, def) {
  const main = item.color || def.color || '#cccccc';
  const second = item.color2 || def.color2 || '#333333';
  switch (key) {
    case 'main': return { color: main, rough: 0.75 };
    case 'main+': return { color: shade(main, 0.1), rough: 0.8 };
    case 'main-': return { color: shade(main, -0.12), rough: 0.75 };
    case 'second': return { color: second, rough: 0.6 };
    case 'second+': return { color: shade(second, 0.12), rough: 0.6 };
    default: return MATERIALS[key] || { color: main, rough: 0.7 };
  }
}

function itemParts(item) {
  const def = ITEMS[item.type];
  if (!def || !def.model) return [];
  try {
    return def.model(item.w, item.d, item.h);
  } catch (e) {
    return [B(0, 0, 0, item.w, item.d, item.h, 'main')];
  }
}

function defaultItem(type) {
  const def = ITEMS[type];
  return {
    type, w: def.w, d: def.d, h: def.h, elev: def.elev || 0, rot: 0,
    color: def.color || null, color2: def.color2 || null, flip: false,
  };
}

function searchCatalog(q) {
  const s = q.trim().toLowerCase();
  const out = [];
  for (const [id, def] of Object.entries(ITEMS)) {
    if (!s || def.name.toLowerCase().includes(s) || (def.tags || '').includes(s)) out.push({ kind: 'item', id, def });
  }
  for (const [id, def] of Object.entries(OPENINGS)) {
    if (!s || def.name.toLowerCase().includes(s) || (def.tags || '').includes(s)) out.push({ kind: 'opening', id, def });
  }
  return out;
}
return { CATEGORIES, MATERIALS, ITEMS, OPENINGS, isDoorKind, resolveMaterial, itemParts, defaultItem, searchCatalog };

function createPlan2D(app, host) {
  const svg = document.createElementNS(SVGNS, 'svg');

  const gridRects = svg.querySelectorAll('.grid-r');

  const view = { s: 0.5, tx: 200, ty: 120 };
  let cursorWorld = null;
  let gesture = null;
  let chain = null; // wall drawing: {pts: []}
  let roomFirst = null; // room tool two-click mode
  let measureFirst = null;
  let calibFirst = null;
  let placement = null; // {kind, type, world}
  let hoverSnap = null;
  let spaceDown = false;
  const pointers = new Map();
  const symCache = new Map();

  // ---------------------------------------------------------------- view
  function toWorld(cx, cy) {

  }
  function toScreen(p) {

  function size() {

  function zoomAt(k, sx, sy) {

    const kk = ns / view.s;
    view.tx = sx - (sx - view.tx) * kk;
    view.ty = sy - (sy - view.ty) * kk;
    view.s = ns;

  }
  function zoomBy(k) {

  }

    if (!lv.walls.length) return levelBounds(lv);

    for (const w of lv.walls) pts.push(w.a, w.b);
    const b = bbox(pts);
    const pad = Math.max(b.w, b.h) * 0.08 + 40;
    return { minX: b.minX - pad, minY: b.minY - pad, maxX: b.maxX + pad, maxY: b.maxY + pad, w: b.w + 2 * pad, h: b.h + 2 * pad };
  }
  function fit(bounds) {
    const b = bounds || levelBounds(LV()) || { minX: -100, minY: -100, maxX: 900, maxY: 700, w: 1000, h: 800 };
    trackSize();
    const { w, h } = size();
    const pad = 60;
    const s = clamp(Math.min((w - pad * 2) / Math.max(b.w, 200), (h - pad * 2) / Math.max(b.h, 200)), 0.04, 4);
    view.s = s;
    view.tx = w / 2 - ((b.minX + b.maxX) / 2) * s;

  function worldCenter() {

  // ---------------------------------------------------------------- render
  let raf = 0, rafView = 0;
  function render() {

  }

      lastH = r.height;

  function renderBackground(lv) {

  }

  function renderGhost(lv) {
    const below = levelBelow(app.project, lv);

    let s = '';

    return s;
  }

  function renderRooms(lv, d) {
    let s = '';
    for (const f of d.faces) {
      const room = lv.rooms.find((r) => r.id === f.roomId);
      if (!room) continue;
      const pd = pathD(f.poly);
      if (room.showFloor === false) {
        s += `<path class="room nofloor" d="${pd}" data-k="room" data-id="${room.id}"/>`;
      } else {
        s += `<path class="room" d="${pd}" fill="url(#${floorPatternId(room.floor)})" data-k="room" data-id="${room.id}"/><path class="room-veil" d="${pd}"/>`;

  function renderWalls(d) {

  function arcPath(c, from, to) {
    const a1 = Math.atan2(from.y - c.y, from.x - c.x), a2 = Math.atan2(to.y - c.y, to.x - c.x);

  function openingSymbol(def, o, t) {
    const w = o.width, hw = w / 2, ht = t / 2;
    const sg = o.swing ? -1 : 1;
    let s = `<rect class="op-hit" x="${f1(-hw)}" y="${f1(-ht - 4)}" width="${f1(w)}" height="${f1(t + 8)}"/>`;
    s += `<rect class="op-cut" x="${f1(-hw)}" y="${f1(-ht - 0.4)}" width="${f1(w)}" height="${f1(t + 0.8)}"/>`;

    const leaf = (hu, len, dir) => {

      x += `<path class="op-glass" d="M${f1(-hw)} -1.5L${f1(hw)} -1.5M${f1(-hw)} 1.5L${f1(hw)} 1.5"/>`;

      for (let i = 1; i < panes; i++) {

      }

    switch (def.kind) {
      case 'door': s += leaf(o.flip ? hw : -hw, w, o.flip ? -1 : 1); break;
      case 'double': s += leaf(-hw, hw, 1) + leaf(hw, hw, -1); break;
