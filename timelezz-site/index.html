<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIMELEZZ – Taschen aus LKW-Planen</title>
<meta name="description" content="Design-Vorschau für den TIMELEZZ Online-Shop">
<meta name="theme-color" content="#111110">
<link rel="preconnect" href="https://rebago.com">
<style>
:root{
  --paper:#F2EFE8;
  --tile:#E7E3DA;
  --white:#FBFAF6;
  --ink:#111110;
  --ink-2:#3B3A36;
  --muted:#67645C;
  --hair:rgba(17,17,16,.16);
  --signal:#FFD60A;
  --ok:#0B6B34;
  --font:Arial,'Helvetica Neue',Helvetica,'Liberation Sans',sans-serif;
  --wrap:1480px;
  --gutter:clamp(16px,3.2vw,40px);
  --head:60px;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--head) + 12px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
img,svg{display:block}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit;border-radius:0;touch-action:manipulation}
h1,h2,h3,h4,p,dl,dd{margin:0}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:max(var(--gutter),env(safe-area-inset-left)) max(var(--gutter),env(safe-area-inset-right))}
:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;flex:none}

/* ---- shared pieces ---- */
/* Fotos sind auf Weiss freigestellt: multiply legt sie sauber auf die Kachel */
.tile{background:var(--tile);overflow:hidden;position:relative;display:block}
.tile img{mix-blend-mode:multiply}
.label{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:1.3}
.plate{display:inline-flex;align-items:center;height:22px;padding:0 7px;background:var(--white);border:2px solid var(--ink);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.plate.y{background:var(--signal)}
.display{font-weight:700;text-transform:uppercase;letter-spacing:-.05em;line-height:.88;overflow-wrap:anywhere;text-wrap:balance}
.h-sec{font-size:clamp(34px,5.8vw,88px);font-weight:700;text-transform:uppercase;letter-spacing:-.05em;line-height:.9;text-wrap:balance}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 40px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:18px}
.sec-head p{max-width:24em;font-size:clamp(16px,1.4vw,19px);line-height:1.35;color:var(--ink-2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border:2px solid var(--ink);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.1;white-space:nowrap;transition:background-color .15s ease,color .15s ease,transform .14s var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-line{background:transparent;color:var(--ink)}
.btn-y{background:var(--signal);color:var(--ink)}
.btn .ico{width:18px;height:18px;transition:transform .2s var(--ease-out)}
@media (hover:hover) and (pointer:fine){
  .btn-ink:hover{background:var(--signal);color:var(--ink)}
  .btn-line:hover{background:var(--ink);color:var(--paper)}
  .btn-y:hover{background:var(--ink);color:var(--signal)}
  .btn:hover .ico{transform:translateX(4px)}
}

/* Planen-Fläche mit Naht und Ösen */
.tarp{position:relative;background:var(--signal);color:var(--ink)}
.tarp::before{content:"";position:absolute;inset:10px;border:2px dashed rgba(17,17,16,.34);pointer-events:none}
.eye{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px #C9C5BC,0 0 0 5px rgba(17,17,16,.35);pointer-events:none}
.eye.tl{left:26px;top:26px}.eye.tr{right:26px;top:26px}.eye.bl{left:26px;bottom:26px}.eye.br{right:26px;bottom:26px}
@media (max-width:640px){.tarp::before{inset:7px}.eye{width:12px;height:12px;box-shadow:0 0 0 3px #C9C5BC,0 0 0 4px rgba(17,17,16,.35)}.eye.tl,.eye.bl{left:17px}.eye.tr,.eye.br{right:17px}.eye.tl,.eye.tr{top:17px}.eye.bl,.eye.br{bottom:17px}}

/* ---- Vorschau-Hinweis ---- */
.preview{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 24px);padding:7px 10px;background:var(--white);border:2px dashed var(--ink);font-size:11.5px;line-height:1.3;color:var(--ink-2)}
.preview b{color:var(--ink)}
.preview i{width:9px;height:9px;background:var(--signal);border:2px solid var(--ink);flex:none}
.preview button{width:28px;height:28px;margin:-4px -6px -4px 0;display:grid;place-items:center;flex:none}
.preview button .ico{width:14px;height:14px}
.preview[hidden]{display:none}

/* ---- Gurtband (Laufschrift) ---- */
.strap{background:var(--ink);color:var(--paper);overflow:hidden;border-bottom:2px solid var(--ink)}
.strap-track{display:flex;width:max-content;animation:strap 38s linear infinite}
.strap-set{display:flex;flex:none}
.strap-set span{display:flex;align-items:center;gap:14px;height:36px;padding-right:14px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.strap-set span::after{content:"";width:8px;height:8px;background:var(--signal);transform:rotate(45deg);margin-left:0}
@keyframes strap{to{transform:translateX(-50%)}}

/* ---- Kopf ---- */
.head{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:2px solid var(--ink)}
.head-in{display:flex;align-items:center;justify-content:space-between;gap:18px;height:var(--head)}
.mark{font-size:24px;font-weight:700;letter-spacing:-.06em;line-height:1;white-space:nowrap;text-transform:uppercase;display:inline-flex;align-items:center}
.mark span{background:var(--signal);padding:3px 5px 2px 3px;margin-left:1px;border:2px solid var(--ink)}
.links{display:flex;gap:clamp(12px,1.9vw,30px);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.links a{white-space:nowrap;padding:8px 0;background:linear-gradient(var(--ink),var(--ink)) 0 calc(100% - 3px)/0 2px no-repeat;transition:background-size .2s var(--ease-out)}
.links a[aria-current="true"]{background-size:100% 2px}
@media (hover:hover) and (pointer:fine){.links a:hover{background-size:100% 2px}}
.acts{display:flex;align-items:center;gap:2px}
.ibtn{width:44px;height:44px;display:grid;place-items:center;position:relative;transition:background-color .15s ease,transform .14s var(--ease-out)}
.ibtn:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.ibtn:hover{background:var(--signal)}}
.cart-count{position:absolute;top:3px;right:1px;min-width:18px;height:18px;padding:0 4px;background:var(--signal);border:2px solid var(--ink);font-size:10px;font-weight:700;line-height:1;display:grid;place-items:center;opacity:0;transform:scale(.8);transition:opacity .15s ease,transform .2s var(--ease-out)}
.cart-count.on{opacity:1;transform:none}
.lang{position:relative}
.lang-btn{height:44px;padding:0 10px;font-size:12px;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;gap:4px}
.lang-btn .ico{width:14px;height:14px}
@media (hover:hover) and (pointer:fine){.lang-btn:hover{background:var(--signal)}}
.lang-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:190px;background:var(--white);border:2px solid var(--ink);transform-origin:top right;opacity:0;transform:scale(.97);pointer-events:none;visibility:hidden;transition:opacity .14s ease,transform .16s var(--ease-out),visibility 0s .16s}
.lang.open .lang-menu{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition:opacity .14s ease,transform .16s var(--ease-out)}
.lang-menu button{display:flex;width:100%;justify-content:space-between;align-items:center;min-height:44px;padding:0 12px;font-size:14px;border-bottom:1px solid var(--hair)}
.lang-menu button:last-child{border-bottom:0}
.lang-menu button[aria-checked="true"]{background:var(--signal);font-weight:700}
@media (hover:hover) and (pointer:fine){.lang-menu button:hover{background:var(--tile)}.lang-menu button[aria-checked="true"]:hover{background:var(--signal)}}
.lang-menu small{font-size:11px;font-weight:700;letter-spacing:.08em}
.menu-btn{display:none}
@media (max-width:1180px){
  .links{display:none}
  .menu-btn{display:grid;margin-left:-10px}
  .head-in{display:grid;grid-template-columns:1fr auto 1fr}
  .mark{justify-self:center}
  .acts{justify-self:end;margin-right:-10px}
}
@media (max-width:640px){.acts .lang{display:none}.mark{font-size:21px}}

/* ---- Hero ---- */
.hero{padding:clamp(12px,1.6vw,22px) 0 0}
.hero .tarp{padding:clamp(40px,5vw,72px) clamp(26px,4.4vw,72px) clamp(120px,15vw,230px)}
.hero-top{display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding-inline:clamp(0px,1.6vw,22px)}
.hero h1{font-size:clamp(40px,11.4vw,196px);margin-top:clamp(18px,2.4vw,34px)}
.hero-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:22px 48px;flex-wrap:wrap;margin-top:clamp(22px,3vw,44px)}
.hero-foot p{max-width:27em;font-size:clamp(17px,1.7vw,23px);line-height:1.32;font-weight:700;letter-spacing:-.015em}
.ctas{display:flex;flex-wrap:wrap;gap:10px}
.lineup{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1vw,14px);margin-top:calc(clamp(88px,11.5vw,180px) * -1);padding-inline:clamp(26px,4.4vw,72px)}
.pick{display:flex;flex-direction:column;background:var(--white);border:2px solid var(--ink);transition:transform .25s var(--ease-out)}
.pick .tile{aspect-ratio:4/3;background:var(--white)}
.pick img{width:100%;height:100%;object-fit:contain;transform:scale(1.06);transition:transform .35s var(--ease-out)}
.pick-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 8px;padding:9px 10px;border-top:2px solid var(--ink);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1.2}
.pick-foot span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.pick .plate{position:absolute;left:8px;top:8px;z-index:1}
.pick:active{transform:scale(.985)}
@media (hover:hover) and (pointer:fine){.pick:hover{transform:translateY(-6px)}.pick:hover img{transform:scale(1.12)}}
@media (max-width:900px){
  .lineup{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-inline:var(--gutter);margin-inline:calc(var(--gutter) * -1);scroll-padding-inline:var(--gutter);margin-top:-104px}
  .lineup::-webkit-scrollbar{display:none}
  .pick{flex:none;width:min(64vw,300px);scroll-snap-align:start}
  .hero .tarp{padding-bottom:132px}
}

/* ---- Kategorien (Frachtliste) ---- */
.intro{padding:clamp(56px,7.5vw,120px) 0 0}
.cats{margin-top:clamp(22px,3vw,40px);border-top:2px solid var(--ink);isolation:isolate}
.cat{position:relative;display:grid;grid-template-columns:2.6em minmax(0,1fr) auto clamp(84px,11vw,156px) 44px;align-items:center;gap:clamp(12px,2vw,30px);width:100%;padding:clamp(10px,1.2vw,16px) 0;border-bottom:2px solid var(--ink)}
.cat::before{content:"";position:absolute;inset:0 calc(var(--gutter) * -1);background:var(--signal);opacity:0;z-index:-1;transition:opacity .15s ease}
.cat .n{font-size:12px;font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.cat b{font-size:clamp(26px,5.4vw,80px);line-height:.95;letter-spacing:-.05em;text-transform:uppercase;overflow-wrap:break-word;hyphens:auto;min-width:0}
.cat small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;font-variant-numeric:tabular-nums}
.cat .tile{aspect-ratio:4/3;border:2px solid var(--ink);background:var(--white)}
.cat img{width:100%;height:100%;object-fit:contain;transform:scale(1.12);transition:transform .35s var(--ease-out)}
.cat .ico{width:28px;height:28px;justify-self:end;transition:transform .25s var(--ease-out)}
.cat[aria-current="true"]::before{opacity:1}
@media (hover:hover) and (pointer:fine){.cat:hover::before{opacity:1}.cat:hover .ico{transform:translateX(6px)}.cat:hover img{transform:scale(1.22)}}
.cat:active::before{opacity:1}
@media (max-width:700px){
  .cat{grid-template-columns:84px minmax(0,1fr) 24px;grid-template-areas:"th name arr" "th cnt arr";gap:2px 14px;padding:10px 0}
  .cat .n{display:none}
  .cat .tile{grid-area:th}
  .cat b{grid-area:name;align-self:end;font-size:clamp(19px,5.8vw,26px);letter-spacing:-.04em}
  .cat small{grid-area:cnt;align-self:start;color:var(--ink-2)}
  .cat .ico{grid-area:arr;width:22px;height:22px}
}

/* ---- Neu eingetroffen ---- */
.latest{padding:clamp(56px,7.5vw,120px) 0 0}
.rail-nav{display:flex;gap:8px}
.rail-nav button{width:48px;height:48px;display:grid;place-items:center;border:2px solid var(--ink);transition:background-color .15s ease,transform .14s var(--ease-out)}
.rail-nav button:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.rail-nav button:hover{background:var(--signal)}}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:clamp(22px,3vw,40px);padding-inline:max(var(--gutter),calc((100vw - var(--wrap)) / 2 + var(--gutter)));scroll-padding-inline:max(var(--gutter),calc((100vw - var(--wrap)) / 2 + var(--gutter)))}
.rail::-webkit-scrollbar{display:none}
.rcard{flex:none;width:clamp(248px,24vw,340px);scroll-snap-align:start;display:flex;flex-direction:column;position:relative}
.rcard .tile{aspect-ratio:1/1}
.rcard img{width:100%;height:100%;object-fit:contain;transform:scale(1.06);transition:transform .35s var(--ease-out)}
.rcard .plate{position:absolute;left:10px;top:10px;z-index:1}
.rcard-txt{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0 0;border-top:2px solid var(--ink);margin-top:10px}
.rcard .rc-h{font-size:clamp(20px,1.9vw,28px);font-weight:700;letter-spacing:-.04em;text-transform:uppercase;line-height:1}
.rcard .pr{font-size:14px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.rcard .rc-m{grid-column:1/-1;font-size:13px;color:var(--muted)}
@media (hover:hover) and (pointer:fine){.rcard:hover img{transform:scale(1.13)}}

/* ---- Modelle im Fokus ---- */
.spots{padding:clamp(56px,7.5vw,120px) 0 0}
.spot-grid{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);background:var(--ink);gap:2px}
.spot{container-type:inline-size;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-areas:"lab lab" "name name" "txt img";grid-template-rows:auto auto 1fr;gap:0 16px;background:var(--paper);padding:clamp(18px,2.2vw,32px);overflow:hidden}
.spot.alt{background:var(--white)}
.spot .label{grid-area:lab}
.spot h3{grid-area:name;position:relative;z-index:1;font-size:clamp(30px,9.4cqw,104px);font-weight:700;letter-spacing:-.055em;text-transform:uppercase;line-height:.88;margin-top:14px;overflow-wrap:break-word;pointer-events:none}
.spot-txt{grid-area:txt;align-self:end;display:grid;gap:14px}
.spot p{font-size:clamp(15px,1.3vw,18px);line-height:1.3;color:var(--ink-2);font-weight:700}
.spot .links2{display:flex;gap:8px;flex-wrap:wrap}
.spot .links2 .btn{min-height:44px;padding:0 16px;font-size:12px}
.spot .tile{grid-area:img;background:transparent;overflow:visible;margin:-2cqw -1cqw -1cqw 0;align-self:end}
.spot img{width:100%;aspect-ratio:4/3;object-fit:contain;transform:scale(1.12);transition:transform .45s var(--ease-out)}
@media (hover:hover) and (pointer:fine){.spot .tile:hover img{transform:scale(1.19)}}
@media (max-width:1000px){.spot-grid{grid-template-columns:1fr}}
@media (max-width:560px){
  .spot{grid-template-columns:1fr;grid-template-areas:"lab" "img" "name" "txt";grid-template-rows:auto;padding-bottom:22px}
  .spot .tile{margin:6px 0 0}
  .spot h3{font-size:clamp(28px,10.4cqw,60px);margin:6px 0 10px}
}

/* ---- Katalog ---- */
.catalog{padding:clamp(56px,7.5vw,120px) 0 0}
.tools{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.search{position:relative;width:min(340px,100%);flex:1 1 240px}
.search input{width:100%;height:48px;border:2px solid var(--ink);background:var(--white);padding:0 12px 0 42px;font-size:16px;border-radius:0;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;background:#fff;box-shadow:inset 0 -4px 0 var(--signal)}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;pointer-events:none}
.select{position:relative;display:flex;align-items:center;height:48px;border:2px solid var(--ink);background:var(--white);padding-left:12px}
.select span{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.select select{-webkit-appearance:none;appearance:none;border:0;background:transparent;height:100%;font-size:16px;padding:0 36px 0 8px;cursor:pointer;border-radius:0;max-width:60vw}
.select select:focus{outline:none}
.select:focus-within{box-shadow:inset 0 -4px 0 var(--signal)}
.select .ico{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;pointer-events:none}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:clamp(20px,2.6vw,34px) calc(var(--gutter) * -1) 0;padding:0 var(--gutter)}
.tabs::-webkit-scrollbar,.models::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:2px solid var(--ink);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;transition:background-color .15s ease,color .15s ease,transform .14s var(--ease-out)}
.tab:active{transform:scale(.97)}
.tab small{font-size:11px;letter-spacing:.02em;opacity:.65;font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tab[aria-pressed="true"] small{opacity:1;color:var(--signal)}
@media (hover:hover) and (pointer:fine){.tab[aria-pressed="false"]:hover{background:var(--signal)}}
.models{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px calc(var(--gutter) * -1) 0;padding:0 var(--gutter)}
.models[hidden]{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;background:var(--tile);font-size:13px;font-weight:700;white-space:nowrap;transition:background-color .15s ease,color .15s ease}
.chip small{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--signal);box-shadow:inset 0 0 0 2px var(--ink)}
@media (hover:hover) and (pointer:fine){.chip[aria-pressed="false"]:hover{background:#DAD5CA}}
.meta-line{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;margin:14px 0 10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.reset{min-height:44px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(26px,2.8vw,44px) 12px}
@media (max-width:1180px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 8px}}
.card{position:relative;min-width:0;animation:rise .4s var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.card-media{position:relative}
.card .tile{width:100%;aspect-ratio:1/1}
.card .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scale(1.08);transition:opacity .25s ease,transform .45s var(--ease-out)}
.card .tile .alt2{opacity:0}
@media (hover:hover) and (pointer:fine){
  .card:hover .tile .alt2{opacity:1}
  .card:hover .tile img:first-child:not(:only-of-type){opacity:0}
  .card:hover .tile img{transform:scale(1.13)}
}
.card .plate{position:absolute;left:8px;top:8px;pointer-events:none}

.card-body{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:10px 0 0;border-top:2px solid var(--ink);margin-top:8px}
.card-name{font-size:clamp(14px,1.25vw,17px);font-weight:700;letter-spacing:-.02em;text-transform:uppercase;line-height:1.15;overflow-wrap:break-word;hyphens:auto;min-width:0}

@media (max-width:760px){

/* ---- Warum ---- */
.why{margin-top:clamp(64px,8.5vw,136px);background:var(--ink);color:var(--paper);padding:clamp(52px,6.5vw,104px) 0}

.why-top{display:flex;justify-content:space-between;align-items:center;color:var(--signal)}
.why-top .ico{width:34px;height:34px}
.why-top span{font-size:12px;font-weight:700;letter-spacing:.09em;font-variant-numeric:tabular-nums}

/* ---- Geschichte ---- */
.story{padding:clamp(56px,7.5vw,120px) 0 0}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:2px solid var(--ink);margin-top:clamp(32px,4.5vw,64px);background:var(--white)}
.steps>div{padding:clamp(16px,2vw,28px);display:grid;gap:8px;align-content:start}
.steps>div+div{border-left:2px solid var(--ink)}
.steps .n{font-size:clamp(56px,7vw,112px);font-weight:700;letter-spacing:-.06em;line-height:.8;color:transparent;-webkit-text-stroke:2px var(--ink);font-variant-numeric:tabular-nums;margin-bottom:10px}
.steps b{display:block;font-size:clamp(19px,1.8vw,26px);font-weight:700;letter-spacing:-.035em;text-transform:uppercase;line-height:1.05}
.steps p{font-size:15px;color:var(--ink-2)}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.strip .tile{aspect-ratio:4/3}
.strip img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scale(1.04);transition:transform .45s var(--ease-out)}

@media (max-width:860px){
  .story-top{grid-template-columns:1fr}

  .steps>div+div{border-left:0;border-top:2px solid var(--ink)}

  .strip{grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}

}

/* ---- Fragen ---- */
.faq{padding:clamp(56px,7.5vw,120px) 0 0}
.faq-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:24px clamp(24px,5vw,88px);border-top:2px solid var(--ink);padding-top:18px}

.faq-list details[open] summary i{background:var(--signal)}

/* ---- Newsletter ---- */

.foot{margin-top:clamp(56px,7.5vw,120px);background:var(--ink);color:#C9C5BC;font-size:14px;padding:clamp(40px,5vw,72px) 0 calc(28px + env(safe-area-inset-bottom));overflow:hidden}

.foot h4{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--signal);margin:0 0 12px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.foot li a{display:inline-block;padding:5px 0;color:var(--paper)}
.foot li span{display:block;padding:5px 0;max-width:22em}
@media (hover:hover) and (pointer:fine){.foot li a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;color:var(--signal)}}
.foot-mark{font-size:clamp(56px,18.6vw,312px);font-weight:700;letter-spacing:-.02em;line-height:.8;text-transform:uppercase;color:transparent;-webkit-text-stroke:2px #55534D;margin:clamp(36px,5vw,72px) 0 0 -.05em;white-space:nowrap;user-select:none}
.foot .bottom{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:clamp(24px,3vw,40px);padding-top:18px;border-top:2px solid #3B3A36;font-size:12px;padding-bottom:44px}

/* ---- Produkt-Ansicht ---- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(17,17,16,.62);opacity:0;pointer-events:none;transition:opacity .2s ease}
.scrim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;z-index:80;left:50%;top:50%;width:min(1200px,calc(100vw - 40px));max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow:auto;overscroll-behavior:contain;background:var(--paper);border:2px solid var(--ink);opacity:0;pointer-events:none;visibility:hidden;transform:translate(-50%,-50%) scale(.97);transition:opacity .16s ease,transform .16s ease,visibility 0s .16s}
.modal.on{opacity:1;pointer-events:auto;visibility:visible;transform:translate(-50%,-50%);transition:opacity .22s ease,transform .28s var(--ease-out)}
.m-close{position:absolute;right:0;top:0;z-index:3;background:var(--ink);color:var(--paper);width:48px;height:48px}

.thumbs button{aspect-ratio:1/1;box-shadow:inset 0 0 0 0 var(--ink)}
.thumbs button::after{content:"";position:absolute;inset:0;border:3px solid var(--ink);opacity:0;transition:opacity .12s ease}
.thumbs button[aria-current="true"]::after{opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}
.m-sib{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;padding-top:12px;border-top:2px dashed var(--hair);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.m-sib button{min-height:32px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sibs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.sibs button{aspect-ratio:1/1}
.sibs img{width:100%;height:100%;object-fit:cover;transform:scale(1.1);transition:transform .3s var(--ease-out)}
@media (hover:hover) and (pointer:fine){.sibs button:hover img{transform:scale(1.2)}}
.m-info{padding:clamp(22px,3vw,40px);display:flex;flex-direction:column}

.m-info h2{font-size:clamp(36px,4.4vw,68px);margin:16px 0 8px}
.m-sub{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

  .modal.on{transform:none;transition:transform .42s var(--ease-drawer)}

.drawer.on{transform:none;visibility:visible;transition:transform .42s var(--ease-drawer)}
.drawer.left{left:0;right:auto;width:min(380px,90vw);border-left:0;border-right:2px solid var(--ink);transform:translateX(-100%)}

.d-head{display:flex;justify-content:space-between;align-items:center;padding:0 0 0 20px;min-height:var(--head);border-bottom:2px solid var(--ink);padding-top:env(safe-area-inset-top)}

.line-item span{display:block;font-size:12.5px;color:var(--muted)}
.line-item .rm{min-height:32px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;margin-top:2px}
.line-item .lp{color:var(--ink);font-size:15px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.subtotal{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.subtotal span:last-child{font-size:24px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.d-note{font-size:12.5px;color:var(--muted)}
.cart-empty{padding:56px 0;text-align:center;display:grid;gap:18px;justify-items:center;font-weight:700}
.cart-empty .ico{width:44px;height:44px}
.m-nav{display:grid;grid-template-columns:minmax(0,1fr);padding:6px 20px;overflow:auto}
.m-nav a{font-size:clamp(23px,7.4vw,34px);font-weight:700;letter-spacing:-.05em;text-transform:uppercase;line-height:1;padding:13px 0;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:center;gap:12px}
.m-nav a span{min-width:0;overflow-wrap:break-word;hyphens:auto}
.m-nav a .ico{width:22px;height:22px}
.m-langs-l{padding:22px 20px 10px}
.m-langs{display:flex;gap:6px;padding:0 20px calc(22px + env(safe-area-inset-bottom));flex-wrap:wrap}
.m-langs .chip{height:44px}

.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));z-index:90;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 24px);padding:12px 16px;background:var(--ink);color:var(--paper);border:2px solid var(--signal);font-size:14px;font-weight:700;opacity:0;transform:translate(-50%,14px);transition:opacity .18s ease,transform .22s var(--ease-out);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .ico{width:18px;height:18px;color:var(--signal)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}

}

const LANGS = [['de','Deutsch'],['en','English'],['fr','Français'],['it','Italiano']];
let lang = 'de';
try { const s = localStorage.getItem('tlz-lang'); if (s && I18N[s]) lang = s; } catch (e) {}
const t = (k, vars) => {
  let s = (I18N[lang] && I18N[lang][k]) || I18N.de[k] || k;
  if (vars) for (const v in vars) s = s.replace('{' + v + '}', vars[v]);
  return BRAND === 'TIMELEZZ' ? s : s.split('TIMELEZZ').join(BRAND);
};

/* ---------- catalogue (generated from the manufacturer feed) ---------- */
const DATA = window.TLZ_DATA || {base:'', models:{}, items:[]};
const CATS = ['backpacks','shoulder','hip','shopper','wallets','acc'];
const MODELS = DATA.models;
Object.keys(MODELS).forEach(k => { MODELS[k].key = k; MODELS[k].count = 0; MODELS[k].min = Infinity; });
const PIECES = DATA.items.filter(r => MODELS[r[1]]).map(r => {
  const m = MODELS[r[1]]; m.count++; m.min = Math.min(m.min, r[3]);
  return {id:String(r[0]), m, nr:r[2], price:r[3], mats:r[4], cap:r[5], a4:r[6], lap:r[7], fast:r[8], pockets:r[9], dims:r[10], imgs:r[11]};
});
const BYID = Object.fromEntries(PIECES.map(p => [p.id, p]));
/* "Empfohlen" mischt die Modelle: erst je das neuste Stück jedes Modells, dann je das zweite usw. */
const seenPerModel = {};
PIECES.forEach((p, i) => { p.idx = i; p.rank = seenPerModel[p.m.key] = (seenPerModel[p.m.key] || 0) + 1; });
const FEATURED = PIECES.slice().sort((a, b) => a.rank - b.rank || a.idx - b.idx);
const DEFAULT_SIZES = ['300x300','600x450','1024x768'];
function img(code, size){
  const parts = code.split('|');
  const ext = parts[1] || 'webp';
  const suf = parts.length > 1 ? parts[2 + size] : DEFAULT_SIZES[size];
  if (suf && suf[0] === '!') return suf.slice(1);
  return DATA.base + parts[0] + (suf ? '-' + suf : '') + '.' + ext;
}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const imgTag = (code, sizes, alt, cls, eager) => `<img${cls ? ` class="${cls}"` : ''} src="${img(code, 1)}" srcset="${img(code, 0)} 300w, ${img(code, 1)} 600w, ${img(code, 2)} 1024w" sizes="${sizes}" alt="${esc(alt)}"${eager ? '' : ' loading="lazy"'} decoding="async">`;
const mname = m => Array.isArray(m.name) ? (t('type_' + m.type) + (m.name[1] ? ' ' + (m.name[1].indexOf('v_') === 0 ? t(m.name[1]) : m.name[1]) : '')) : m.name;
const label = p => `${mname(p.m)} ${t('nr')} ${p.nr}`;
const pickPiece = (model, hint) => PIECES.find(p => p.m.key === model && (!hint || p.imgs[0].indexOf(hint) >= 0)) || PIECES.find(p => p.m.key === model) || PIECES[0];
const metaLine = p => {
  const bits = [];
  if (!Array.isArray(p.m.name)) bits.push(t('type_' + p.m.type));
  else if (p.mats.length && String(p.m.name[1]).indexOf('v_') !== 0) bits.push(t('mat_' + p.mats[0]));
  if (p.cap) bits.push(p.cap);
  return bits.join(' · ');
};

/* ---------- helpers ---------- */
const num = n => n.toLocaleString('de-CH');
const fmt = n => 'CHF ' + num(n) + '.–';

const plate = (p, y) => `<span class="plate${y ? ' y' : ''}">${t('nr')} ${esc(p.nr)}</span>`;

function applyBrand(){

  $$('[data-brand-plain]').forEach(el => { el.textContent = BRAND; });
}
function applyI18n(){
  document.documentElement.lang = lang;
  document.title = t('doc_title');
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });

  $('#foot-cats').innerHTML = CATS.map(c => `<li><a href="#shop" data-cat="${c}">${t('cat_' + c)}</a></li>`).join('');
  const usps = ['usp1_t','usp2_t','usp3_t','usp4_t'].map(k => `<span>${t(k)}</span>`).join('');

  $('#hero-count').textContent = t('pieces', {n: num(PIECES.length)});
}

const CAT_REP = {backpacks:['david-m','52aa'], shoulder:['pablo','56aa'], hip:['beltbag-l','75d'], shopper:['shopper','35a'], wallets:['wallet-l','51d'], acc:['pouch','']};

function renderLineup(){

function renderRail(){

  for (const p of PIECES){ if (!seen.has(p.m.key)){ seen.add(p.m.key); picks.push(p); } if (picks.length === 12) break; }
  $('#rail').innerHTML = picks.map(p => `<button class="rcard" data-open="${p.id}" aria-label="${esc(t('view', {name: label(p)}))}">
      <span class="tile">${plate(p)}${imgTag(p.imgs[0], '340px', label(p))}</span>

}

    return `<button class="tab" data-cat="${c}" aria-pressed="${st.cat === c}">${c === 'all' ? t('all') : t('cat_' + c)}<small>${num(count)}</small></button>`;
  }).join('');
  $$('.cat,#nav-links a[data-cat]').forEach(el => el.setAttribute('aria-current', String(el.dataset.cat === st.cat)));
  const box = $('#models');
  if (st.cat === 'all'){ box.hidden = true; box.innerHTML = ''; return; }
  const ms = Object.values(MODELS).filter(m => m.cat === st.cat && m.count);
  box.hidden = false;
  box.innerHTML = `<button class="chip" data-model="all" aria-pressed="${st.model === 'all'}">${t('all_models')}</button>` +
    ms.map(m => `<button class="chip" data-model="${m.key}" aria-pressed="${st.model === m.key}">${esc(mname(m))}<small>${m.count}</small></button>`).join('');
}

function filtered(){
  const q = norm(st.q.trim());
  let list = FEATURED.filter(p => (st.cat === 'all' || p.m.cat === st.cat) && (st.model === 'all' || p.m.key === st.model));
  if (q) list = list.filter(p => norm(`${mname(p.m)} ${t('type_' + p.m.type)} ${p.nr} ${t('cat_' + p.m.cat)} ${p.mats.map(x => t('mat_' + x)).join(' ')}`).includes(q));
  const byName = (a, b) => mname(a.m).localeCompare(mname(b.m)) || (+a.nr - +b.nr);
  if (st.sort === 'asc') list = list.slice().sort((a, b) => a.price - b.price || byName(a, b));
  if (st.sort === 'desc') list = list.slice().sort((a, b) => b.price - a.price || byName(a, b));
  if (st.sort === 'name') list = list.slice().sort(byName);
  return list;
}

const inCart = id => cart.includes(id);
const CARD_SIZES = '(max-width:760px) 50vw, (max-width:1180px) 33vw, 360px';
function cardHTML(p, i){
  const c = inCart(p.id);
  return `<article class="card" style="animation-delay:${Math.min(i % STEP, 12) * 30}ms">
    <div class="card-media">
      <button class="tile" data-open="${p.id}" aria-label="${esc(t('view', {name: label(p)}))}">${imgTag(p.imgs[0], CARD_SIZES, label(p))}${p.imgs[1] ? imgTag(p.imgs[1], CARD_SIZES, '', 'alt2') : ''}</button>
      ${plate(p)}
      <button class="qadd${c ? ' in' : ''}" data-add="${p.id}" aria-label="${c ? t('in_cart') : t('add')}">${ico(c ? 'check' : 'plus')}</button>
    </div>
    <div class="card-body">
      <button class="card-name" data-open="${p.id}" tabindex="-1">${esc(mname(p.m))}</button>
      <span class="card-price">${fmt(p.price)}</span>
      <span class="card-meta">${esc(metaLine(p) || t('type_' + p.m.type))}</span>
      <span class="card-u">${t('unique')}</span>
    </div>
  </article>`;
}
function loadHTML(shown, total){
  const pct = total ? Math.round(shown / total * 100) : 0;
  return total ? `<span>${t('shown', {x: num(shown), n: num(total)})}</span><span class="bar"><i style="width:${pct}%"></i></span>${shown < total ? `<button class="btn btn-ink" data-act="more">${t('load_more')}${ico('plus')}</button>` : ''}` : '';
}

function renderShop(){
  renderFilters();
  const list = filtered();
  const shown = list.slice(0, st.limit);
  $('#count').textContent = t('results', {n: num(list.length)});
  $('#reset').hidden = !(st.cat !== 'all' || st.model !== 'all' || st.q);
  $('#grid').innerHTML = shown.length ? shown.map(cardHTML).join('') : `<p class="empty">${t('empty')}</p>`;
  $('#load').innerHTML = loadHTML(shown.length, list.length);
}
function appendMore(){
  const list = filtered();
  const from = st.limit;
  st.limit += STEP;
  $('#grid').insertAdjacentHTML('beforeend', list.slice(from, st.limit).map((p, i) => cardHTML(p, i)).join(''));
  $('#load').innerHTML = loadHTML(Math.min(st.limit, list.length), list.length);
}

function syncAddButtons(){
  $$('.qadd').forEach(b => {
    const c = inCart(b.dataset.add);
    b.classList.toggle('in', c);
    b.setAttribute('aria-label', c ? t('in_cart') : t('add'));
    b.innerHTML = ico(c ? 'check' : 'plus');
  });
}

function renderCart(){
  const cnt = $('#cart-count');
  cnt.textContent = cart.length;
  cnt.classList.toggle('on', cart.length > 0);
  const body = $('#cart-body'), foot = $('#cart-foot');
  if (!cart.length){
    body.innerHTML = `<div class="cart-empty">${ico('bag')}<p>${t('cart_empty')}</p><button class="btn btn-line" data-act="continue">${t('continue')}</button></div>`;
    foot.innerHTML = '';
    return;
  }
  body.innerHTML = cart.map(id => {
    const p = BYID[id];
    return `<div class="line-item"><button class="th tile" data-open="${p.id}" aria-label="${esc(t('view', {name: label(p)}))}"><img src="${img(p.imgs[0], 0)}" alt="" loading="lazy"></button>
      <div><b>${esc(mname(p.m))}</b><span>${esc(metaLine(p) || t('type_' + p.m.type))} · ${t('nr')} ${p.nr}</span><button class="rm" data-rm="${p.id}">${t('remove')}</button></div>
      <span class="lp">${fmt(p.price)}</span></div>`;
  }).join('');
  const sum = cart.reduce((s, id) => s + BYID[id].price, 0);
  foot.innerHTML = `<div class="subtotal"><span>${t('subtotal')}</span><span>${fmt(sum)}</span></div>
    <p class="d-note">${t('cart_note')}</p>
    <button class="btn btn-ink" data-act="checkout">${t('checkout')}${ico('chev-r')}</button>
    <div class="pays" style="justify-content:center">${PAYS}</div>`;
}

function modalHTML(p){
  const sibs = PIECES.filter(x => x.m === p.m && x !== p).slice(0, 6);
  const c = inCart(p.id);
  const yn = v => v === 1 ? t('yes') : t('no');
  const rows = [];
  if (p.mats.length) rows.push([t('spec_mat'), p.mats.map(x => t('mat_' + x)).join(', ')]);
  if (p.cap) rows.push([t('spec_cap'), p.cap]);
  if (p.dims) rows.push([t('spec_dims'), p.dims]);
  if (p.a4 >= 0) rows.push([t('spec_a4'), yn(p.a4)]);
  if (p.lap >= 0) rows.push([t('spec_laptop'), yn(p.lap)]);
  if (p.fast.length) rows.push([t('spec_fast'), p.fast.map(x => t('fast_' + x)).join(', ')]);
  if (p.pockets) rows.push([t('spec_pockets'), p.pockets]);
  const cur = Math.min(modalImg, p.imgs.length - 1);
  return `<button class="ibtn m-close" data-act="close" aria-label="${t('close')}">${ico('close')}</button>
  <div class="modal-inner">
    <div class="m-media">
      <div class="m-main tile"><img src="${img(p.imgs[cur], 2)}" alt="${esc(label(p))}"></div>
      ${p.imgs.length > 1 ? `<div class="thumbs">${p.imgs.map((code, i) => `<button class="tile" data-img="${i}" aria-current="${i === cur}" aria-label="${t('photo', {n: i + 1})}"><img src="${img(code, 0)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
      ${sibs.length ? `<div class="m-sib"><span>${t('more_pieces')}</span><button data-model="${p.m.key}" data-jump="1">${t('see_model', {n: p.m.count})}</button></div>
      <div class="sibs">${sibs.map(s => `<button class="tile" data-open="${s.id}" aria-label="${esc(label(s))}"><img src="${img(s.imgs[0], 0)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
    </div>
    <div class="m-info">
      <div class="m-tags"><span class="plate y">${t('unique')}</span>${plate(p)}</div>
      <h2 class="display" id="m-title">${esc(mname(p.m))}</h2>
      <p class="m-sub">${t('type_' + p.m.type)} · ${t('nr')} ${p.nr}</p>
      <p class="m-price">${fmt(p.price)}</p>
      <p class="avail"><i></i>${t('only_one')}</p>
      <p class="m-desc">${t('desc_' + p.m.cat)}</p>
      <dl class="specs">${rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
      <div class="m-cta">
        <button class="btn ${c ? 'btn-y' : 'btn-ink'}" data-add="${p.id}">${c ? ico('check') + t('in_cart') : t('add')}</button>
        <div class="pays">${PAYS}</div>
      </div>
    </div>
  </div>`;
}

/* ---------- overlays ---------- */
function lock(on){ document.documentElement.style.overflow = on ? 'hidden' : ''; }
function openModal(id, keepImg){
  const p = BYID[id]; if (!p) return;
  const m = $('#modal');
  const wasOpen = m.classList.contains('on');
  closeDrawers();
  if (!keepImg) modalImg = 0;
  const switching = wasOpen && modalId !== id;
  modalId = id;
  m.innerHTML = modalHTML(p);
  if (switching) m.scrollTop = 0;
  if (!wasOpen){
    lastFocus = document.activeElement;
    m.scrollTop = 0;
    $('#scrim').classList.add('on');
    m.classList.add('on');
    lock(true);
    setTimeout(() => { const b = m.querySelector('.m-close'); if (b) b.focus({preventScroll:true}); }, 60);
  }
}
function openDrawer(id){
  const wasModal = $('#modal').classList.contains('on');
  $('#modal').classList.remove('on'); modalId = null;
  closeDrawers();
  if (!wasModal) lastFocus = document.activeElement;
  $('#scrim').classList.add('on');
  const d = $('#' + id); d.classList.add('on');
  lock(true);
  setTimeout(() => { const b = d.querySelector('[data-act="close"]'); if (b) b.focus({preventScroll:true}); }, 60);
}
function closeDrawers(){ $$('.drawer').forEach(d => d.classList.remove('on')); }
function closeAll(){
  const any = $('#scrim').classList.contains('on');
  $('#modal').classList.remove('on'); modalId = null;
  closeDrawers();
  $('#scrim').classList.remove('on');
  lock(false);
  if (any && lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true});
}
let toastTimer;
function toast(msg){
  const el = $('#toast');
  el.innerHTML = ico('check') + '<span></span>';
  el.querySelector('span').textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2600);
}
function scrollToShop(){ $('#shop').scrollIntoView({behavior: smooth(), block:'start'}); }

function addToCart(id){
  if (inCart(id)){ openDrawer('cart'); return; }
  cart.push(id);
  renderCart(); syncAddButtons();
  if (modalId) openModal(modalId, true);
  toast(t('added', {name: label(BYID[id])}));
}

function renderAll(){
  applyBrand(); applyI18n(); renderIntro(); renderLineup(); renderRail(); renderSpots(); renderStrip(); renderShop(); renderCart();
  if (modalId) $('#modal').innerHTML = modalHTML(BYID[modalId]);
}
function setLang(l){
  if (!I18N[l]) return;
  lang = l;
  try { localStorage.setItem('tlz-lang', l); } catch (e) {}
  renderAll();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const langBtn = e.target.closest('.lang-btn');
  const L = $('#lang');
  if (langBtn){ const o = !L.classList.contains('open'); L.classList.toggle('open', o); langBtn.setAttribute('aria-expanded', o); return; }
  if (!e.target.closest('#lang')){ L.classList.remove('open'); $('.lang-btn').setAttribute('aria-expanded', 'false'); }
  const el = e.target.closest('[data-lang],[data-add],[data-open],[data-img],[data-rm],[data-cat],[data-model],[data-act]');
  if (!el) return;
  const d = el.dataset;
  if (d.lang){ setLang(d.lang); L.classList.remove('open'); return; }
  if (d.add){ addToCart(d.add); return; }
  if (d.open){ openModal(d.open); return; }
  if (d.img){ modalImg = +d.img; openModal(modalId, true); return; }
  if (d.rm){ cart.splice(cart.indexOf(d.rm), 1); renderCart(); syncAddButtons(); return; }
  if (d.cat){
    e.preventDefault();
    st.cat = d.cat; st.model = 'all'; st.limit = STEP; renderShop();
    if (!el.closest('#tabs')){ closeAll(); scrollToShop(); }
    return;
  }
  if (d.model){
    if (d.model !== 'all') st.cat = MODELS[d.model].cat;
    st.model = d.model; st.limit = STEP; renderShop();
    if (d.jump){ closeAll(); setTimeout(scrollToShop, 30); }
    return;
  }
  switch (d.act){
    case 'note': $('#preview').hidden = true; break;
    case 'menu': openDrawer('menu'); break;
    case 'cart': openDrawer('cart'); break;
    case 'close': case 'continue': case 'nav': closeAll(); break;
    case 'search': closeAll(); scrollToShop(); setTimeout(() => $('#q').focus({preventScroll:true}), reduce ? 0 : 450); break;
    case 'checkout': toast(t('checkout_toast')); break;
    case 'more': appendMore(); break;
    case 'rail-prev': $('#rail').scrollBy({left: -($('#rail').clientWidth * .8), behavior: smooth()}); break;
    case 'rail-next': $('#rail').scrollBy({left: $('#rail').clientWidth * .8, behavior: smooth()}); break;
    case 'reset': st.cat = 'all'; st.model = 'all'; st.q = ''; st.limit = STEP; $('#q').value = ''; renderShop(); break;
  }
});
$('#q').addEventListener('input', e => { st.q = e.target.value; st.limit = STEP; renderShop(); });
$('#sort').addEventListener('change', e => { st.sort = e.target.value; st.limit = STEP; renderShop(); });
$('#news-form').addEventListener('submit', e => { e.preventDefault(); toast(t('news_toast')); e.target.reset(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeAll(); $('#lang').classList.remove('open'); return; }
  if (modalId && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')){
    const p = BYID[modalId];
    modalImg = (modalImg + (e.key === 'ArrowRight' ? 1 : -1) + p.imgs.length) % p.imgs.length;
    openModal(modalId, true);
  }
});

renderAll();
})();
</script>
</body>
</html>
