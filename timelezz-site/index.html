<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIMELEZZ – Taschen aus LKW-Planen</title>
<meta name="description" content="Design-Vorschau für den TIMELEZZ Online-Shop">
<meta name="theme-color" content="#07090D">
<style>
/* Layout: dunkle Bühne, jedes Unikat leuchtet in seiner eigenen Planenfarbe (--c). */
@property --c{syntax:'<color>';inherits:true;initial-value:#A6ECFF}
:root{
  color-scheme:dark;
  --bg:#07090D;
  --bg-2:#0D1016;
  --panel:rgba(255,255,255,.045);
  --panel-2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.10);
  --line-2:rgba(255,255,255,.20);
  --fg:#F3F5F9;
  --fg-2:#C5CBD6;
  --muted:#8D95A5;
  --ice:#A6ECFF;
  --ok:#62E3A4;
  --font:Arial,'Helvetica Neue',Helvetica,'Liberation Sans',sans-serif;
  --wrap:1320px;
  --gutter:clamp(16px,3.4vw,40px);
  --r:24px;
  --sec:clamp(72px,9vw,136px);
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:92px}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
/* feines Raster im Hintergrund, nach unten ausgeblendet */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:72px 72px;-webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0,#000,transparent);mask-image:radial-gradient(ellipse 90% 70% at 50% 0,#000,transparent)}
img,svg{display:block}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit;touch-action:manipulation}
h1,h2,h3,h4,p,dl,dd{margin:0}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--ice);outline-offset:3px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- Bausteine ---- */
.label{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);line-height:1.4}
.h-sec{font-size:clamp(30px,4.2vw,58px);font-weight:700;letter-spacing:-.04em;line-height:1.02;text-wrap:balance;max-width:17em}
.h-sec span{color:var(--muted)}
.sec{padding-top:var(--sec)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px 40px;flex-wrap:wrap;margin-bottom:clamp(24px,3vw,40px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;transition:background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .25s ease,transform .14s var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn-light{background:var(--fg);color:#0A0C11}
.btn-ghost{border:1px solid var(--line-2);color:var(--fg);background:rgba(255,255,255,.03)}
.btn .ico{width:18px;height:18px;transition:transform .2s var(--ease-out)}
@media (hover:hover) and (pointer:fine){
  .btn-light:hover{background:#fff;box-shadow:0 0 0 4px rgba(166,236,255,.16),0 10px 40px -8px rgba(166,236,255,.55)}
  .btn-ghost:hover{border-color:var(--fg);background:rgba(255,255,255,.08)}
  .btn:hover .ico{transform:translateX(3px)}
}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:var(--r)}
/* Bühne: Fläche, auf der ein Stück in seiner Farbe leuchtet */
.stage{position:relative;display:block;width:100%;overflow:hidden;border-radius:var(--r);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line)}
.stage::before{content:"";position:absolute;inset:6%;border-radius:50%;background:radial-gradient(closest-side,var(--c),transparent);opacity:.3;transition:opacity .35s ease}
.stage svg{position:relative;width:100%;height:100%;transition:transform .45s var(--ease-out)}
@media (hover:hover) and (pointer:fine){
  .lift:hover .stage::before,.stage.lift:hover::before{opacity:.52}
  .lift:hover .stage svg,.stage.lift:hover svg{transform:translateY(-6px) scale(1.035)}
}
.nr{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2);font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.nr::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}

/* ---- Vorschau-Hinweis ---- */
.preview{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 24px);padding:8px 8px 8px 14px;border-radius:999px;background:rgba(13,16,22,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line-2);font-size:12px;line-height:1.3;color:var(--fg-2)}
.preview b{color:var(--fg)}
.preview i{width:7px;height:7px;border-radius:50%;background:var(--ice);box-shadow:0 0 10px var(--ice);flex:none}
.preview button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--panel-2)}
.preview button .ico{width:13px;height:13px}
.preview[hidden]{display:none}

/* ---- Info-Zeile + Navigation ---- */
.ribbon{font-size:12px;color:var(--muted);letter-spacing:.04em}
.ribbon .wrap{display:flex;justify-content:center;align-items:center;gap:6px 26px;flex-wrap:wrap;min-height:40px;padding-block:8px;text-align:center}
.ribbon span{display:inline-flex;align-items:center;gap:26px}
.ribbon span+span::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--line-2)}
@media (max-width:760px){.ribbon span:not(:first-child){display:none}}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:40;padding-inline:max(var(--gutter),env(safe-area-inset-left,0px)) max(var(--gutter),env(safe-area-inset-right,0px))}
.nav-in{max-width:calc(var(--wrap) - 2 * var(--gutter));margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;height:58px;padding:0 8px 0 24px;border-radius:999px;background:rgba(13,16,22,.72);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--line);box-shadow:0 10px 40px -12px rgba(0,0,0,.6)}
.logo{font-size:15px;font-weight:700;letter-spacing:.34em;margin-right:-.34em;white-space:nowrap;text-transform:uppercase}
.links{display:flex;gap:clamp(4px,.6vw,10px);font-size:13.5px;color:var(--fg-2)}
.links a{white-space:nowrap;padding:8px 12px;border-radius:999px;transition:color .2s ease,background-color .2s ease}
.links a[aria-current="true"]{color:var(--fg);background:var(--panel-2)}
@media (hover:hover) and (pointer:fine){.links a:hover{color:var(--fg);background:var(--panel-2)}}
.acts{display:flex;align-items:center;gap:2px}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;color:var(--fg-2);transition:background-color .2s ease,color .2s ease,transform .14s var(--ease-out)}
.ibtn:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.ibtn:hover{background:var(--panel-2);color:var(--fg)}}
.cart-count{position:absolute;top:5px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ice);color:#06141A;font-size:10px;font-weight:700;line-height:1;display:grid;place-items:center;opacity:0;transform:scale(.8);transition:opacity .15s ease,transform .2s var(--ease-out)}
.cart-count.on{opacity:1;transform:none}
.lang{position:relative}
.lang-btn{height:44px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--fg-2);display:flex;align-items:center;gap:4px;transition:background-color .2s ease}
.lang-btn .ico{width:14px;height:14px}
@media (hover:hover) and (pointer:fine){.lang-btn:hover{background:var(--panel-2);color:var(--fg)}}
.lang-menu{position:absolute;right:0;top:calc(100% + 12px);min-width:200px;padding:6px;border-radius:18px;background:rgba(17,20,28,.96);border:1px solid var(--line-2);box-shadow:0 20px 60px -10px rgba(0,0,0,.7);transform-origin:top right;opacity:0;transform:scale(.96);pointer-events:none;visibility:hidden;transition:opacity .14s ease,transform .16s var(--ease-out),visibility 0s .16s}
.lang.open .lang-menu{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition:opacity .14s ease,transform .16s var(--ease-out)}
.lang-menu button{display:flex;width:100%;justify-content:space-between;align-items:center;min-height:44px;padding:0 14px;border-radius:12px;font-size:14px}
.lang-menu button[aria-checked="true"]{background:var(--panel-2);font-weight:700}
@media (hover:hover) and (pointer:fine){.lang-menu button:hover{background:var(--panel-2)}}
.lang-menu small{font-size:11px;letter-spacing:.1em;color:var(--muted)}
.menu-btn{display:none}
@media (max-width:1180px){
  .links{display:none}
  .menu-btn{display:grid}
  .nav-in{display:grid;grid-template-columns:1fr auto 1fr;padding:0 8px}
  .logo{justify-self:center}
  .acts{justify-self:end}
}
@media (max-width:640px){.acts .lang{display:none}.logo{font-size:14px;letter-spacing:.28em;margin-right:-.28em}}

/* ---- Hero ---- */
.hero{position:relative;padding:clamp(28px,4vw,56px) 0 0;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:clamp(24px,4vw,64px);align-items:center}
.hero h1{font-size:clamp(42px,6.9vw,104px);font-weight:700;letter-spacing:-.05em;line-height:.95;text-wrap:balance;margin-top:18px;background:linear-gradient(180deg,#fff 30%,#A9B3C6);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
.hero .sub{font-size:clamp(17px,1.55vw,21px);line-height:1.42;color:var(--fg-2);max-width:28em;margin-top:clamp(16px,2vw,26px)}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(22px,2.6vw,34px)}
.hero-stage{position:relative;aspect-ratio:1/1;max-height:640px;width:100%;margin-inline:auto;display:grid;place-items:center;transition:--c .7s ease}
.hero-stage::before{content:"";position:absolute;inset:2%;border-radius:50%;background:radial-gradient(closest-side,var(--c),transparent 72%);opacity:.42;transition:--c .7s ease}
.ring{position:absolute;left:50%;top:60%;width:92%;aspect-ratio:1/.3;border:1px solid rgba(255,255,255,.16);border-radius:50%;transform:translate(-50%,-50%) rotate(-7deg);pointer-events:none}
.ring.b{width:112%;top:63%;border-color:rgba(255,255,255,.07);transform:translate(-50%,-50%) rotate(5deg)}
.hero-bag{position:relative;width:98%;aspect-ratio:1/1;display:block;border-radius:40px}
.hero-bag svg{width:100%;height:100%;animation:float 7s ease-in-out infinite;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
@keyframes float{0%,100%{transform:translateY(-1.2%)}50%{transform:translateY(1.6%)}}
.readouts{position:absolute;left:0;right:0;bottom:2%;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;pointer-events:none}
.readout{display:grid;gap:3px;padding:9px 14px;border-radius:14px;background:rgba(13,16,22,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line)}
.readout small{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.readout b{font-size:13.5px;font-weight:700;letter-spacing:-.01em;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.picker{display:flex;justify-content:center;gap:8px;margin-top:14px}
.hp{width:clamp(48px,5.2vw,64px);aspect-ratio:1/1;border-radius:16px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden;transition:border-color .2s ease,background-color .2s ease,transform .14s var(--ease-out)}
.hp:active{transform:scale(.94)}
.hp svg{width:100%;height:100%}
.hp[aria-pressed="true"]{border-color:var(--c);background:var(--panel-2);box-shadow:0 0 18px -4px var(--c)}
@media (hover:hover) and (pointer:fine){.hp:hover{background:var(--panel-2)}}
@media (max-width:900px){
  .hero-grid{grid-template-columns:1fr}
  .hero-stage{max-width:520px;aspect-ratio:1/.88}
}

/* ---- Kategorien ---- */
.cats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.cat{display:flex;flex-direction:column;gap:12px;min-width:0}
.cat .stage{aspect-ratio:1/1.08}
.cat-txt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:0 4px}
.cat b{display:block;font-size:clamp(15px,1.25vw,18px);font-weight:700;letter-spacing:-.02em;line-height:1.2;overflow-wrap:break-word;hyphens:auto;min-width:0}
.cat small{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.cat .ico{width:18px;height:18px;color:var(--muted);margin-top:2px;transition:transform .25s var(--ease-out),color .2s ease}
.cat[aria-current="true"] .stage{border-color:var(--c)}
@media (hover:hover) and (pointer:fine){.cat:hover .ico{transform:translate(2px,-2px);color:var(--fg)}}
@media (max-width:1100px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.cats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}

/* ---- Neu eingetroffen ---- */
.rail-nav{display:flex;gap:8px}
.rail-nav button{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--fg-2);transition:background-color .2s ease,color .2s ease,transform .14s var(--ease-out)}
.rail-nav button:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.rail-nav button:hover{background:var(--panel-2);color:var(--fg)}}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-inline:max(var(--gutter),calc((100vw - var(--wrap)) / 2 + var(--gutter)));scroll-padding-inline:max(var(--gutter),calc((100vw - var(--wrap)) / 2 + var(--gutter)))}
.rail::-webkit-scrollbar,.tabs::-webkit-scrollbar,.models::-webkit-scrollbar{display:none}
.rcard{flex:none;width:clamp(232px,23vw,312px);scroll-snap-align:start;display:flex;flex-direction:column;gap:12px;position:relative}
.rcard .stage{aspect-ratio:1/1}
.rcard .nr{position:absolute;left:16px;top:16px;z-index:1}
.rc-txt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:0 4px}
.rc-h{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.pr{font-size:15px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.rc-m{grid-column:1/-1;font-size:13px;color:var(--muted)}

/* ---- Modelle im Fokus ---- */
.spot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.spot{position:relative;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);align-items:center;gap:8px;padding:clamp(20px,2.4vw,34px);overflow:hidden;min-height:clamp(260px,24vw,340px)}
.spot::before{content:"";position:absolute;right:-12%;top:50%;width:64%;aspect-ratio:1/1;transform:translateY(-50%);border-radius:50%;background:radial-gradient(closest-side,var(--c),transparent);opacity:.3;transition:opacity .35s ease}
.spot-txt{position:relative;display:grid;gap:10px;align-content:center}
.spot h3{font-size:clamp(26px,2.9vw,42px);font-weight:700;letter-spacing:-.04em;line-height:1;overflow-wrap:break-word;hyphens:auto}
.spot p{font-size:clamp(15px,1.3vw,18px);line-height:1.35;color:var(--fg-2)}
.spot .links2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.spot .links2 .btn{min-height:44px;padding:0 18px;font-size:14px}
.spot-img{position:relative;display:block;aspect-ratio:1/1;border-radius:28px}
.spot-img svg{width:100%;height:100%;transition:transform .5s var(--ease-out)}
@media (hover:hover) and (pointer:fine){.spot:hover::before{opacity:.5}.spot:hover .spot-img svg{transform:translateY(-6px) scale(1.04)}}
@media (max-width:1000px){.spot-grid{grid-template-columns:1fr}}
@media (max-width:520px){.spot{grid-template-columns:1fr;text-align:left}.spot-img{order:-1;width:100%;max-width:220px;margin-inline:auto}.spot::before{right:auto;left:50%;top:26%;transform:translate(-50%,-50%);width:86%}}

/* ---- Katalog ---- */
.tools{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.search{position:relative;flex:1 1 240px;width:min(320px,100%)}
.search input{width:100%;height:48px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);padding:0 16px 0 44px;font-size:16px;-webkit-appearance:none;appearance:none;transition:border-color .2s ease,box-shadow .2s ease}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--ice);box-shadow:0 0 0 4px rgba(166,236,255,.14)}
.search .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.select{position:relative;display:flex;align-items:center;height:48px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);padding-left:16px;transition:border-color .2s ease,box-shadow .2s ease}
.select span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.select select{-webkit-appearance:none;appearance:none;border:0;background:transparent;height:100%;font-size:16px;padding:0 40px 0 8px;cursor:pointer;max-width:60vw}
.select select option{background:#12151C;color:var(--fg)}
.select select:focus{outline:none}
.select:focus-within{border-color:var(--ice);box-shadow:0 0 0 4px rgba(166,236,255,.14)}
.select .ico{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;pointer-events:none;color:var(--muted)}
.tabs,.models{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(var(--gutter) * -1);padding:0 var(--gutter)}
.models{margin-top:10px}
.models[hidden]{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);color:var(--fg-2);font-size:14px;font-weight:700;white-space:nowrap;transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .14s var(--ease-out)}
.tab:active{transform:scale(.97)}
.tab small{font-size:12px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"]{background:var(--fg);color:#0A0C11;border-color:var(--fg)}
.tab[aria-pressed="true"] small{color:#4A5261}
@media (hover:hover) and (pointer:fine){.tab[aria-pressed="false"]:hover{background:var(--panel-2);color:var(--fg)}}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--panel);color:var(--fg-2);font-size:13px;white-space:nowrap;transition:background-color .2s ease,color .2s ease}
.chip small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:rgba(166,236,255,.16);color:var(--ice);box-shadow:inset 0 0 0 1px rgba(166,236,255,.5)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
@media (hover:hover) and (pointer:fine){.chip[aria-pressed="false"]:hover{background:var(--panel-2);color:var(--fg)}}
.meta-line{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;margin:14px 0 8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.reset{min-height:44px;color:var(--fg-2);text-decoration:underline;text-underline-offset:4px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(24px,2.6vw,36px) 12px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 10px}}
.card{position:relative;min-width:0;animation:rise .45s var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.card-media{position:relative}
.card .stage{aspect-ratio:1/1}
.card .nr{position:absolute;left:16px;top:16px;pointer-events:none}
.qadd{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(13,16,22,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line-2);color:var(--fg);transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .14s var(--ease-out)}
.qadd:active{transform:scale(.92)}
.qadd .ico{width:18px;height:18px}
.qadd.in{background:var(--ice);color:#06141A;border-color:var(--ice)}
@media (hover:hover) and (pointer:fine){.qadd:hover{background:var(--fg);color:#0A0C11;border-color:var(--fg)}}
.card-body{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:12px 4px 0}
.card-name{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.2;overflow-wrap:break-word;hyphens:auto;min-width:0}
.card-meta{grid-column:1/-1;font-size:13px;color:var(--muted);line-height:1.35}
.empty{grid-column:1/-1;padding:72px 0;text-align:center;color:var(--muted);font-size:17px}
.load{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:clamp(32px,4vw,56px);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.load .bar{width:min(240px,60vw);height:3px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.load .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--ice),#fff)}
@media (max-width:480px){.card-body{grid-template-columns:1fr}.card .nr{left:12px;top:12px}.qadd{right:8px;bottom:8px}}

/* ---- Warum ---- */
.why-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.why-card{padding:clamp(20px,2.2vw,28px);display:grid;gap:8px;align-content:start}
.why-ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(166,236,255,.1);color:var(--ice);margin-bottom:14px;box-shadow:inset 0 0 0 1px rgba(166,236,255,.22)}
.why-ico .ico{width:24px;height:24px}
.why-card h3{font-size:clamp(18px,1.6vw,21px);font-weight:700;letter-spacing:-.02em;line-height:1.2}
.why-card p{font-size:15px;color:var(--fg-2)}
@media (max-width:1000px){.why-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.why-row{grid-template-columns:1fr}}

/* ---- Geschichte ---- */
.statement{font-size:clamp(26px,3.5vw,46px);line-height:1.16;font-weight:700;letter-spacing:-.035em;max-width:23em;margin-top:14px;text-wrap:pretty}
.statement span{color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:clamp(28px,4vw,52px);counter-reset:step}
.step{position:relative;padding:14px 14px clamp(18px,2vw,26px);display:grid;gap:6px;align-content:start}
.step .stage{aspect-ratio:4/3;border-radius:16px;margin-bottom:12px;background:rgba(0,0,0,.25)}
.step .n{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--ice);font-variant-numeric:tabular-nums;padding:0 6px}
.step b{display:block;font-size:clamp(18px,1.7vw,22px);font-weight:700;letter-spacing:-.02em;padding:0 6px}
.step p{font-size:15px;color:var(--fg-2);padding:0 6px}
@media (max-width:860px){.steps{grid-template-columns:1fr}}

/* ---- Fragen ---- */
.faq-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);gap:24px clamp(24px,5vw,88px)}
.faq-grid>div:first-child p{margin-top:14px;font-size:clamp(16px,1.4vw,19px);line-height:1.4;color:var(--fg-2);max-width:22em}
.faq-list{display:grid;gap:8px}
.faq-list details{border-radius:18px;background:var(--panel);border:1px solid var(--line);transition:background-color .2s ease,border-color .2s ease}
.faq-list details[open]{background:var(--panel-2);border-color:var(--line-2)}
.faq-list summary{list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:center;min-height:64px;padding:14px 16px 14px 22px;cursor:pointer;font-size:clamp(16px,1.4vw,18px);font-weight:700;letter-spacing:-.015em;line-height:1.25;border-radius:18px}
.faq-list summary::-webkit-details-marker{display:none}
.faq-list summary i{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--panel-2);transition:background-color .2s ease,color .2s ease}
.faq-list summary .ico{width:16px;height:16px;transition:transform .22s var(--ease-out)}
.faq-list details[open] summary i{background:var(--ice);color:#06141A}
.faq-list details[open] summary .ico{transform:rotate(45deg)}
.faq-list details p{padding:0 64px 22px 22px;color:var(--fg-2);max-width:44em}
@media (max-width:860px){.faq-grid{grid-template-columns:1fr}}

/* ---- Newsletter ---- */
.news-box{position:relative;overflow:hidden;padding:clamp(36px,5.5vw,76px) clamp(22px,5vw,76px);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px clamp(24px,4vw,64px);align-items:end;border-radius:clamp(24px,3vw,36px);border-color:var(--line-2)}
.news-box::before{content:"";position:absolute;left:-10%;bottom:-70%;width:70%;aspect-ratio:1/1;border-radius:50%;background:radial-gradient(closest-side,rgba(166,236,255,.34),transparent);pointer-events:none}
.news-box::after{content:"";position:absolute;right:-12%;top:-80%;width:60%;aspect-ratio:1/1;border-radius:50%;background:radial-gradient(closest-side,rgba(30,80,230,.34),transparent);pointer-events:none}
.news-box>*{position:relative;z-index:1}
.news-box h2{font-size:clamp(28px,4vw,54px);font-weight:700;letter-spacing:-.04em;line-height:1.02;text-wrap:balance}
.news-box p{color:var(--fg-2);margin-bottom:14px}
.news-form{display:flex;gap:8px;padding:6px;border-radius:999px;background:rgba(7,9,13,.6);border:1px solid var(--line-2);transition:border-color .2s ease,box-shadow .2s ease}
.news-form:focus-within{border-color:var(--ice);box-shadow:0 0 0 4px rgba(166,236,255,.14)}
.news-form input{flex:1;min-width:0;height:48px;border:0;background:transparent;padding:0 16px;font-size:16px;border-radius:999px;-webkit-appearance:none;appearance:none}
.news-form input::placeholder{color:var(--muted)}
.news-form input:focus{outline:none}
@media (max-width:860px){.news-box{grid-template-columns:1fr}}
@media (max-width:420px){.news-form{flex-direction:column;border-radius:26px}.news-form input{flex:none;width:100%}}

/* ---- Fuss ---- */
.foot{margin-top:var(--sec);border-top:1px solid var(--line);color:var(--muted);font-size:14px;padding:clamp(40px,5vw,64px) 0 calc(84px + env(safe-area-inset-bottom,0px))}
.foot .cols{display:grid;grid-template-columns:1.3fr repeat(3,minmax(0,1fr));gap:32px 24px}
.foot-brand .logo{color:var(--fg);font-size:17px}
.foot-brand p{margin-top:14px;max-width:24em}
.foot h4{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--fg);margin:0 0 12px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.foot li a{display:inline-block;padding:5px 0;color:var(--fg-2);transition:color .2s ease}
@media (hover:hover) and (pointer:fine){.foot li a:hover{color:var(--fg)}}
.foot .bottom{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:clamp(32px,4vw,56px);padding-top:20px;border-top:1px solid var(--line);font-size:12.5px}
.pays{display:flex;gap:6px;flex-wrap:wrap}
.pays span{height:26px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);color:var(--fg-2);font-size:10.5px;font-weight:700;letter-spacing:.04em;display:grid;place-items:center;white-space:nowrap}
@media (max-width:860px){.foot .cols{grid-template-columns:1fr 1fr}.foot-brand{grid-column:1/-1}}

/* ---- Produkt-Ansicht ---- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(3,4,7,.68);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .22s ease}
.scrim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;z-index:80;left:50%;top:50%;width:min(1140px,calc(100vw - 40px));max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow:auto;overscroll-behavior:contain;background:#0E1118;border:1px solid var(--line-2);border-radius:32px;box-shadow:0 40px 120px -20px rgba(0,0,0,.8);opacity:0;pointer-events:none;visibility:hidden;transform:translate(-50%,-50%) scale(.97);transition:opacity .16s ease,transform .16s ease,visibility 0s .16s}
.modal.on{opacity:1;pointer-events:auto;visibility:visible;transform:translate(-50%,-50%);transition:opacity .22s ease,transform .3s var(--ease-out)}
.m-close{position:absolute;right:14px;top:14px;z-index:3;background:var(--panel-2);color:var(--fg)}
.modal-inner{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.m-media{padding:16px;display:flex;flex-direction:column;gap:10px}
.m-main{aspect-ratio:1/.92;border-radius:22px}
.m-main::before{opacity:.42}
.thumbs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.thumbs button{aspect-ratio:1/1;border-radius:14px;transition:border-color .15s ease}
.thumbs button[aria-current="true"]{border-color:var(--c)}
.m-sib{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;font-size:13px;color:var(--muted)}
.m-sib button{min-height:32px;color:var(--fg);font-weight:700}
@media (hover:hover) and (pointer:fine){.m-sib button:hover{text-decoration:underline;text-underline-offset:4px}}
.sibs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.sibs button{aspect-ratio:1/1;border-radius:14px}
.m-info{padding:clamp(22px,3vw,40px);display:flex;flex-direction:column}
.m-tags{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-right:48px;min-height:30px}
.tag-u{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ice);background:rgba(166,236,255,.12);box-shadow:inset 0 0 0 1px rgba(166,236,255,.35)}
.m-info h2{font-size:clamp(32px,3.6vw,52px);font-weight:700;letter-spacing:-.045em;line-height:1;margin:16px 0 8px}
.m-sub{font-size:14px;color:var(--muted)}
.m-price{font-size:clamp(24px,2.3vw,30px);font-weight:700;letter-spacing:-.03em;margin:18px 0 6px;font-variant-numeric:tabular-nums}
.avail{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ok)}
.avail i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);flex:none}
.m-desc{margin:18px 0;color:var(--fg-2);font-size:15px}
.specs{margin:0 0 24px;font-size:14px}
.specs div{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-top:1px solid var(--line)}
.specs div:last-child{border-bottom:1px solid var(--line)}
.specs dt{color:var(--muted)}
.specs dd{text-align:right;font-weight:700}
.m-cta{display:grid;gap:14px;margin-top:auto}
.m-cta .btn{width:100%;min-height:56px;font-size:16px}
.m-cta .btn.in{background:var(--ice);color:#06141A}
.m-cta .pays{justify-content:center}
@media (max-width:900px){
  .modal{left:0;top:auto;bottom:0;width:100%;max-height:94vh;max-height:94dvh;border-radius:28px 28px 0 0;border-width:1px 0 0;transform:translateY(100%);opacity:1;transition:transform .22s ease,visibility 0s .22s}
  .modal.on{transform:none;transition:transform .42s var(--ease-drawer)}
  .modal-inner{grid-template-columns:1fr}
  .m-media{padding:12px 12px 0}
  .m-main{aspect-ratio:1/.8}
  .sibs{grid-template-columns:repeat(5,minmax(0,1fr))}
  .sibs button:nth-child(n+6){display:none}
  .m-info{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
}

/* ---- Seitenleisten ---- */
.drawer{position:fixed;z-index:80;top:0;right:0;height:100vh;height:100dvh;width:min(440px,100vw);background:#0E1118;border-left:1px solid var(--line-2);transform:translateX(100%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;display:flex;flex-direction:column}
.drawer.on{transform:none;visibility:visible;transition:transform .42s var(--ease-drawer)}
.drawer.left{left:0;right:auto;width:min(380px,90vw);border-left:0;border-right:1px solid var(--line-2);transform:translateX(-100%)}
.drawer.left.on{transform:none}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px 24px}
.d-head h3{font-size:24px;font-weight:700;letter-spacing:-.035em;line-height:1}
.d-head .ibtn{background:var(--panel-2);color:var(--fg)}
.d-body{flex:1;overflow:auto;overscroll-behavior:contain;padding:0 24px}
.d-foot{padding:18px 24px calc(22px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:12px}
.d-foot:empty{display:none}
.d-foot .btn{min-height:56px;font-size:16px}
.line-item{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.line-item .stage{aspect-ratio:1/1;border-radius:16px}
.line-item b{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.2;display:block}
.line-item .li-m{display:block;font-size:13px;color:var(--muted)}
.line-item .rm{min-height:32px;font-size:13px;color:var(--ice);margin-top:2px}
@media (hover:hover) and (pointer:fine){.line-item .rm:hover{text-decoration:underline;text-underline-offset:4px}}
.line-item .lp{font-size:15px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.subtotal{display:flex;justify-content:space-between;align-items:baseline;color:var(--fg-2);font-size:15px}
.subtotal span:last-child{font-size:24px;font-weight:700;color:var(--fg);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.d-note{font-size:12.5px;color:var(--muted)}
.cart-empty{padding:64px 0;text-align:center;display:grid;gap:18px;justify-items:center;color:var(--fg-2)}
.cart-empty .ico{width:44px;height:44px;stroke-width:1.2;color:var(--muted)}
.m-nav{display:grid;grid-template-columns:minmax(0,1fr);padding:10px 24px;overflow:auto}
.m-nav a{font-size:clamp(22px,6.6vw,28px);font-weight:700;letter-spacing:-.035em;line-height:1.1;padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.m-nav a span{min-width:0;overflow-wrap:break-word;hyphens:auto}
.m-nav a .ico{width:20px;height:20px;color:var(--muted)}
.m-langs-l{padding:22px 24px 10px}
.m-langs{display:flex;gap:8px;padding:0 24px calc(22px + env(safe-area-inset-bottom,0px));flex-wrap:wrap}
.m-langs .chip{height:44px;font-size:14px}

.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:90;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 24px);padding:12px 18px;border-radius:999px;background:rgba(243,245,249,.96);color:#0A0C11;font-size:14px;font-weight:700;box-shadow:0 20px 60px -10px rgba(0,0,0,.7);opacity:0;transform:translate(-50%,14px);transition:opacity .18s ease,transform .22s var(--ease-out);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .ico{width:18px;height:18px}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .hero-bag svg,.card{animation:none}
  *,*::before,*::after{transition-property:opacity,background-color,color,border-color,visibility!important;transition-duration:.12s!important}
}

/* kleiner Zufallsgenerator mit festem Startwert: gleiche ID = gleiches Stück */
const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const rng = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; };

const NEUTRAL = ['#ECECE6','#BFC5CC','#23262D'];
function makeLook(seed, fire){
  const r = rng(seed), pick = a => a[Math.floor(r() * a.length)];
  const base = fire ? '#D8342A' : pick(TARP.filter(c => c !== '#23262D'));
  let c2 = pick(TARP); while (c2 === base) c2 = pick(TARP);
  let c3 = pick(TARP); while (c3 === base || c3 === c2) c3 = pick(TARP);
  const m1 = fire ? 'stripes' : pick(['split','band','arc','glyph','glyph','stripes']);
  const m2 = r() < .45 ? pick(['band','stripes','arc','split']) : null;
  const glow = [base, c2].concat(m2 ? [c3] : []).find(c => !NEUTRAL.includes(c)) || '#A6ECFF';
  return {seed, base, c2, c3, m1, m2, glow};
}

const f1 = n => +n.toFixed(1);
function pattern(L, x, y, w, h, salt){
  const r = rng(L.seed + (salt || 0) * 7919);
  const draw = (motif, col) => {
    if (motif === 'split'){ const a = .2 + r() * .6, b = .2 + r() * .6; return `<path d="M${x},${f1(y + h * a)}L${x + w},${f1(y + h * b)}V${y + h}H${x}Z" fill="${col}"/>`; }
    if (motif === 'band'){ const a = .2 + r() * .45, th = .14 + r() * .2, rot = f1(r() * 36 - 18); return `<rect x="${x - w}" y="${f1(y + h * a)}" width="${w * 3}" height="${f1(h * th)}" fill="${col}" transform="rotate(${rot} ${x + w / 2} ${y + h / 2})"/>`; }
    if (motif === 'arc'){ const cx = f1(x + w * (r() < .5 ? .05 + r() * .25 : .7 + r() * .25)), cy = f1(y + h * (.3 + r() * .5)), R = w * (.4 + r() * .3); return `<circle cx="${cx}" cy="${cy}" r="${f1(R)}" fill="${col}"/>` + (r() < .55 ? `<circle cx="${cx}" cy="${cy}" r="${f1(R * .52)}" fill="${L.base}"/>` : ''); }
    if (motif === 'glyph'){ const A = 'TIMELZ0235689RSKAX', fs = f1(Math.max(w, h) * (.95 + r() * .6)); return `<text x="${f1(x + w * (-.2 + r() * .45))}" y="${f1(y + h * .5 + fs * (.28 + r() * .2))}" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="${fs}" letter-spacing="${f1(-fs * .05)}" fill="${col}">${A[Math.floor(r() * A.length)]}${A[Math.floor(r() * A.length)]}</text>`; }
    const n = 2 + Math.floor(r() * 2), th = h * .055, y0 = y + h * (.22 + r() * .4);
    return Array.from({length:n}, (_, i) => `<rect x="${x}" y="${f1(y0 + i * th * 2.1)}" width="${w}" height="${f1(th)}" fill="${col}"/>`).join('');
  };
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${L.base}"/>` + draw(L.m1, L.c2) + (L.m2 ? draw(L.m2, L.c3) : '');
}
let uid = 0;
const shadeDefs = (id, c) => `<linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".36"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".46"/></linearGradient><radialGradient id="f${id}"><stop offset="0" stop-color="${c}" stop-opacity=".6"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`;
/* view: 0 = Vorderseite, 1 = Detail, 2 = Rückseite */
function art(p, view){
  const S = SHAPES[p.m.shape], id = ++uid, [x, y, w, h] = S.box, back = view === 2;
  const paths = S.body.map(d => `<path d="${d}"/>`).join('');
  return `<svg viewBox="${view === 1 ? '120 120 170 170' : '0 0 400 400'}" aria-hidden="true" focusable="false"><defs>${shadeDefs(id, p.c)}<clipPath id="c${id}">${paths}</clipPath></defs>
<ellipse cx="200" cy="370" rx="${Math.round(w * .62)}" ry="15" fill="url(#f${id})"/>
${S.behind}<g clip-path="url(#c${id})">${pattern(p.look, x, y, w, h, back ? 5 : 0)}${back ? '' : S.inside}<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#g${id})"/><g fill="none" stroke="rgba(0,0,0,.26)" stroke-width="12">${paths}</g></g>
<g fill="none" stroke="${RIM}" stroke-width="1.4">${paths}</g>${back ? S.rear : S.over}</svg>`;
}
/* Geschichte in drei Bildern: Plane, Zuschnitt, Tasche */
function processArt(p, step){
  if (step === 3) return art(p, 0);
  const id = ++uid, tarp = rr(46, 62, 308, 196, 8), cut = [rr(84, 86, 118, 148, 16), rr(228, 104, 96, 112, 14)];
  const eyes = Array.from({length:6}, (_, i) => `<circle cx="${70 + i * 52}" cy="78" r="5.5" fill="#0B0D12" stroke="rgba(255,255,255,.55)" stroke-width="1.6"/>`).join('');
  const pat = pattern(p.look, 46, 62, 308, 196, 3);
  let s = `<svg viewBox="0 0 400 320" aria-hidden="true" focusable="false"><defs>${shadeDefs(id, p.c)}<clipPath id="c${id}"><path d="${tarp}"/></clipPath><clipPath id="k${id}">${cut.map(d => `<path d="${d}"/>`).join('')}</clipPath></defs>`;
  s += `<g clip-path="url(#c${id})"${step === 2 ? ' opacity=".3"' : ''}>${pat}<rect x="46" y="62" width="308" height="196" fill="url(#g${id})"/></g>`;
  if (step === 1) s += eyes + `<path d="${tarp}" fill="none" stroke="${RIM}" stroke-width="1.4"/>`;
  else s += `<g clip-path="url(#k${id})">${pat}<rect x="46" y="62" width="308" height="196" fill="url(#g${id})"/></g>` + cut.map(d => `<path d="${d}" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="7 6"/>`).join('');
  return s + '</svg>';
}

function renderFilters(){
  $('#tabs').innerHTML = ['all', ...CATS].map(c => {
    const count = c === 'all' ? PIECES.length : PIECES.filter(p => p.m.cat === c).length;
    return `<button class="tab" data-cat="${c}" aria-pressed="${st.cat === c}">${c === 'all' ? t('all') : t('cat_' + c)}<small>${num(count)}</small></button>`;
  }).join('');
  $$('.cat,#nav-links a[data-cat]').forEach(el => el.setAttribute('aria-current', String(el.dataset.cat === st.cat)));
  const box = $('#models');
  if (st.cat === 'all'){ box.hidden = true; box.innerHTML = ''; return; }
  const ms = Object.values(MODELS).filter(m => m.cat === st.cat && m.count);
  box.hidden = false;
  box.innerHTML = `<button class="chip" data-model="all" aria-pressed="${st.model === 'all'}">${t('all_models')}</button>` +
    ms.map(m => `<button class="chip" data-model="${m.key}" aria-pressed="${st.model === m.key}">${esc(mname(m))}<small>${m.count}</small></button>`).join('');
}

function filtered(){
  const q = norm(st.q.trim());
  let list = PIECES.filter(p => (st.cat === 'all' || p.m.cat === st.cat) && (st.model === 'all' || p.m.key === st.model));
  if (q) list = list.filter(p => norm(`${mname(p.m)} ${t('type_' + p.m.type)} ${p.nr} ${t('cat_' + p.m.cat)} ${p.mats.map(x => t('mat_' + x)).join(' ')}`).includes(q));
  const byName = (a, b) => mname(a.m).localeCompare(mname(b.m)) || (+a.nr - +b.nr);
  if (st.sort === 'asc') list = list.slice().sort((a, b) => a.price - b.price || byName(a, b));
  if (st.sort === 'desc') list = list.slice().sort((a, b) => b.price - a.price || byName(a, b));
  if (st.sort === 'name') list = list.slice().sort(byName);
  return list;
}

const inCart = id => cart.includes(id);
function cardHTML(p, i){
  const c = inCart(p.id);
  return `<article class="card lift" style="--c:${p.c};animation-delay:${Math.min(i % STEP, 12) * 30}ms">
    <div class="card-media">
      <button class="stage" data-open="${p.id}" aria-label="${esc(t('view', {name: label(p)}))}">${art(p, 0)}</button>
      ${nrTag(p)}
      <button class="qadd${c ? ' in' : ''}" data-add="${p.id}" aria-label="${c ? t('in_cart') : t('add')}">${ico(c ? 'check' : 'plus')}</button>
    </div>
    <div class="card-body">
      <button class="card-name" data-open="${p.id}" tabindex="-1">${esc(mname(p.m))}</button>
      <span class="pr">${fmt(p.price)}</span>

    </div>
  </article>`;
}
function loadHTML(shown, total){
  const pct = total ? Math.round(shown / total * 100) : 0;
  return total ? `<span>${t('shown', {x: num(shown), n: num(total)})}</span><span class="bar"><i style="width:${pct}%"></i></span>${shown < total ? `<button class="btn btn-ghost" data-act="more">${t('load_more')}</button>` : ''}` : '';
}
function renderShop(){
  renderFilters();
  const list = filtered();
  const shown = list.slice(0, st.limit);
  $('#count').textContent = t('results', {n: num(list.length)});
  $('#reset').hidden = !(st.cat !== 'all' || st.model !== 'all' || st.q);
  $('#grid').innerHTML = shown.length ? shown.map(cardHTML).join('') : `<p class="empty">${t('empty')}</p>`;
  $('#load').innerHTML = loadHTML(shown.length, list.length);
}
function appendMore(){
  const list = filtered();
  const from = st.limit;
  st.limit += STEP;
  $('#grid').insertAdjacentHTML('beforeend', list.slice(from, st.limit).map((p, i) => cardHTML(p, i)).join(''));
  $('#load').innerHTML = loadHTML(Math.min(st.limit, list.length), list.length);
}

function modalHTML(p){
  const sibs = PIECES.filter(x => x.m === p.m && x !== p).slice(0, 6);
  const c = inCart(p.id);
  const yn = v => v === 1 ? t('yes') : t('no');
  const rows = [];
  if (p.mats.length) rows.push([t('spec_mat'), p.mats.map(x => t('mat_' + x)).join(', ')]);
  if (p.cap) rows.push([t('spec_cap'), p.cap]);
  if (p.dims) rows.push([t('spec_dims'), p.dims]);
  if (p.a4 >= 0) rows.push([t('spec_a4'), yn(p.a4)]);
  if (p.lap >= 0) rows.push([t('spec_laptop'), yn(p.lap)]);
  if (p.fast.length) rows.push([t('spec_fast'), p.fast.map(x => t('fast_' + x)).join(', ')]);
  if (p.pockets) rows.push([t('spec_pockets'), p.pockets]);
  const cur = Math.min(modalImg, 2);
  return `<button class="ibtn m-close" data-act="close" aria-label="${t('close')}">${ico('close')}</button>

    </div>
    <div class="m-info">
      <div class="m-tags"><span class="tag-u">${t('unique')}</span>${nrTag(p)}</div>
      <h2 id="m-title">${esc(mname(p.m))}</h2>

/* ---------- overlays ---------- */
function lock(on){ document.documentElement.style.overflow = on ? 'hidden' : ''; }
function openModal(id, keepImg){
  const p = BYID[id]; if (!p) return;
  const m = $('#modal');
  const wasOpen = m.classList.contains('on');
  closeDrawers();
  if (!keepImg) modalImg = 0;
  const switching = wasOpen && modalId !== id;
  modalId = id;
  m.innerHTML = modalHTML(p);
  if (switching) m.scrollTop = 0;
  if (!wasOpen){
    lastFocus = document.activeElement;
    m.scrollTop = 0;
    $('#scrim').classList.add('on');
    m.classList.add('on');
    lock(true);
    setTimeout(() => { const b = m.querySelector('.m-close'); if (b) b.focus({preventScroll:true}); }, 60);
  }
}
function openDrawer(id){
  const wasModal = $('#modal').classList.contains('on');
  $('#modal').classList.remove('on'); modalId = null;
  closeDrawers();
  if (!wasModal) lastFocus = document.activeElement;
  $('#scrim').classList.add('on');
  const d = $('#' + id); d.classList.add('on');
  lock(true);
  setTimeout(() => { const b = d.querySelector('[data-act="close"]'); if (b) b.focus({preventScroll:true}); }, 60);
}
function closeDrawers(){ $$('.drawer').forEach(d => d.classList.remove('on')); }
function closeAll(){
  const any = $('#scrim').classList.contains('on');
  $('#modal').classList.remove('on'); modalId = null;
  closeDrawers();
  $('#scrim').classList.remove('on');
  lock(false);
  if (any && lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true});
}
let toastTimer;
function toast(msg){
  const el = $('#toast');
  el.innerHTML = ico('check') + '<span></span>';
  el.querySelector('span').textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2600);
}
function scrollToShop(){ $('#shop').scrollIntoView({behavior: smooth(), block:'start'}); }

function addToCart(id){
  if (inCart(id)){ openDrawer('cart'); return; }
  cart.push(id);
  renderCart(); syncAddButtons();
  if (modalId) openModal(modalId, true);
  toast(t('added', {name: label(BYID[id])}));
}

function renderAll(){
  applyI18n(); renderHero(); renderIntro(); renderRail(); renderSpots(); renderStory(); renderShop(); renderCart();
  if (modalId) $('#modal').innerHTML = modalHTML(BYID[modalId]);
}
function setLang(l){
  if (!I18N[l]) return;
  lang = l;
  try { localStorage.setItem('tlz-lang', l); } catch (e) {}
  renderAll();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const langBtn = e.target.closest('.lang-btn');
  const L = $('#lang');
  if (langBtn){ const o = !L.classList.contains('open'); L.classList.toggle('open', o); langBtn.setAttribute('aria-expanded', o); return; }
  if (!e.target.closest('#lang')){ L.classList.remove('open'); $('.lang-btn').setAttribute('aria-expanded', 'false'); }
  const el = e.target.closest('[data-lang],[data-add],[data-open],[data-img],[data-rm],[data-cat],[data-model],[data-hero],[data-act]');
  if (!el) return;
  const d = el.dataset;
  if (d.lang){ setLang(d.lang); L.classList.remove('open'); return; }
  if (d.hero){ heroAuto = false; heroIdx = +d.hero; renderHero(true); return; }
  if (d.add){ addToCart(d.add); return; }
  if (d.open){ openModal(d.open); return; }
  if (d.img){ modalImg = +d.img; openModal(modalId, true); return; }
  if (d.rm){ cart.splice(cart.indexOf(d.rm), 1); renderCart(); syncAddButtons(); return; }
  if (d.cat){
    e.preventDefault();
    st.cat = d.cat; st.model = 'all'; st.limit = STEP; renderShop();
    if (!el.closest('#tabs')){ closeAll(); scrollToShop(); }
    return;
  }
  if (d.model){
    if (d.model !== 'all') st.cat = MODELS[d.model].cat;
    st.model = d.model; st.limit = STEP; renderShop();
    if (d.jump){ closeAll(); setTimeout(scrollToShop, 30); }
    return;
  }
  switch (d.act){
    case 'note': $('#preview').hidden = true; break;
    case 'menu': openDrawer('menu'); break;
    case 'cart': openDrawer('cart'); break;
    case 'close': case 'continue': case 'nav': closeAll(); break;
    case 'search': closeAll(); scrollToShop(); setTimeout(() => $('#q').focus({preventScroll:true}), reduce ? 0 : 450); break;
    case 'checkout': toast(t('checkout_toast')); break;
    case 'more': appendMore(); break;
    case 'rail-prev': $('#rail').scrollBy({left: -($('#rail').clientWidth * .8), behavior: smooth()}); break;
    case 'rail-next': $('#rail').scrollBy({left: $('#rail').clientWidth * .8, behavior: smooth()}); break;
    case 'reset': st.cat = 'all'; st.model = 'all'; st.q = ''; st.limit = STEP; $('#q').value = ''; renderShop(); break;
  }
});
$('#q').addEventListener('input', e => { st.q = e.target.value; st.limit = STEP; renderShop(); });
$('#sort').addEventListener('change', e => { st.sort = e.target.value; st.limit = STEP; renderShop(); });
$('#news-form').addEventListener('submit', e => { e.preventDefault(); toast(t('news_toast')); e.target.reset(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeAll(); $('#lang').classList.remove('open'); return; }
  if (modalId && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')){
    modalImg = (modalImg + (e.key === 'ArrowRight' ? 1 : -1) + 3) % 3;
    openModal(modalId, true);
  }
});

renderAll();
})();
</script>
</body>
</html>
